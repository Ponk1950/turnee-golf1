<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Turnee Golf</title>

<style>
:root{
  --green:#1f6f43; --green-dark:#13502f; --green-light:#e8f3ec;
  --cream:#faf7f0; --paper:#ffffff; --ink:#1a1a1a; --muted:#666;
  --line:#d8d4c8; --line-soft:#ebe7d9;
  --warn:#b8651b; --bad:#a31b1b; --good:#1f6f43;
  --shadow:0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
  --r:10px;
  --pad: env(safe-area-inset-bottom, 0);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--cream);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
input,button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:transparent}
h1,h2,h3,h4{font-family:Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.1rem} h4{font-size:1rem}
hr{border:0;border-top:1px solid var(--line-soft);margin:1rem 0}
small{color:var(--muted);font-size:.85rem}
a{color:var(--green-dark)}

/* Layout */
#app{flex:1;display:flex;flex-direction:column;min-height:0}
.topbar{background:var(--green);color:#fff;padding:.7rem 1rem;
padding-top:calc(.7rem + env(safe-area-inset-top));
display:flex;align-items:center;gap:.6rem;position:sticky;top:0;z-index:50}
.topbar .brand{font-family:Georgia,serif;font-size:1.15rem;font-weight:600;flex:1}
.topbar .who{font-size:.8rem;opacity:.85}
.topbar button{color:#fff;font-size:.85rem;padding:.35rem .65rem;border-radius:6px;background:rgba(255,255,255,.15)}
.topbar button:active{background:rgba(255,255,255,.28)}
.topnav{display:none;background:var(--green-dark);padding:0 1rem;gap:.2rem;overflow-x:auto}
.topnav button{color:#fff;padding:.7rem .9rem;font-size:.9rem;border-radius:0;white-space:nowrap;opacity:.78}
.topnav button.active{opacity:1;border-bottom:3px solid #fff}
.topnav button:active{opacity:1;background:rgba(255,255,255,.1)}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem;padding-bottom:calc(5rem + var(--pad))}

/* Bottom tab bar (mobile) */
.tabbar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);
display:flex;justify-content:space-around;padding-bottom:var(--pad);z-index:40}
.tabbar button{flex:1;padding:.6rem .25rem;display:flex;flex-direction:column;align-items:center;
gap:.15rem;font-size:.7rem;color:var(--muted);min-height:56px;justify-content:center}
.tabbar button.active{color:var(--green)}
.tabbar .ico{font-size:1.4rem;line-height:1}

/* Sub-tab bar (e.g. Side Games: Best Ball / Nassau / Skins). Different from
   the bottom .tabbar — this is an inline horizontal switcher with an active
   underline. Bug #8 fix: previously had no CSS at all, so active state was
   invisible. */
.tab-bar{display:flex;gap:.3rem;border-bottom:2px solid var(--line);padding-bottom:0;margin-bottom:1rem}
.tab-bar .tab{background:transparent;border:0;padding:.5rem 1rem;font-size:.95rem;
font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;
margin-bottom:-2px;border-radius:0}
.tab-bar .tab:hover{color:var(--text)}
.tab-bar .tab.active{color:var(--green);border-bottom-color:var(--green);font-weight:700}

/* Cards & rows */
.card{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--r);
padding:1rem;margin-bottom:.8rem;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:.6rem}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:.3rem}
.stack>*+*{margin-top:.7rem}
.grid{display:grid;gap:.6rem}
.grid.g2{grid-template-columns:1fr 1fr}
.grid.g3{grid-template-columns:repeat(3,1fr)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
padding:.7rem 1rem;border-radius:8px;background:var(--green);color:#fff;
font-weight:500;font-size:.95rem;min-height:44px;border:1px solid transparent}
.btn:active{background:var(--green-dark)}
.btn.secondary{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.secondary:active{background:var(--cream)}
.btn.ghost{background:transparent;color:var(--green-dark);padding:.4rem .6rem}
.btn.danger{background:var(--bad)}
.btn.small{padding:.4rem .7rem;font-size:.85rem;min-height:36px}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.btn-row{display:flex;gap:.5rem;flex-wrap:wrap}

/* Form */
label{display:block;margin-bottom:.35rem;font-size:.85rem;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=email],input[type=password],select,textarea{
width:100%;padding:.7rem .8rem;border:1px solid var(--line);border-radius:8px;background:var(--paper);
font-size:1rem;min-height:44px;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:-1px;border-color:var(--green)}
.field{margin-bottom:.8rem}
.checkbox{display:flex;align-items:center;gap:.5rem;padding:.5rem 0;min-height:44px}
.checkbox input{width:22px;height:22px;margin:0}

/* Pills / tags */
.pill{display:inline-block;padding:.15rem .5rem;border-radius:999px;font-size:.75rem;
background:var(--green-light);color:var(--green-dark);font-weight:500}
.pill.muted{background:var(--cream);color:var(--muted)}
.pill.warn{background:#fcefdc;color:var(--warn)}
.pill.bad{background:#fae0e0;color:var(--bad)}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:.5rem .6rem;text-align:left;border-bottom:1px solid var(--line-soft)}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--cream)}
tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:var(--r);background:var(--paper)}

/* Step indicator */
.steps{display:flex;gap:.3rem;margin-bottom:1rem;overflow-x:auto;padding-bottom:.3rem}
.steps button{flex:0 0 auto;padding:.45rem .7rem;border-radius:999px;background:var(--cream);
border:1px solid var(--line-soft);font-size:.78rem;color:var(--muted);white-space:nowrap}
.steps button.active{background:var(--green);color:#fff;border-color:var(--green)}
.steps button.done{background:var(--green-light);color:var(--green-dark);border-color:var(--green-light)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;
justify-content:center;z-index:100;padding:1rem}
@media(min-width:600px){.modal-bg{align-items:center}}
.modal{background:var(--paper);border-radius:14px;width:100%;max-width:480px;max-height:90vh;
overflow-y:auto;padding:1.2rem;box-shadow:0 8px 40px rgba(0,0,0,.2)}

/* Toast */
.toast{position:fixed;bottom:calc(70px + var(--pad));left:50%;transform:translateX(-50%);
background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:999px;font-size:.85rem;
z-index:200;animation:toastIn .25s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* Login screen */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:1rem}
.login-card{background:var(--paper);border-radius:18px;padding:1.6rem;width:100%;max-width:380px;
box-shadow:0 4px 30px rgba(0,0,0,.08);border:1px solid var(--line-soft)}
.login-logo{font-family:Georgia,serif;font-size:1.8rem;text-align:center;color:var(--green-dark);margin-bottom:.2rem}
.login-tag{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:1.4rem}
.user-list{display:flex;flex-direction:column;gap:.4rem;max-height:40vh;overflow-y:auto;
border:1px solid var(--line-soft);border-radius:10px;padding:.4rem;background:var(--cream)}
.user-item{padding:.6rem .7rem;background:var(--paper);border-radius:7px;border:1px solid var(--line-soft);
display:flex;align-items:center;gap:.5rem}
.user-item:active{background:var(--green-light)}
.user-item .nm{flex:1;font-weight:500}
.user-item .rl{font-size:.7rem;color:var(--muted);text-transform:uppercase}

/* Score input */
.score-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:.3rem}
.score-cell{display:flex;flex-direction:column;align-items:center;background:var(--cream);
border-radius:7px;padding:.3rem;border:1px solid var(--line-soft)}
.score-cell .h{font-size:.65rem;color:var(--muted);font-weight:600}
.score-cell .p{font-size:.65rem;color:var(--muted)}
.score-cell input{padding:.3rem;text-align:center;font-size:1.1rem;font-weight:600;min-height:36px;
border:1px solid var(--line);border-radius:5px;width:100%}
.score-cell input.under{color:var(--good)}
.score-cell input.over{color:var(--bad)}

/* Leaderboard */
.lb-row{display:grid;grid-template-columns:32px 1fr auto auto;gap:.5rem;padding:.6rem .8rem;
border-bottom:1px solid var(--line-soft);align-items:center;background:var(--paper)}
.lb-row:nth-child(odd){background:var(--cream)}
.lb-row .pos{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.lb-row .nm{font-weight:500}
.lb-row .scr{font-variant-numeric:tabular-nums;font-weight:600}
.lb-row .rel{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;min-width:48px;text-align:right}
.lb-row.qualifier{background:var(--green-light)}
.lb-row.qualifier:nth-child(odd){background:#dde9e1}

/* Pairings */
.group{border:1px solid var(--line-soft);border-radius:var(--r);background:var(--paper);margin-bottom:.7rem;overflow:hidden}
.group-hdr{padding:.6rem .8rem;background:var(--green);color:#fff;font-weight:600;display:flex;justify-content:space-between}
.group-body{padding:.4rem .8rem}
.group-mem{padding:.4rem 0;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center}
.group-mem:last-child{border-bottom:0}

/* Empty states */
.empty{text-align:center;padding:2rem 1rem;color:var(--muted)}
.empty .ico{font-size:2rem;margin-bottom:.4rem}

/* Print */
@media print{
.topbar,.tabbar,.topnav,.no-print,.steps{display:none !important}
body,html,main{background:#fff;color:#000;padding:0}
main{padding:0;overflow:visible}
.card{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid}
table{font-size:11pt}
h1{font-size:18pt} h2{font-size:14pt}
}

/* Desktop */
@media(min-width:780px){
.tabbar{display:none}
.topnav{display:flex}
main{padding:1.5rem 2rem;padding-bottom:2rem;max-width:1200px;margin:0 auto;width:100%}
.grid.g2-md{grid-template-columns:1fr 1fr}
}
</style>

<script>
"use strict";
// ============================================================================
// TURNEE GOLF — single-file tournament management
// All state in localStorage. No server, no build step. Edit this file directly.
// ============================================================================

// —– Utilities ————————————————————
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},...kids)=>{
const e=document.createElement(t);
for(const k in a){
if(k==='class')e.className=a[k];
else if(k==='style'&&typeof a[k]==='object')Object.assign(e.style,a[k]);
else if(k.startsWith('on')&&typeof a[k]==='function')e.addEventListener(k.slice(2).toLowerCase(),a[k]);
else if(k==='html')e.innerHTML=a[k];
else if(a[k]===true)e.setAttribute(k,'');
else if(a[k]!==false&&a[k]!=null)e.setAttribute(k,a[k]);
}
for(const k of kids.flat()){
if(k==null||k===false)continue;
e.appendChild(typeof k==='string'||typeof k==='number'?document.createTextNode(k):k);
}
return e;
};
const uid=()=>Math.random().toString(36).slice(2,10);
const fmtDate=d=>{if(!d)return '';const x=new Date(d+'T12:00:00');return x.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})};
const sortBy=(arr,fn)=>arr.slice().sort((a,b)=>{const x=fn(a),y=fn(b);return x<y?-1:x>y?1:0});
const sum=arr=>arr.reduce((a,b)=>a+(+b||0),0);
const toast=(msg)=>{const t=el('div',{class:'toast'},msg);document.body.appendChild(t);setTimeout(()=>t.remove(),1800)};
const confirm2=(msg)=>window.confirm(msg);

// ── GPS / distance helpers ─────────────────────────────────────────────────
// Returns yards between two lat/lng pairs using the haversine formula. Earth
// radius 6371000m, then converted to yards (1m = 1.0936yd).
function distanceYards(lat1,lng1,lat2,lng2){
const toRad=d=>d*Math.PI/180;
const dLat=toRad(lat2-lat1);
const dLng=toRad(lng2-lng1);
const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)*Math.sin(dLng/2);
const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
return Math.round(6371000*c*1.0936);
}
function getGpsOnce(opts){
return new Promise(function(resolve,reject){
if(!navigator.geolocation){reject(new Error('Geolocation not supported'));return;}
navigator.geolocation.getCurrentPosition(
function(p){resolve({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy});},
function(e){reject(e);},
Object.assign({enableHighAccuracy:true,timeout:15000,maximumAge:0},opts||{})
);
});
}
// Collect multiple GPS samples and return a robust median of the best ones.
// Single getCurrentPosition often returns a stale cached value or a coarse
// WiFi-derived fix (±50-100m), which is useless for green tagging. Watching
// for several seconds lets the GPS chip lock in (~±5-10m typical), and taking
// the median of the best 60% throws out the warm-up garbage.
//
// onProgress({count, target, accuracy, kept}) called on every sample so the UI
// can show a live "sample 4 of 15, ±12m" readout.
function getGpsAveraged(targetSamples,maxMs,onProgress){
const TGT=targetSamples||15;
const MAX=maxMs||25000;
return new Promise(function(resolve,reject){
if(!navigator.geolocation){reject(new Error('Geolocation not supported'));return;}
const samples=[];
let watchId=null,timeoutId=null,done=false;
const cleanup=()=>{
if(watchId!=null){try{navigator.geolocation.clearWatch(watchId);}catch(e){}watchId=null;}
if(timeoutId){clearTimeout(timeoutId);timeoutId=null;}
};
const finish=()=>{
if(done)return;done=true;cleanup();
if(samples.length<3){reject(new Error('Only got '+samples.length+' GPS samples'));return;}
// Sort by accuracy ascending, keep best 60% (min 3)
const sorted=samples.slice().sort(function(a,b){return a.accuracy-b.accuracy;});
const keepCount=Math.max(3,Math.ceil(sorted.length*0.6));
const kept=sorted.slice(0,keepCount);
// Median lat/lng of kept samples (robust to outliers)
const med=function(arr){
const s=arr.slice().sort(function(a,b){return a-b;});
const n=s.length;return n%2?s[(n-1)>>1]:(s[n/2-1]+s[n/2])/2;
};
resolve({
lat:med(kept.map(function(s){return s.lat;})),
lng:med(kept.map(function(s){return s.lng;})),
accuracy:kept[0].accuracy,
samplesUsed:kept.length,
samplesTotal:samples.length
});
};
watchId=navigator.geolocation.watchPosition(
function(p){
samples.push({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy});
if(onProgress){
try{onProgress({count:samples.length,target:TGT,accuracy:p.coords.accuracy});}catch(e){}
}
if(samples.length>=TGT)finish();
},
function(err){
// Only fail if we haven't gotten anything; otherwise let timeout handle it
if(samples.length===0){cleanup();reject(err);}
},
{enableHighAccuracy:true,maximumAge:0,timeout:MAX}
);
timeoutId=setTimeout(function(){
if(samples.length>=3)finish();
else{cleanup();reject(new Error('GPS timeout — only '+samples.length+' samples'));}
},MAX);
});
}
// Maps a hole number (1-based) to the index of its green (0-based) on the course.
// Most courses: 18 holes, 18 unique greens — green index = hole - 1.
// Lasalle-style 9-hole layouts played twice: green count is 9, so hole 10
// shares green 1 (index 0), hole 11 shares green 2 (index 1), etc.
function greenIndexForHole(course,holeNum){
const greens=course&&course.greens?course.greens:18;
const idx=(holeNum-1)%greens;
return idx<0?0:idx;
}

// Returns true if it's OK to navigate; if there are pending unsaved selections, prompts the user.
// OK = save and continue; Cancel = stay on current step.
function checkPendingSave(){
const ps=State.pendingSave;
if(!ps||!ps.count)return true;
const msg='You have '+ps.count+' '+ps.label+' selected but not saved.\n\n'+
'OK = Save them now and continue.\n'+
'Cancel = Stay here.';
if(window.confirm(msg)){
try{ps.save()}catch(e){console.error(e)}
State.pendingSave=null;
return true;
}
return false;
}
// ============================================================================
// FORMAT RULES TABLE — edit here to change tournament behavior per format
// ============================================================================
// ============================================================================
// SPORT MODULE ARCHITECTURE
// Each sport defines its own terminology, scoring units, entrant labels,
// and which core features are active. The FORMAT_RULES table then references
// the sport module for display/label decisions.
// To add a new sport: add an entry to SPORT_MODULES, create its formats in
// FORMAT_RULES with sport:'your_sport', done — core is untouched.
// ============================================================================
const SPORT_MODULES={
  golf:{
    label:'Golf',
    version:'v1.0',
    // Terminology — used throughout UI instead of hardcoded strings
    terms:{
      entrant:'Golfer',    entrants:'Golfers',
      group:'Group',       groups:'Groups',
      score:'Score',       scoring:'Scoring',
      unit:'Hole',         units:'Holes',
      skill:'Handicap',    venue:'Course',
      heat:'Round',        heats:'Rounds',
    },
    // Which core features are active for this sport
    features:{
      handicap:true,
      carts:true,
      holes:true,
      scorecardEntry:true,
      maxStrokes:true,
      scat:true,
      teamScoring:true,
      brackets:true,
    },
    // Score entry mode: 'holes' = per-hole entry, 'total' = single total, 'match' = W/L
    scoreEntry:'holes',
    // Score direction: 'low' = lowest wins, 'high' = highest wins
    scoreDir:'low',
  },
  fishing:{
    label:'Fishing',
    version:'v0.1',
    terms:{
      entrant:'Angler',    entrants:'Anglers',
      group:'Boat',        groups:'Boats',
      score:'Weight',      scoring:'Weigh-In',
      unit:'Fish',         units:'Fish',
      skill:'Skill Level', venue:'Body of Water',
      heat:'Day',          heats:'Days',
    },
    features:{
      handicap:false,
      carts:false,
      holes:false,
      scorecardEntry:false,
      maxStrokes:false,
      scat:false,
      teamScoring:true,
      brackets:false,
    },
    scoreEntry:'total',
    scoreDir:'high',
  },
  pickleball:{
    label:'Pickleball',
    version:'v0.1',
    terms:{
      entrant:'Player',    entrants:'Players',
      group:'Court',       groups:'Courts',
      score:'Points',      scoring:'Scoring',
      unit:'Game',         units:'Games',
      skill:'Skill Rating',venue:'Facility',
      heat:'Round',        heats:'Rounds',
    },
    features:{
      handicap:false,
      carts:false,
      holes:false,
      scorecardEntry:false,
      maxStrokes:false,
      scat:false,
      teamScoring:true,
      brackets:true,
    },
    scoreEntry:'match',
    scoreDir:'high',
  },
  softball:{
    label:'Softball',
    version:'v0.1',
    terms:{
      entrant:'Player',    entrants:'Players',
      group:'Field',       groups:'Fields',
      score:'Runs',        scoring:'Scoring',
      unit:'Inning',       units:'Innings',
      skill:'Skill Level', venue:'Complex',
      heat:'Round',        heats:'Rounds',
    },
    features:{
      handicap:false,
      carts:false,
      holes:false,
      scorecardEntry:false,
      maxStrokes:false,
      scat:false,
      teamScoring:true,
      brackets:true,
    },
    scoreEntry:'total',
    scoreDir:'high',
  },
};

// Active sport — set from org record at login, defaults to golf
// When multi-sport platform is built this reads from the authenticated org
const ACTIVE_SPORT='golf';
const SM=()=>SPORT_MODULES[ACTIVE_SPORT]||SPORT_MODULES.golf;
const T=(key)=>(SM().terms[key]||key);  // T('entrant') -> 'Golfer'
const HAS=(feature)=>!!(SM().features[feature]);  // HAS('handicap') -> true

// ============================================================================
// FORMAT RULES TABLE
// sport field links format to its sport module.
// All other fields drive tournament logic — edit here, nowhere else.
// ============================================================================
const FORMAT_RULES={
// ── Golf: Stroke / Scramble ────────────────────────────────────────────────

// Idempotent migrations applied on every load. Each migration only runs if
// the data still matches the old default (i.e. user hasn't customized it).
// Bumping SEED_VERSION re-seeds and wipes local data, so we use migrations
// for targeted updates that preserve user edits.
function applyMigrations(){
const courses=load(KEYS.courses,[]);
let dirty=false;
const lcc=courses.find(c=>c.id==='crs-lcc');
if(lcc&&lcc.par){
const oldDefault=[4,5,3,4,4,3,5,4,4,4,3,5,4,4,3,4,5,4];
if(lcc.par.length===18&&lcc.par.every((v,i)=>v===oldDefault[i])){
lcc.par=[5,4,3,4,3,4,3,5,4,5,4,4,4,3,4,4,5,4];
dirty=true;
}

// Ensure every course has a holeGreens array sized to its hole count.
// holeGreens[i] = {lat, lng} once tagged, or null until the admin walks the green.
// Idempotent: only allocates the slot if missing.
function migrateHoleGreens(){
const courses=load(KEYS.courses,[]);
let dirty=false;
for(const c of courses){
const want=c.greens||(c.par?c.par.length:18);
if(!Array.isArray(c.holeGreens)||c.holeGreens.length!==want){
const next=Array(want).fill(null);
if(Array.isArray(c.holeGreens)){
for(let i=0;i<Math.min(c.holeGreens.length,want);i++){
next[i]=c.holeGreens[i]||null;
}
}
c.holeGreens=next;dirty=true;
}
}
if(dirty)save(KEYS.courses,courses);
}

// Verification records — store rangefinder ground-truth measurements alongside
// the GPS-calculated distance so admins can see which greens are tagged
// accurately and which need re-tagging. Marketing claim for high-school golf:
// "Course distances laser-verified — used for setup, not during play."
// Each course.holeVerifications[greenIdx] is an array of records:
//   {calculated: 132, actual: 152, position: {lat,lng,accuracy}, ts: '...', verifierName: '...'}
function migrateGreenVerifications(){
const courses=load(KEYS.courses,[]);

for(const c of courses){
const want=c.greens||(c.par?c.par.length:18);
if(!Array.isArray(c.holeVerifications)||c.holeVerifications.length!==want){
const next=Array(want).fill(null).map(function(){return [];});
if(Array.isArray(c.holeVerifications)){
for(let i=0;i<Math.min(c.holeVerifications.length,want);i++){
next[i]=Array.isArray(c.holeVerifications[i])?c.holeVerifications[i]:[];

// Generate a username from a display name. Prefers the name as-is when it's
// already a clean alphanumeric/underscore string (e.g. "admin", "scorer1").
// Otherwise uses first + last-initial + 2-digit suffix (e.g. "Dave Fuqua" -> "davef01").
function generateUsername(displayName,existingSet){
const dn=(displayName||'').trim();
const onlyOk=new RegExp('^[a-z0-9_]+$');
const stripChars=new RegExp('[^a-z0-9]','g');
const wsplit=new RegExp('\\s+');
// Already a clean username? Use it as-is if free
const lower=dn.toLowerCase();
if(onlyOk.test(lower)&&lower.length>=3&&!existingSet.has(lower))return lower;
// Build base: first word + first letter of last word
const parts=dn.split(wsplit).filter(Boolean);
let base;
if(parts.length===0)base='user';
else if(parts.length===1)base=parts[0].toLowerCase().replace(stripChars,'');
else base=(parts[0]+parts[parts.length-1].charAt(0)).toLowerCase().replace(stripChars,'');
if(!base)base='user';
// Find first available "base + NN"
for(let i=1;i<1000;i++){
const cand=base+(i<10?'0':'')+String(i);
if(!existingSet.has(cand))return cand;
}
return base+String(Date.now());
}

// Role helpers
const ROLE_PAGES={
admin:['tournaments','scoring','leaderboard','people','teams','orgs','courses','users','sidegames','dashboard','helpqueue'],
director:['tournaments','scoring','leaderboard','teams','orgs','courses','sidegames','dashboard'],
scorer:['scoring','leaderboard'],
golfer:['scoring','leaderboard','sidegames'],
fan:['leaderboard'],
};
const ROLE_LIST=['admin','director','scorer','golfer','fan'];
const ROLE_LABEL={admin:'Admin',director:'Director',scorer:'Scorer',golfer:'Golfer',fan:'Fan'};
const ROLE_RANK={admin:0,director:1,scorer:2,golfer:3,fan:4};

// Multi-role / multi-org / multi-membership helpers.
// Canonical fields:
//   user.golferId        — optional link to a Person record (DB.golfers)
//   user.globalRoles[]   — roles that apply regardless of active org (typically ['admin'])
//   user.memberships[]   — array of {orgId, roles:[]} for per-org roles
// Legacy mirrors kept in sync by normalizeUser():
//   user.role, user.roles, user.orgId, user.orgIds
function userMemberships(u){
if(!u)return [];
return Array.isArray(u.memberships)?u.memberships:[];
}
function userGlobalRoles(u){
if(!u)return [];
return Array.isArray(u.globalRoles)?u.globalRoles:[];
}
function userOrgIds(u){
return userMemberships(u).map(m=>m.orgId).filter(Boolean);
}
// All roles the user holds anywhere (global + every membership) — used for display.
function userRoles(u){
const out=new Set();
for(const r of userGlobalRoles(u))out.add(r);
for(const m of userMemberships(u))for(const r of (m.roles||[]))out.add(r);
if(!out.size&&u&&u.role)out.add(u.role); // fallback for unmigrated users
return Array.from(out).sort((a,b)=>(ROLE_RANK[a]==null?9:ROLE_RANK[a])-(ROLE_RANK[b]==null?9:ROLE_RANK[b]));
}
// The roles that apply right now given the active org context.
// If activeOrgId is set: globalRoles + that membership's roles.
// If activeOrgId is null: globalRoles + union of all membership roles.
function userActiveRoles(u,orgId){
const out=new Set();
for(const r of userGlobalRoles(u))out.add(r);
const ms=userMemberships(u);
if(orgId){
const m=ms.find(x=>x.orgId===orgId);
if(m)for(const r of (m.roles||[]))out.add(r);
}else{
for(const m of ms)for(const r of (m.roles||[]))out.add(r);
}
if(!out.size&&u&&u.role)out.add(u.role); // ultra-fallback
return Array.from(out);
}
function userHasRole(u,r){return userRoles(u).indexOf(r)>=0;}
function userHasActiveRole(u,r,orgId){return userActiveRoles(u,orgId).indexOf(r)>=0;}
function userPages(u){
const roles=userActiveRoles(u,activeOrgId());
const out=new Set();
for(const r of roles){
const ps=ROLE_PAGES[r]||[];
for(const p of ps)out.add(p);
}
return Array.from(out);
}
function primaryRole(u){
const rs=userRoles(u);
return rs.length?rs[0]:'fan';
}

// Display name. If linked to a golfer record use that; else fall back to user.name.
function userDisplayName(u){
if(!u)return '';
if(u.golferId){
const g=DB.golfers().find(x=>x.id===u.golferId);
if(g)return g.name;
}
return u.name||'(unnamed)';
}

function normalizeUser(u){
if(!u)return u;
// Build memberships array if missing — convert legacy orgId/orgIds + role/roles.
if(!Array.isArray(u.memberships)){
const legacyRoles=Array.isArray(u.roles)&&u.roles.length?u.roles.slice():(u.role?[u.role]:[]);
const legacyOrgs=Array.isArray(u.orgIds)?u.orgIds.slice():(u.orgId?[u.orgId]:[]);
const ms=[];
const globals=[];
// 'admin' role with no orgs → platform admin (globalRoles)
if(legacyRoles.indexOf('admin')>=0&&!legacyOrgs.length){
globals.push('admin');
const otherRoles=legacyRoles.filter(r=>r!=='admin');
// other roles without org context become global too (rare, but safe)
for(const r of otherRoles)if(globals.indexOf(r)<0)globals.push(r);
}else{
// Each org gets a membership with the legacy roles
for(const oid of legacyOrgs){
ms.push({orgId:oid,roles:legacyRoles.slice()});
}
// If user has roles but no orgs (e.g. fan/scorer with no org), keep as global
if(legacyRoles.length&&!legacyOrgs.length){
for(const r of legacyRoles)if(globals.indexOf(r)<0)globals.push(r);
}
}
u.memberships=ms;
u.globalRoles=globals;
}
if(!Array.isArray(u.globalRoles))u.globalRoles=[];
// Sanitize memberships — drop entries with no orgId or empty roles
u.memberships=u.memberships.filter(m=>m&&m.orgId&&Array.isArray(m.roles)&&m.roles.length);
// Dedupe roles within each membership and within globalRoles
const cleanRoles=(arr)=>{
const seen=new Set();
return arr.filter(r=>{if(!ROLE_PAGES[r]||seen.has(r))return false;seen.add(r);return true;});
};
u.globalRoles=cleanRoles(u.globalRoles);
u.memberships=u.memberships.map(m=>({orgId:m.orgId,roles:cleanRoles(m.roles)})).filter(m=>m.roles.length);
// Keep legacy mirrors in sync
const allRoles=userRoles(u);
u.roles=allRoles.slice();
u.role=allRoles[0]||'fan';
const orgIds=userOrgIds(u);
u.orgIds=orgIds.slice();
u.orgId=orgIds[0]||null;
// golferId stays as-is (or remains undefined for system accounts)
return u;
}

// Returns the org id the user is "operating under" right now. State.activeOrgId
// is the session selection; falls back to the user's first membership.
function activeOrgId(){
if(State.activeOrgId)return State.activeOrgId;
if(!State.user)return null;
const orgs=userOrgIds(State.user);
return orgs[0]||null;
}

// Export every dg: localStorage key as a single JSON blob.
// Used to ship live tournament data back to dev for seed-data baking.
function showExportBackup(){
const payload={app:APP_BUILD,seedVersion:SEED_VERSION,exportedAt:new Date().toISOString(),data:{}};
const collect=(k)=>{if(k&&k.indexOf('dg:')===0){const v=_lsGet(k);if(v!=null)payload.data[k]=v;}};
try{
// Real localStorage
if(typeof localStorage!=='undefined'){
for(let i=0;i<localStorage.length;i++)collect(localStorage.key(i));
}
// In-memory fallback (Safari Private mode etc.)
if(typeof _mem==='object'&&_mem){
for(const k in _mem)if(Object.prototype.hasOwnProperty.call(_mem,k))collect(k);
}
// Also explicitly cover known KEYS in case anything was missed
if(typeof KEYS==='object'){
for(const propName in KEYS)collect(KEYS[propName]);
}
}catch(e){toast('Storage read failed: '+e.message);return;}
const json=JSON.stringify(payload,null,2);
const bg=el('div',{class:'modal-bg',onclick:e=>{if(e.target===bg)bg.remove()}});
const ta=el('textarea',{readonly:'readonly',
style:{width:'100%',height:'14rem',fontFamily:'monospace',fontSize:'.75rem',
boxSizing:'border-box',border:'1px solid var(--line)',borderRadius:'8px',padding:'.5rem'}});
ta.value=json;
const keyCount=Object.keys(payload.data).length;
const sizeKb=Math.round(json.length/1024);
const m=el('div',{class:'modal',style:{maxWidth:'42rem'}},
el('h3',{},'Export Backup'),
el('small',{},'Tap "Copy" then paste back to Claude. '+keyCount+' keys, '+sizeKb+' KB.'),

ta,
el('div',{style:{height:'.6rem'}}),
el('div',{class:'btn-row'},
el('button',{class:'btn',onclick:()=>{
ta.select();
let ok=false;
try{
if(navigator&&navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(json);ok=true;
}else{
ok=document.execCommand&&document.execCommand('copy');
}
}catch(e){ok=false;}
toast(ok?'Copied to clipboard':'Copy failed — select all and copy manually');
}},'Copy'),
el('button',{class:'btn ghost',onclick:()=>bg.remove()},'Close'))
);
bg.appendChild(m);document.body.appendChild(bg);
setTimeout(function(){try{ta.focus();ta.select();}catch(e){}},50);

// ── Scorer-pack export / import ────────────────────────────────────────────
// Workflow: director builds event, locks pairings, exports a per-group pack
// to each scorer. Scorer imports on their phone, sees ONLY their group, scores
// hole-by-hole during play, then exports a score-return pack at end of round.
// Director imports the score-return on their device, scores merge into the
// live event without touching anything else.
//
// Two pack types:
//   'scorer-handoff' — director → scorer. Self-contained event view scoped
//                      to one pairing.
//   'score-return'   — scorer → director. Just the scored holes for that
//                      pairing's golfers, merge target identified by
//                      tournament id + pairing id.
//
// DB phase: this whole flow gets replaced by Supabase Realtime subscriptions
// and proper RLS policies. The pack format stays useful as offline fallback.

function buildScorerPack(tournamentId,pairingId){
const t=DB.tournaments().find(function(x){return x.id===tournamentId;});
if(!t)throw new Error('Tournament not found');
const pairing=(t.pairings||[]).find(function(p){return p.id===pairingId;});
if(!pairing)throw new Error('Pairing not found');
const memberIds=(pairing.members||[]).map(function(m){return m.golferId;});
const allGolfers=DB.golfers();
const golfers=allGolfers.filter(function(g){return memberIds.indexOf(g.id)>=0;});
const course=DB.courses().find(function(c){return c.id===t.courseId;})||null;
// Trim tournament — keep meta + this one pairing + empty score slots for it
const slimT={
id:t.id,name:t.name,date:t.date,courseId:t.courseId,format:t.format,
holes:t.holes,pairingMethod:t.pairingMethod,entryFee:t.entryFee,scat:t.scat,
maxStrokes:t.maxStrokes,maxStrokesType:t.maxStrokesType,groupSize:t.groupSize,
orgId:t.orgId,teamId:t.teamId,
registrants:memberIds,
checkedIn:memberIds,
pairings:[pairing],
scores:{},
lockedScores:{},
eventLocked:t.eventLocked===true,
createdAt:t.createdAt
};
// Pre-seed empty hole arrays for this group
const holes=t.holes||18;
for(const id of memberIds){
slimT.scores[id]={holeScores:Array(holes).fill(0),total:0,locked:false};
}
const me=State.user;
return {
_packType:'scorer-handoff',
_packVersion:1,
app:'turnee-golf',
build:APP_BUILD,
seedVersion:SEED_VERSION,
exportedAt:new Date().toISOString(),
exporter:me?{userId:me.id,name:me.name}:{userId:null,name:'unknown'},
scopedToPairingId:pairingId,
tournament:slimT,
golfers:golfers,
course:course,
// Just the scorer user (so sign-in works on their phone) plus a fan fallback
users:DB.users().filter(function(u){
if(u.id==='u-fan')return true;
return u.id===pairing.scorerId;
})
};
}

// course data and replants from the pack. Scorer mode is implicit — the data
// they have is just their one group, so the existing role-filtering already
// shows them only what they need.
function showScorerPackImport(){
const bg=el('div',{class:'modal-bg',onclick:e=>{if(e.target===bg)bg.remove();}});
const m=el('div',{class:'modal',style:{maxWidth:'560px'}});
m.appendChild(el('h3',{style:{marginBottom:'.3rem'}},'\uD83D\uDCE5 Import Scorer Pack'));
m.appendChild(el('small',{style:{display:'block',color:'var(--muted)',marginBottom:'.7rem',lineHeight:'1.4'}},
'Paste the JSON the director sent you. WARNING: this replaces your local tournament data \u2014 only do this on a phone you\'re using as a dedicated scorer device.'));

const ta=el('textarea',{placeholder:'Paste the scorer pack JSON here\u2026',
style:{width:'100%',minHeight:'8rem',padding:'.5rem',fontSize:'.78em',
fontFamily:'monospace',border:'1px solid var(--line)',borderRadius:'8px',
boxSizing:'border-box',resize:'vertical'}});
m.appendChild(ta);

const status=el('div',{style:{fontSize:'.82em',color:'var(--muted)',
minHeight:'1.2em',marginTop:'.4rem'}});
m.appendChild(status);

const btnRow=el('div',{class:'btn-row',style:{marginTop:'.7rem'}});
btnRow.appendChild(el('button',{class:'btn',onclick:function(){
const txt=(ta.value||'').trim();
if(!txt){status.textContent='Paste the JSON first.';return;}
let pack;
try{pack=JSON.parse(txt);}catch(e){status.textContent='Not valid JSON: '+e.message;return;}
if(!pack||pack._packType!=='scorer-handoff'){
status.textContent='That doesn\'t look like a scorer pack.';return;
}
if(!pack.tournament||!pack.golfers||!pack.course){
status.textContent='Pack is missing fields. Ask the director to re-export.';return;
}
if(!confirm('Replace local tournament/golfer/course data with this pack?\nYour current data on this device will be erased.'))return;
// Replace tournaments with just this one
DB.setTournaments([pack.tournament]);
// Merge golfers (keep existing if any so old data doesn't blow up score lookups,
// but the relevant ones from the pack overwrite by id)
const existingG=DB.golfers();
const incomingG=pack.golfers||[];
const gMap={};
for(const g of existingG)gMap[g.id]=g;
for(const g of incomingG)gMap[g.id]=g;
DB.setGolfers(Object.values(gMap));
// Course: same merge approach
const existingC=DB.courses();
const cMap={};
for(const c of existingC)cMap[c.id]=c;
if(pack.course)cMap[pack.course.id]=pack.course;
DB.setCourses(Object.values(cMap));
// Users — merge so the scorer's sign-in still works alongside existing
const existingU=DB.users();
const incomingU=pack.users||[];
const uMap={};
for(const u of existingU)uMap[u.id]=u;
for(const u of incomingU)uMap[u.id]=u;
DB.setUsers(Object.values(uMap));
// Auto-sign-in as the scorer user from the pack — if the pairing has a
// scorerId and that user is now in our user list, sign them in. Avoids
// the awkward sign-out/sign-back-in dance.
const pkPairing=pack.tournament&&pack.tournament.pairings&&pack.tournament.pairings[0];
const targetScorerId=pkPairing?pkPairing.scorerId:null;
if(targetScorerId){
const targetUser=Object.values(uMap).find(function(u){return u.id===targetScorerId;});
if(targetUser){
toast('Imported — signing you in as '+(targetUser.name||targetUser.username));
bg.remove();
doLogin(targetUser);
return;
}
}
toast('Scorer pack imported. Sign in if needed and start scoring.');
bg.remove();render();
}},'Import'));
btnRow.appendChild(el('button',{class:'btn ghost',onclick:()=>bg.remove()},'Cancel'));
m.appendChild(btnRow);

bg.appendChild(m);document.body.appendChild(bg);
setTimeout(function(){try{ta.focus();}catch(e){}},50);
}

const txt=(ta.value||'').trim();
if(!txt){status.textContent='Paste the JSON first.';status.style.color='var(--bad)';return;}
let pack;
try{pack=JSON.parse(txt);}catch(e){
status.textContent='Not valid JSON: '+e.message;status.style.color='var(--bad)';return;
}
if(!pack||pack._packType!=='score-return'){
status.textContent='That doesn\'t look like a score-return.';status.style.color='var(--bad)';return;
}
const ts=DB.tournaments();
const t=ts.find(function(x){return x.id===pack.tournamentId;});
if(!t){
status.textContent='Tournament '+pack.tournamentId+' not found on this device.';
status.style.color='var(--bad)';return;
}
const pairing=(t.pairings||[]).find(function(p){return p.id===pack.pairingId;});
if(!pairing){
status.textContent='Pairing '+pack.pairingId+' not found in tournament.';
status.style.color='var(--bad)';return;
}
const memberIds=(pairing.members||[]).map(function(mb){return mb.golferId;});
const incoming=pack.scores||{};
let merged=0;
if(!t.scores)t.scores={};
for(const id of Object.keys(incoming)){
// Safety: only merge scores for golfers actually in this pairing
if(memberIds.indexOf(id)<0)continue;
t.scores[id]=incoming[id];
merged++;
}
DB.setTournaments(ts);
status.textContent='Merged '+merged+' scorecard'+(merged===1?'':'s')+' into '+t.name+'.';
status.style.color='var(--good)';
toast(merged+' scorecard'+(merged===1?'':'s')+' imported');
setTimeout(function(){bg.remove();render();},800);
}},'Import scores'));

}


// Picks a course (from the currently-selected event by default) and a hole,
// then watches GPS and shows yards-to-green that updates as you walk.
// Requires the course to have holeGreens tagged via the admin tagging tool.
function showDistance(){
const bg=el('div',{class:'modal-bg',onclick:e=>{if(e.target===bg)closeWith();}});
const m=el('div',{class:'modal',style:{maxWidth:'420px',textAlign:'center'}});
let watchId=null;
const closeWith=()=>{
if(watchId!=null&&navigator.geolocation){
try{navigator.geolocation.clearWatch(watchId);}catch(e){}
watchId=null;
}
bg.remove();
};

const courses=DB.courses();
// Default to the course of the active tournament if one is selected.
const t=State.tid?DB.tournaments().find(x=>x.id===State.tid):null;
let currentCourseId=t&&t.courseId?t.courseId:(courses[0]&&courses[0].id);
let currentHole=0;

m.appendChild(el('h3',{style:{marginBottom:'.4rem'}},'\uD83D\uDCCD Distance to Green'));

// Course selector
const courseSel=el('select',{style:{width:'100%',padding:'.5rem',marginBottom:'.5rem'}},
courses.map(c=>el('option',{value:c.id,selected:c.id===currentCourseId?true:false},c.name)));
m.appendChild(courseSel);

// Hole selector strip
const holeStrip=el('div',{style:{display:'flex',flexWrap:'wrap',gap:'4px',
justifyContent:'center',marginBottom:'.7rem'}});
m.appendChild(holeStrip);

// Big distance display
const distBox=el('div',{style:{padding:'1.4rem .5rem',background:'var(--cream)',
borderRadius:'10px',marginBottom:'.5rem'}});
const distNum=el('div',{style:{fontSize:'3em',fontWeight:800,color:'var(--green-dark)',
lineHeight:'1'}},'\u2014');
const distLbl=el('div',{style:{fontSize:'.85em',color:'var(--muted)',marginTop:'.2rem'}},'yards to center');
distBox.appendChild(distNum);
distBox.appendChild(distLbl);
m.appendChild(distBox);

const statusEl=el('div',{style:{fontSize:'.8em',color:'var(--muted)',
minHeight:'1.3em',marginBottom:'.5rem'}},'Tap a hole below.');
m.appendChild(statusEl);

const drawHoles=()=>{
holeStrip.innerHTML='';
const c=courses.find(x=>x.id===currentCourseId);
if(!c)return;
// Number of HOLES PLAYED in a round (par array length); may differ from green count
const holesPlayed=Array.isArray(c.par)?c.par.length:18;
const greens=Array.isArray(c.holeGreens)?c.holeGreens:[];
for(let i=0;i<holesPlayed;i++){
const gi=greenIndexForHole(c,i+1);
const tagged=greens[gi]&&typeof greens[gi].lat==='number';
const isCur=i===currentHole;
const btn=el('button',{style:{
width:'34px',height:'34px',borderRadius:'6px',
background:isCur?'var(--green)':(tagged?'var(--green-light)':'var(--line)'),
color:isCur?'#fff':(tagged?'var(--green-dark)':'var(--muted)'),
border:'none',fontWeight:700,fontSize:'.85em',cursor:'pointer'
},onclick:()=>{
if(!tagged){toast('Hole '+(i+1)+' not tagged yet');return;}
currentHole=i;drawHoles();startWatch();
}},String(i+1));
holeStrip.appendChild(btn);
}
};

const updateDistance=(lat,lng,acc)=>{
const c=courses.find(x=>x.id===currentCourseId);
if(!c){return;}
const greens=Array.isArray(c.holeGreens)?c.holeGreens:[];
const gi=greenIndexForHole(c,currentHole+1);
const g=greens[gi];
if(!g||typeof g.lat!=='number'){
distNum.textContent='\u2014';
statusEl.textContent='Hole '+(currentHole+1)+' not tagged.';
return;
}
const yds=distanceYards(lat,lng,g.lat,g.lng);
distNum.textContent=yds;
const greenLabel=(c.greens&&c.greens<(c.par?c.par.length:18))?' (green '+(gi+1)+')':'';
statusEl.textContent='Hole '+(currentHole+1)+greenLabel+' \u00b7 GPS \u00b1'+Math.round(acc||0)+'m';
};

const startWatch=()=>{
if(!navigator.geolocation){statusEl.textContent='Geolocation not supported.';return;}
if(watchId!=null){try{navigator.geolocation.clearWatch(watchId);}catch(e){}}
statusEl.textContent='Locating\u2026';
watchId=navigator.geolocation.watchPosition(
function(p){updateDistance(p.coords.latitude,p.coords.longitude,p.coords.accuracy);},
function(err){statusEl.textContent='GPS error: '+(err.message||err);},
{enableHighAccuracy:true,maximumAge:2000,timeout:20000}
);
};

courseSel.addEventListener('change',function(){
currentCourseId=courseSel.value;currentHole=0;drawHoles();
const c=courses.find(x=>x.id===currentCourseId);
const greens=Array.isArray(c.holeGreens)?c.holeGreens:[];
const tagged=greens.filter(g=>g&&typeof g.lat==='number').length;
if(!tagged){
distNum.textContent='\u2014';
statusEl.textContent='No greens tagged yet for '+c.name+'. Use Courses \u2192 \uD83D\uDCCD Tag greens.';
}
});

drawHoles();
const c0=courses.find(x=>x.id===currentCourseId);
if(c0){
const greens0=Array.isArray(c0.holeGreens)?c0.holeGreens:[];
const tagged0=greens0.filter(g=>g&&typeof g.lat==='number').length;
if(!tagged0){
statusEl.textContent='No greens tagged yet for '+c0.name+'. Use Courses \u2192 \uD83D\uDCCD Tag greens.';
}else{
// Auto-pick first hole that maps to a tagged green
const holesPlayed=Array.isArray(c0.par)?c0.par.length:18;
for(let i=0;i<holesPlayed;i++){
const gi=greenIndexForHole(c0,i+1);
if(greens0[gi]&&typeof greens0[gi].lat==='number'){currentHole=i;break;}
}
drawHoles();
startWatch();
}
}

m.appendChild(el('button',{class:'btn ghost full',onclick:closeWith},'Close'));
bg.appendChild(m);document.body.appendChild(bg);
}

function searchKB(query){
const q=(query||'').toLowerCase().trim();
if(!q)return [];
const tokens=q.split(/\s+/).filter(function(t){return t.length>=3;});
if(!tokens.length)return [];
return HELP_KB.map(function(a){
const hay=(a.title+' '+(a.tags||[]).join(' ')+' '+a.body).toLowerCase();
let score=0;
for(const t of tokens){
if(hay.indexOf(t)>=0)score++;
// extra weight if matches title
if(a.title.toLowerCase().indexOf(t)>=0)score+=2;
// extra weight if matches a tag
if((a.tags||[]).some(function(tg){return tg.toLowerCase().indexOf(t)>=0;}))score+=1;
}
return {article:a,score:score};
}).filter(function(r){return r.score>0;})
.sort(function(a,b){return b.score-a.score;})
.slice(0,3)
.map(function(r){return r.article;});
}

const dave=DB.users().find(u=>u.id==='u-dave');
if(dave){
card.appendChild(el('button',{class:'btn full',style:{marginBottom:'.8rem'},
onclick:()=>doLogin(dave)},
'Sign in as Dave Fuqua (Admin)'));
}
card.appendChild(el('div',{style:{textAlign:'center',color:'var(--muted)',fontSize:'.8rem',margin:'.3rem 0 .5rem'}},
'or search for your name'));

// Search input — autofocused. Filter activates after 2+ characters typed.
const searchInp=el('input',{type:'text',
placeholder:'Type your name (e.g. \u201cda\u201d for Dave)\u2026',
autocomplete:'off',autocapitalize:'off',spellcheck:'false',
style:{width:'100%',padding:'.6rem .7rem',fontSize:'1em',borderRadius:'8px',
border:'1px solid var(--line)',marginBottom:'.4rem',boxSizing:'border-box'}});
card.appendChild(searchInp);

// Live results dropdown — hidden until query is 2+ chars.
const resultsList=el('div',{style:{maxHeight:'280px',overflowY:'auto',
border:'1px solid var(--line)',borderRadius:'8px',background:'var(--bg)',
display:'none'}});
card.appendChild(resultsList);

let highlightedIdx=0;
let matches=[];

const renderMatches=()=>{
resultsList.innerHTML='';
const q=searchInp.value.trim();
if(q.length<2){resultsList.style.display='none';return;}
if(!matches.length){
const empty=el('div',{style:{padding:'.7rem',color:'var(--muted)',fontSize:'.85em',textAlign:'center'}},
'No users matching \u201c'+q+'\u201d');
resultsList.appendChild(empty);
resultsList.style.display='block';
return;
}
resultsList.style.display='block';
matches.forEach((u,i)=>{
const rs=userRoles(u).map(r=>ROLE_LABEL[r]||r).join(' / ');
const item=el('div',{
style:{padding:'.55rem .8rem',cursor:'pointer',
borderBottom:i<matches.length-1?'1px solid var(--line-soft)':'none',
background:i===highlightedIdx?'var(--surface)':'transparent'}},
el('div',{style:{fontWeight:600}},userDisplayName(u)),
el('div',{style:{fontSize:'.78em',color:'var(--muted)'}},rs));
// Use mousedown not click — click can be lost when input handlers steal focus.
// preventDefault stops the search input from blurring before we open the modal.
item.addEventListener('mousedown',function(e){e.preventDefault();});
item.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();promptForCred(u);});
// Update highlight on hover WITHOUT re-rendering (which would destroy this very element)
item.addEventListener('mouseenter',function(){
highlightedIdx=i;
const items=resultsList.children;
for(let j=0;j<items.length;j++){
items[j].style.background=j===highlightedIdx?'var(--surface)':'transparent';
}
});
resultsList.appendChild(item);
});
};

const filter=()=>{
const q=searchInp.value.trim().toLowerCase();
if(q.length<2){matches=[];renderMatches();return;}
matches=DB.users().filter(u=>{
const dn=(userDisplayName(u)||'').toLowerCase();
const un=(u.username||'').toLowerCase();
const nm=(u.name||'').toLowerCase();
return dn.indexOf(q)>=0||un.indexOf(q)>=0||nm.indexOf(q)>=0;
});
// Prefer matches at the START of the name (more relevant)
matches.sort((a,b)=>{
const adn=(userDisplayName(a)||'').toLowerCase();
const bdn=(userDisplayName(b)||'').toLowerCase();
const aStarts=adn.indexOf(q)===0?0:1;
const bStarts=bdn.indexOf(q)===0?0:1;
return aStarts-bStarts||adn.localeCompare(bdn);
});
matches=matches.slice(0,10);
highlightedIdx=0;
renderMatches();
};

searchInp.addEventListener('input',filter);
searchInp.addEventListener('keydown',function(e){
if(e.key==='ArrowDown'){
e.preventDefault();
if(matches.length){highlightedIdx=Math.min(matches.length-1,highlightedIdx+1);renderMatches();}
}else if(e.key==='ArrowUp'){
e.preventDefault();
if(matches.length){highlightedIdx=Math.max(0,highlightedIdx-1);renderMatches();}
}else if(e.key==='Enter'||e.key==='Tab'){
if(matches[highlightedIdx]){
e.preventDefault();
promptForCred(matches[highlightedIdx]);
}
}else if(e.key==='Escape'){
searchInp.value='';filter();
}
});

// Auto-focus shortly after render so the keyboard pops up on mobile / cursor lands on PC
setTimeout(function(){try{searchInp.focus();}catch(err){}},50);

card.appendChild(el('div',{style:{height:'.9rem'}}));

// Account options bar
card.appendChild(el('div',{style:{display:'flex',gap:'.5rem',justifyContent:'center',
borderTop:'1px solid var(--line-soft)',paddingTop:'.7rem'}},
el('button',{class:'btn ghost small',onclick:()=>showSignUp()},'\uD83D\uDC64 Sign up'),
el('button',{class:'btn ghost small',onclick:()=>showChangePassword()},'\uD83D\uDD11 Change password')));

card.appendChild(el('div',{style:{height:'.5rem'}}));
card.appendChild(el('small',{style:{display:'block',textAlign:'center',color:'var(--muted)'}},
'Hint: Dave PIN 1234 \u00b7 admin/admin123 \u00b7 fan PIN 1111'));
wrap.appendChild(card);
return wrap;
}

// Admin-only quick demo: prepares the LGCC Big Game tournament for a fast test.
//   - Picks (or creates) a tournament with orgId=org-lgcc and format=biggame
//   - Ensures Kendall and Dave each have a Person record at LGCC and a user.golferId link
//   - Group 1 = Kendall + 3 LGCC fillers; Kendall is scorer of Group 1
//   - Group 2 = Dave + 3 LGCC fillers; Dave is scorer of Group 2
//   - Auto-grants 'scorer' role at LGCC to anyone who needs it
//   - Sets the tournament's date to today so it shows under "Upcoming"
function runLgccDemoSetup(){
const orgs=DB.orgs();
const lgcc=orgs.find(o=>o.id==='org-lgcc'||(o.name||'').toLowerCase()==='lgcc');
if(!lgcc){toast('LGCC org not found');return;}
const users=DB.users();

// Find Kendall and Dave user accounts
const findUserByName=(needle)=>{
const n=needle.toLowerCase();
return users.find(u=>{
const dn=(userDisplayName(u)||'').toLowerCase();
const nm=(u.name||'').toLowerCase();
return dn.indexOf(n)>=0||nm.indexOf(n)>=0;
});
};
const kendallUser=findUserByName('kendall');
const daveUser=findUserByName('dave')||users.find(u=>u.id==='u-dave');
if(!kendallUser){toast('Create a user named "Kendall" first (Users tab \u2192 + Add)');return;}
if(!daveUser){toast('Dave Fuqua user not found');return;}

// Ensure each user has a Person (golfer) record at LGCC, and link via user.golferId
const ensureGolferForUser=(u,defaultHcp)=>{
const allGolfers=DB.golfers();
let g=null;
if(u.golferId)g=allGolfers.find(x=>x.id===u.golferId);
if(!g){
const dn=userDisplayName(u)||u.name||'';
const dnLow=dn.toLowerCase();
g=allGolfers.find(x=>(x.name||'').toLowerCase()===dnLow);
}
if(!g){
g={id:'gf-'+uid(),name:userDisplayName(u)||u.name||'Player',
handicap:defaultHcp,teamId:null,orgId:lgcc.id,phone:'',email:'',roles:['golfer']};
allGolfers.push(g);
DB.setGolfers(allGolfers);
}else if(g.orgId!==lgcc.id){
// Re-org them to LGCC so the demo's filter picks them up
g.orgId=lgcc.id;
const idx=allGolfers.findIndex(x=>x.id===g.id);
if(idx>=0){allGolfers[idx]=g;DB.setGolfers(allGolfers);}
}
if(u.golferId!==g.id){
u.golferId=g.id;
const all=DB.users();
const idx=all.findIndex(x=>x.id===u.id);
if(idx>=0){all[idx]=u;DB.setUsers(all);}
}
return g;
};
const kendallG=ensureGolferForUser(kendallUser,12);
const daveG=ensureGolferForUser(daveUser,14);

// Pick 6 OTHER LGCC golfers spread across handicap range (excluding Kendall + Dave)
const golfers=DB.golfers();
const otherLgcc=golfers.filter(g=>g.orgId===lgcc.id&&g.id!==kendallG.id&&g.id!==daveG.id);
if(otherLgcc.length<6){
toast('Need 6 more LGCC golfers in People (have '+otherLgcc.length+')');
return;
}
const fillers=otherLgcc.slice().sort((a,b)=>(a.handicap==null?99:a.handicap)-(b.handicap==null?99:b.handicap)).slice(0,6);

// Find or create the LGCC BG tournament
const tournaments=DB.tournaments();
let t=tournaments.find(x=>x.orgId===lgcc.id&&x.format==='biggame');
const today=new Date().toISOString().slice(0,10);
if(!t){
t={id:'t-bg-demo-'+uid(),name:'LGCC Big Game (Demo)',date:today,
courseId:(DB.courses().find(c=>c.id==='crs-lcc')||DB.courses()[0]||{}).id,
format:'biggame',pairingMethod:'handicap',holes:18,entryFee:25,scat:5,maxStrokes:10,groupSize:4,
orgId:lgcc.id,teamId:null,
revenue:{winnersPct:40,tsPct:15,prizesPct:20,marketingPct:10},
registrants:[],checkedIn:[],pairings:[],scores:{},lockedScores:{},createdAt:Date.now()};
tournaments.push(t);
}
t.date=today;

const allEightIds=[kendallG.id,daveG.id].concat(fillers.map(g=>g.id));
t.registrants=Array.from(new Set((t.registrants||[]).concat(allEightIds)));
t.checkedIn=allEightIds.slice();
t.scores=t.scores||{};
for(const id of allEightIds)delete t.scores[id];

// Snake-distribute the 6 fillers between two groups (3 each)
const group1Fill=[],group2Fill=[];
let bucket=0,dir=1;
for(const f of fillers){
(bucket===0?group1Fill:group2Fill).push({golferId:f.id});
bucket+=dir;
if(bucket>=2){bucket=1;dir=-1;}
else if(bucket<0){bucket=0;dir=1;}
}
const groups=[
{id:'gp-demo-1-'+uid(),
 members:[{golferId:kendallG.id}].concat(group1Fill),
 startingHole:1,scorerId:kendallUser.id},
{id:'gp-demo-2-'+uid(),
 members:[{golferId:daveG.id}].concat(group2Fill),
 startingHole:10,scorerId:daveUser.id}
];
t.pairings=groups;

// Auto-grant 'scorer' role at LGCC to Kendall and Dave if missing
const grantScorerAtLgcc=(u)=>{
if(userHasRole(u,'scorer')||userHasRole(u,'admin')||userHasRole(u,'director'))return;
const ms=Array.isArray(u.memberships)?u.memberships.slice():[];
const existing=ms.find(m=>m.orgId===lgcc.id);
if(existing){if(existing.roles.indexOf('scorer')<0)existing.roles=existing.roles.concat(['scorer'])}
else ms.push({orgId:lgcc.id,roles:['scorer']});
u.memberships=ms;
normalizeUser(u);
const all=DB.users();
const idx=all.findIndex(x=>x.id===u.id);
if(idx>=0){all[idx]=u;DB.setUsers(all);}
};
grantScorerAtLgcc(kendallUser);
grantScorerAtLgcc(daveUser);

DB.setTournaments(tournaments);
// Force the running admin's active org to LGCC so the new tournament is visible in
// the Events list (and Scoring page). Persist to session so it survives reload.
State.activeOrgId=lgcc.id;
const sess=load(KEYS.session,null);
if(sess&&typeof sess==='object'){sess.activeOrgId=lgcc.id;save(KEYS.session,sess);}
else if(State.user)save(KEYS.session,{userId:State.user.id,activeOrgId:lgcc.id});
// Reset any stale scoring-state so the demo re-runs cleanly
State.scoringGroup=null;State.scoringId=null;State.scoringHole=0;
toast('Demo ready \u2014 G1: '+userDisplayName(kendallUser).split(' ')[0]+' (scorer) +3, G2: '+userDisplayName(daveUser).split(' ')[0]+' (scorer) +3');
// Jump to the tournament's Pairings step
State.tid=t.id;State.step=4;render();
}

'\uD83D\uDD12 LOCKED'):null));

fmtDate(t.date)+' \u00b7 '+(c?c.name:'No course')+' \u00b7 '+t.holes+' holes'));

!!t.name&&!!t.courseId,
reg.length>0,
ci.length>0,
(t.pairings||[]).length>0,
(t.pairings||[]).length>0,
Object.keys(t.scores||{}).length>0,
];
// Reset pending-commit hook — step renderers may set it if they have unsaved
// local selections; safeNav() will commit before transitioning.
State.pendingCommit=null;
const safeNav=(fn)=>()=>{
if(typeof State.pendingCommit==='function'){
const cb=State.pendingCommit;State.pendingCommit=null;
try{cb()}catch(e){console.warn('pendingCommit failed',e)}
}
fn();
};

STEPS.forEach((s,i)=>{

(i+1)+'. '+s));
});
root.appendChild(steps);

// Step content — Walk-Ins (formerly case 3) folded into Check-In (bug #7).
switch(State.step){
case 0: root.appendChild(StepSetup(t,c));break;

onclick:safeNav(()=>{State.step++;render()})},'Next \u2192'));
root.appendChild(nav);

// Danger zone (admin/director)
if(userHasRole(State.user,'admin')||userHasRole(State.user,'director')){

function StepRegister(t){
const golfers=DB.golfers();
const teams=DB.teams();
const card=el('div',{class:'card'});
card.appendChild(el('h3',{},'Register Players'));
// Scope label
const orgs=DB.orgs();
const orgObj=t.orgId?orgs.find(o=>o.id===t.orgId):null;
const teamObj=t.teamId?teams.find(tm=>tm.id===t.teamId):null;
let scopeLabel='all players';
if(teamObj)scopeLabel=teamObj.name+' only';
else if(orgObj)scopeLabel=orgObj.name+' players only';
card.appendChild(el('small',{},'Showing '+scopeLabel+'. Check players, then tap "Add Selected".'));
card.appendChild(el('div',{style:{height:'.7rem'}}));

// Pre-filter the visible roster by tournament scope
const scopedGolfers=golfers.filter(g=>{
if(t.teamId)return g.teamId===t.teamId;
if(t.orgId)return g.orgId===t.orgId;
return true;
});

// Last-added confirmation banner
const lastId=State.lastRegisteredId;
const lastG=lastId?golfers.find(g=>g.id===lastId):null;
if(lastG&&(t.registrants||[]).includes(lastId)){
card.appendChild(el('div',{style:{background:'var(--green-light)',padding:'.5rem .7rem',
borderRadius:'8px',marginBottom:'.6rem',color:'var(--green-dark)',fontSize:'.9rem'}},
'\u2713 Added ',el('strong',{},lastG.name)));
}

// Local selection state (survives within this render)
const selected=new Set();

// Auto-commit any pending selection when user navigates away (Next/Back/Step)
State.pendingCommit=()=>{
if(!selected.size)return;
updateTournament(t.id,x=>{
x.registrants=x.registrants||[];
for(const id of selected)if(!x.registrants.includes(id))x.registrants.push(id);
return x;
});
const n=selected.size;
selected.clear();
toast('Auto-saved '+n+' registered');
};

// Sticky top action bar
const filter=el('input',{type:'text',placeholder:'Search players or teams\u2026'});
const addSelectedBtn=el('button',{class:'btn',disabled:true,onclick:()=>{
if(!selected.size)return;
updateTournament(t.id,x=>{
x.registrants=x.registrants||[];
for(const id of selected)if(!x.registrants.includes(id))x.registrants.push(id);
return x;
});
State.lastRegisteredId=Array.from(selected).pop();
const n=selected.size;
selected.clear();
render();toast('Added '+n);
}},'+ Add Selected (0)');
const registerAllBtn=el('button',{class:'btn secondary',onclick:()=>{
const visible=getVisibleUnregistered(t,scopedGolfers,teams,filter.value);
if(!visible.length){toast('Nobody to add');return}
if(!confirm2('Register all '+visible.length+' visible players?'))return;
updateTournament(t.id,x=>{
x.registrants=x.registrants||[];
for(const g of visible)if(!x.registrants.includes(g.id))x.registrants.push(g.id);
return x;
});
State.lastRegisteredId=visible[visible.length-1].id;
render();toast('Registered '+visible.length);
}},'+ Register all visible');

const topBar=el('div',{style:{position:'sticky',top:0,background:'var(--paper)',
paddingBottom:'.6rem',marginBottom:'.4rem',zIndex:5,
borderBottom:'1px solid var(--line-soft)'}},
el('div',{class:'btn-row',style:{marginBottom:'.5rem'}},addSelectedBtn,registerAllBtn),
filter);
card.appendChild(topBar);

const updateAddBtnLabel=()=>{
addSelectedBtn.textContent='+ Add Selected ('+selected.size+')';
addSelectedBtn.disabled=selected.size===0;
};

const listWrap=el('div',{style:{marginTop:'.6rem'}});
card.appendChild(listWrap);

const renderList=()=>{
listWrap.innerHTML='';
const q=filter.value.toLowerCase().trim();
const regSet=new Set(t.registrants||[]);
const byTeam={};
for(const g of scopedGolfers){
if(regSet.has(g.id))continue; // hide already-registered
const tm=teams.find(x=>x.id===g.teamId);
const tname=tm?tm.name:'No team';
if(q&&!g.name.toLowerCase().includes(q)&&!tname.toLowerCase().includes(q))continue;
(byTeam[tname]=byTeam[tname]||[]).push(g);
}
const teamNames=Object.keys(byTeam).sort();
if(!teamNames.length){
listWrap.appendChild(el('div',{class:'empty'},
regSet.size>0?'All available players are already registered':'No players match'));
return;
}
for(const tn of teamNames){
const sec=el('div',{style:{marginBottom:'.6rem'}});
// Team header with select-all checkbox
const teamCheck=el('input',{type:'checkbox'});
teamCheck.addEventListener('change',()=>{
const ids=byTeam[tn].map(g=>g.id);
if(teamCheck.checked){for(const id of ids)selected.add(id)}
else{for(const id of ids)selected.delete(id)}
// Update individual checkboxes for this team
for(const id of ids){
const cb=listWrap.querySelector('input[data-gid="'+id+'"]');
if(cb)cb.checked=teamCheck.checked;
}
updateAddBtnLabel();
});
sec.appendChild(el('label',{class:'checkbox',style:{fontWeight:600,padding:'.4rem 0',
color:'var(--green-dark)',borderBottom:'1px solid var(--line-soft)'}},
teamCheck,el('span',{},tn+' ('+byTeam[tn].length+')')));
for(const g of sortBy(byTeam[tn],x=>x.name)){
const cb=el('input',{type:'checkbox','data-gid':g.id});
cb.addEventListener('change',()=>{
if(cb.checked)selected.add(g.id);else selected.delete(g.id);
updateAddBtnLabel();
// sync team-level checkbox
const teamIds=byTeam[tn].map(x=>x.id);
teamCheck.checked=teamIds.every(id=>selected.has(id));
teamCheck.indeterminate=!teamCheck.checked&&teamIds.some(id=>selected.has(id));
});
sec.appendChild(el('label',{class:'checkbox',style:{padding:'.4rem 0',
borderBottom:'1px solid var(--line-soft)'}},cb,
el('span',{},g.name+(g.handicap!=null?' \u00b7 hcp '+g.handicap:''))));
}
listWrap.appendChild(sec);
}
};
filter.addEventListener('input',renderList);
renderList();

const reg=(t.registrants||[]).length;
card.appendChild(el('div',{style:{position:'sticky',bottom:0,background:'var(--paper)',
padding:'.5rem 0',borderTop:'1px solid var(--line-soft)',marginTop:'.5rem',
fontWeight:600,cursor:'pointer'},
onclick:()=>showRegisteredList(t)},
reg+' registered \u2192 tap to manage'));
return card;
}

function getVisibleUnregistered(t,scopedGolfers,teams,query){
const q=(query||'').toLowerCase().trim();
const regSet=new Set(t.registrants||[]);
return scopedGolfers.filter(g=>{
if(regSet.has(g.id))return false;
if(!q)return true;
const tm=teams.find(x=>x.id===g.teamId);
return g.name.toLowerCase().includes(q)||(tm&&tm.name.toLowerCase().includes(q));
});
}

function showRegisteredList(t){
const golfers=DB.golfers();
const regs=(t.registrants||[]).map(id=>golfers.find(g=>g.id===id)).filter(Boolean);
const bg=el('div',{class:'modal-bg',onclick:e=>{if(e.target===bg)bg.remove()}});
const m=el('div',{class:'modal',style:{maxWidth:'500px'}});
const draw=()=>{
m.innerHTML='';
const cur=(t.registrants||[]).map(id=>golfers.find(g=>g.id===id)).filter(Boolean);
m.appendChild(el('h3',{},'Registered ('+cur.length+')'));
if(!cur.length)m.appendChild(el('div',{class:'empty'},'Nobody registered yet'));
else{
for(const g of sortBy(cur,x=>x.name)){
m.appendChild(el('div',{class:'row between',style:{padding:'.5rem 0',
borderBottom:'1px solid var(--line-soft)'}},
el('div',{},g.name+(g.handicap!=null?' \u00b7 hcp '+g.handicap:'')),
el('button',{class:'btn ghost small',style:{color:'var(--bad)'},onclick:()=>{
updateTournament(t.id,x=>{x.registrants=(x.registrants||[]).filter(i=>i!==g.id);return x});
// Get the latest tournament after update for re-draw
const fresh=DB.tournaments().find(x=>x.id===t.id);
t.registrants=fresh.registrants;
draw();
}},'Remove')));
}
}
m.appendChild(el('div',{style:{height:'.5rem'}}));
m.appendChild(el('button',{class:'btn full',onclick:()=>{bg.remove();render()}},'Done'));
};
draw();
bg.appendChild(m);document.body.appendChild(bg);
}

const row=el('div',{style:{
padding:'.4rem .5rem',
borderBottom:'1px solid var(--line-soft)',
cursor:isPaired?'default':'pointer',
background:isSelected?'var(--green)':isPaired?'var(--surface)':'',

function StepPairings(t,course){
const golfers=DB.golfers();
const teams=DB.teams();
const card=el('div',{class:'card'});
card.appendChild(el('h3',{},'Pairings'));
card.appendChild(el('small',{},'Auto-build groups across the field, then assign starting holes.'));
card.appendChild(el('div',{style:{height:'.6rem'}}));

const checked=(t.checkedIn||[]).map(id=>golfers.find(g=>g.id===id)).filter(Boolean);

// Settings: group size + starting holes — default from tournament
const defSize=t.groupSize||4;
const sizeInp=el('select',{onchange:e=>{
updateTournament(t.id,x=>{x.groupSize=+e.target.value;return x});
}},
[2,3,4,5].map(n=>el('option',{value:n,selected:n===defSize?true:false},n+' per group')));
const startInp=el('select',{},
[['1','Hole 1 only'],['shotgun','Shotgun (all holes)'],['front','Front 9 only'],['back','Back 9 only']]
.map(([v,l])=>el('option',{value:v},l)));

card.appendChild(el('div',{class:'grid g2'},
el('div',{class:'field'},el('label',{},'Group size'),sizeInp),
el('div',{class:'field'},el('label',{},'Starting holes'),startInp)));

card.appendChild(el('button',{class:'btn',onclick:()=>{
const size=+sizeInp.value;
const starts=startInp.value;
const pool=checked.slice();
if(!pool.length){toast('No checked-in players');return}
// Pre-bundle cart partners so they always land in the same group
// Read live cartPartners in case t is stale
const liveCp=(DB.tournaments().find(x=>x.id===t.id)||t).cartPartners||{};
const pairedIds=new Set();
const bundles=[];
for(const g of pool){
if(pairedIds.has(g.id))continue;
const pid=liveCp[g.id];
const partner=pid?pool.find(x=>x.id===pid):null;
if(partner&&!pairedIds.has(pid)){
bundles.push([g,partner]);
pairedIds.add(g.id);pairedIds.add(pid);
}else{
bundles.push([g]);
pairedIds.add(g.id);
}
}
// Use the BETTER (lower) handicap of a pair for snake positioning
const bestHcp=b=>Math.min(...b.map(g=>g.handicap==null?99:g.handicap));
const sortedBundles=buildPairingOrderBundles(bundles,t.pairingMethod,bestHcp);
const totalPlayers=sortedBundles.flat().length;
// Big Game absorbs SMALL remainders into existing groups (e.g. 17/4 →
// [5,4,4,4] instead of [4,4,4,4,1]). Only fold when remainder fits — at
// most one extra per group. Otherwise (e.g. 11/4 → rem 3, floor 2, would
// give [5,6]) fall through to ceil so no group exceeds size+1.
let numGroups;
const rem=totalPlayers%size;
const floorGroups=Math.floor(totalPlayers/size);
if(getFR(t.format).type==='stroke'&&t.format==='biggame'&&rem!==0&&rem<=floorGroups){
numGroups=Math.max(1,floorGroups);
}else{
numGroups=Math.max(1,Math.ceil(totalPlayers/size));
}
const groups=[];
for(let i=0;i<numGroups;i++)groups.push({id:'gp-'+uid(),members:[],startingHole:1});
// Distribute snake-style by BUNDLE — cart partners always land in the same group
// True snake: advance ONE step per bundle, reverse direction at each end
let gi=0,dir=1;
for(const bundle of sortedBundles){
// Place the whole bundle in current group
for(const g of bundle){
groups[gi].members.push({golferId:g.id});
}
// Advance to next group
gi+=dir;
if(gi>=numGroups){gi=numGroups-1;dir=-1;}
else if(gi<0){gi=0;dir=1;}
}
// Starting holes
if(starts==='shotgun'){
groups.forEach((g,i)=>g.startingHole=((i)%t.holes)+1);
}else if(starts==='front'){
groups.forEach((g,i)=>g.startingHole=((i)%9)+1);
}else if(starts==='back'){
groups.forEach((g,i)=>g.startingHole=10+((i)%9));
}else{
groups.forEach(g=>g.startingHole=1);
}
updateTournament(t.id,x=>{x.pairings=groups;return x});
render();toast('Pairings built');
}},'Auto-build Pairings'));

// Show existing pairings
if((t.pairings||[]).length){
card.appendChild(el('hr'));
card.appendChild(el('h4',{},'Groups ('+t.pairings.length+')'));
const allUsers=DB.users();
const userById=(uid)=>allUsers.find(u=>u.id===uid);
for(let i=0;i<t.pairings.length;i++){
const g=t.pairings[i];
const gel=el('div',{class:'group'});
gel.appendChild(el('div',{class:'group-hdr'},
el('span',{},'Group '+(i+1)+(g.teeTime?' \u00b7 '+g.teeTime:'')),
el('span',{},'Hole '+g.startingHole)));
const body=el('div',{class:'group-body'});
for(const m of g.members){
const gf=golfers.find(x=>x.id===m.golferId);
const tm1=gf?teams.find(x=>x.id===gf.teamId):null;
body.appendChild(el('div',{class:'group-mem'},
el('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px'},
el('span',{},gf?gf.name:'?'),
el('span',{style:'color:var(--muted);font-size:0.85em'},tm1?tm1.name:'')),
el('small',{},gf&&gf.handicap!=null?'hcp '+gf.handicap:'')));
}
// Scorer row
const scorerUser=g.scorerId?userById(g.scorerId):null;
const scorerRow=el('div',{style:{padding:'.5rem .8rem',background:'var(--surface)',
borderTop:'1px solid var(--line-soft)',display:'flex',justifyContent:'space-between',
alignItems:'center',gap:'.5rem'}});
scorerRow.appendChild(el('div',{style:{flex:1,minWidth:0}},
el('div',{style:{fontSize:'.7em',fontWeight:700,color:'var(--muted)',
textTransform:'uppercase',letterSpacing:'.04em'}},'Scorer'),
el('div',{style:{fontWeight:600}},scorerUser?userDisplayName(scorerUser):'(none assigned)')));
scorerRow.appendChild(el('button',{class:'btn small',
onclick:()=>showAssignScorer(t,i)},
scorerUser?'Change':'+ Assign'));
if(scorerUser){
scorerRow.appendChild(el('button',{class:'btn ghost small',onclick:()=>{
updateTournament(t.id,x=>{x.pairings[i].scorerId=null;return x});
render();toast('Scorer cleared');
}},'\u00d7'));
// Scorer Pack export — only when event is locked. Without lock, pairings
// could still change and a sent pack would go stale.
if(t.eventLocked===true){
scorerRow.appendChild(el('button',{class:'btn small',
title:'Export this group as a self-contained pack to send to the scorer',
onclick:()=>showScorerPackExport(t.id,g.id)},
'\uD83D\uDCE8 Pack'));
}
}
gel.appendChild(scorerRow);
body.style.borderBottom='none';
gel.appendChild(body);
card.appendChild(gel);
}

// events freeze pairings and gate the Side Games tab. Director can unlock

}

function buildPairingOrderBundles(bundles,method,avgHcp){
if(method==='random'){
const s=bundles.slice();
for(let i=s.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s[i],s[j]]=[s[j],s[i]]}
return s;
}
if(method==='bracket'){
const s=bundles.slice().sort((a,b)=>avgHcp(a)-avgHcp(b));
const q=Math.ceil(s.length/4);
const a=s.slice(0,q),b=s.slice(q,2*q),c=s.slice(2*q,3*q),d=s.slice(3*q);
const out=[];const max=Math.max(a.length,b.length,c.length,d.length);
for(let i=0;i<max;i++){[a,b,c,d].forEach(arr=>{if(arr[i])out.push(arr[i])})}
return out;
}
// handicap / snake / scramble — sort by avg handicap
return bundles.slice().sort((a,b)=>avgHcp(a)-avgHcp(b));
}

function buildPairingOrder(players,method){
if(method==='handicap')return sortBy(players,p=>(p.handicap==null?99:p.handicap));
if(method==='bracket'){
// A/B/C/D — sort by handicap then split into 4 brackets and interleave
const s=sortBy(players,p=>(p.handicap==null?99:p.handicap));
const q=Math.ceil(s.length/4);
const a=s.slice(0,q),b=s.slice(q,2*q),c=s.slice(2*q,3*q),d=s.slice(3*q);
const out=[];const max=Math.max(a.length,b.length,c.length,d.length);
for(let i=0;i<max;i++){[a,b,c,d].forEach(arr=>{if(arr[i])out.push(arr[i])})}
return out;
}
if(method==='random'){
const s=players.slice();for(let i=s.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s[i],s[j]]=[s[j],s[i]]}
return s;
}
// snake / scramble: sort by handicap (snake distributes ability)
return sortBy(players,p=>(p.handicap==null?99:p.handicap));
}

// Compute the max stroke cap for a given hole. If the tournament uses
// parPlus mode, cap = hole's par + maxStrokes. Otherwise fixed cap.
function maxForHole(t,course,holeIdx){
if(t.maxStrokesType==='parPlus'&&course&&course.par&&course.par[holeIdx]!=null){
return course.par[holeIdx]+(+t.maxStrokes||0);
}
return +t.maxStrokes||10;
}

// Score-entry modal — opens when a scorecard cell is tapped.
// Designed for fast multi-player entry: one numeric input at the top, auto-focused
// (which fires the device's numeric soft keyboard on mobile), with real-time
// auto-save+advance when the typed value can't grow without exceeding maxStrokes.
// e.g. with maxStrokes=10 on a par-5 hole: typing 5 saves 5 (since 50 > 10) and
// jumps to the next unscored player. Typing 1 waits for a second digit (10 valid).
function openHoleEntry(t,startGolfer,holeIdx,par,holes,onSave,allMembers){
const members=Array.isArray(allMembers)&&allMembers.length?allMembers:[startGolfer];
let curIdx=members.findIndex(g=>g.id===startGolfer.id);
if(curIdx<0)curIdx=0;
const p=par[holeIdx]||4;
const maxStrokes=Math.max(9,(+t.maxStrokes)||15);
let isClosed=false;

const bg=document.createElement('div');
bg.className='modal-bg';
const m=document.createElement('div');
m.className='modal';
m.style.maxWidth='400px';
m.style.textAlign='center';
bg.appendChild(m);

bg.addEventListener('click',function(e){if(e.target===bg)closeAll();});

function closeAll(){
if(isClosed)return;
isClosed=true;
document.removeEventListener('keydown',onGlobalKey);
bg.remove();
if(onSave)onSave();
}

function writeScore(g,sv){
updateTournament(t.id,function(x){
x.scores=x.scores||{};
x.scores[g.id]=x.scores[g.id]||{holeScores:Array(holes).fill(0),total:0,locked:false,scorecardEntered:true};
if(!x.scores[g.id].holeScores)x.scores[g.id].holeScores=Array(holes).fill(0);
while(x.scores[g.id].holeScores.length<holes)x.scores[g.id].holeScores.push(0);
x.scores[g.id].holeScores[holeIdx]=sv;
x.scores[g.id].total=x.scores[g.id].holeScores.reduce(function(a,b){return a+(+b||0);},0);
return x;
});
}

function findNextUnscored(fromIdx){
for(let i=fromIdx+1;i<members.length;i++){
const sc=(t.scores||{})[members[i].id];
const hs=sc&&sc.holeScores;
if(!hs||!hs[holeIdx]||hs[holeIdx]===0)return i;
}
return -1;
}

const d=s-p;

if(d===0)return 'Par';
if(d===1)return 'Bogey';
if(d===2)return 'Double';
if(d===3)return 'Triple';
if(d>=4)return '+'+d;
return '';
}

if(!n)return '#666';

return '#222';

// Backup digit pad (1-9 in 3 rows). Tap fills the input and triggers the same
