document.body.appendChild(bg);

function setupForCurrent(){
const golfer=members[curIdx];
if(!golfer){closeAll();return;}
const sc=(t.scores||{})[golfer.id]||{};
const cur=sc.holeScores?(sc.holeScores[holeIdx]||0):0;

nameEl.textContent=golfer.name;
progEl.textContent=members.length>1?('Player '+(curIdx+1)+' of '+members.length):'';
input.value=cur?String(cur):'';
input.style.color=colorFor(cur);
subLabel.textContent=cur?labelFor(cur):'enter score (1\u2013'+maxStrokes+')';
subLabel.style.color=cur?colorFor(cur):'#888';

renderPad();
renderBottom(cur);

// Focus + select so next typed character replaces existing value.
// Slight delay so the modal is in DOM and the soft keyboard fires reliably.
setTimeout(function(){
try{input.focus();input.select();}catch(e){}
},20);
}

function commitScore(sv){
const golfer=members[curIdx];
writeScore(golfer,sv);
const next=findNextUnscored(curIdx);
if(next>=0){
curIdx=next;
setupForCurrent();
}else{
closeAll();
}
}

// Real-time validation. After each keystroke:
//  - Strip non-digits.
//  - If value > max, drop the last typed char (so user can't enter invalid scores).
//  - If value > 0 and value*10 > maxStrokes, the value can't grow without exceeding
//    max — auto-save and advance to next player.
input.addEventListener('input',function(){
let v=(input.value||'').replace(new RegExp('[^0-9]','g'),'');
if(v.length>2)v=v.slice(0,2);
if(v.length){
const n=parseInt(v,10);
if(n>maxStrokes){v=v.slice(0,-1);}
}
if(input.value!==v)input.value=v;
if(!v){
subLabel.textContent='enter score (1\u2013'+maxStrokes+')';
subLabel.style.color='#888';
input.style.color='#222';
return;
}
const n=parseInt(v,10);
if(isNaN(n)||n<1)return;
subLabel.textContent=labelFor(n);
subLabel.style.color=colorFor(n);
input.style.color=colorFor(n);
// Auto-save+advance when value can't grow
if(n*10>maxStrokes){
commitScore(n);
}
});

input.addEventListener('keydown',function(e){
if(e.key==='Enter'){
e.preventDefault();
const n=parseInt(input.value,10);
if(!isNaN(n)&&n>=1&&n<=maxStrokes){commitScore(n);}
}else if(e.key==='Escape'){
e.preventDefault();
closeAll();
}
});

function makePadBtn(d){
const b=document.createElement('button');
b.type='button';
const enabled=d<=maxStrokes;
b.disabled=!enabled;
b.style.cssText='padding:.7rem 0;border-radius:8px;border:1px solid #ddd;'+
'background:'+(enabled?'#fff':'#f5f5f5')+';'+
'color:'+(enabled?colorFor(d):'#aaa')+';'+
'font-weight:700;font-size:1.2em;cursor:'+(enabled?'pointer':'not-allowed')+';'+
'-webkit-tap-highlight-color:rgba(31,111,67,.2)';
b.textContent=String(d);
if(enabled){
b.addEventListener('click',function(ev){
ev.preventDefault();
ev.stopPropagation();
// Fill the input and let the input handler do auto-save+advance.
// If a 1 is tapped (not auto-saving), the user can tap 0 to make 10.
const cur=(input.value||'').replace(new RegExp('[^0-9]','g'),'');
if(cur.length===1&&cur==='1'&&maxStrokes>=10){
const combined='1'+String(d);
const cn=parseInt(combined,10);
if(cn<=maxStrokes){
input.value=combined;
input.dispatchEvent(new Event('input'));
return;
}
}
input.value=String(d);
input.dispatchEvent(new Event('input'));
// Re-focus input so soft keyboard stays open
try{input.focus();}catch(e){}
});
}
return b;
}

function renderPad(){
padWrap.innerHTML='';
const grid=document.createElement('div');
grid.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-bottom:.4rem';
for(let d=1;d<=9;d++){grid.appendChild(makePadBtn(d));}
padWrap.appendChild(grid);
// 10+ buttons if max permits (LGCC has max 10)
if(maxStrokes>=10){
const tensRow=document.createElement('div');
tensRow.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-bottom:.4rem';
let added=0;
for(let n=10;n<=maxStrokes&&added<6;n++){
const b=document.createElement('button');
b.type='button';
b.style.cssText='padding:.6rem 0;border-radius:8px;border:1px solid #ddd;'+
'background:#fff;color:'+colorFor(n)+';font-weight:700;font-size:1.05em;'+
'cursor:pointer;-webkit-tap-highlight-color:rgba(163,27,27,.2)';
b.textContent=String(n);
b.addEventListener('click',function(ev){
ev.preventDefault();ev.stopPropagation();
input.value=String(n);
input.dispatchEvent(new Event('input'));
});
tensRow.appendChild(b);added++;
}
// Pad out the row so grid is even
while(added%3!==0){tensRow.appendChild(document.createElement('div'));added++;}
padWrap.appendChild(tensRow);
}
}

function renderBottom(cur){
bottomRow.innerHTML='';
if(members.length>1){
const skip=document.createElement('button');
skip.type='button';
skip.className='btn ghost small';
skip.textContent='Skip \u2192';
skip.addEventListener('click',function(){
const next=findNextUnscored(curIdx);
if(next>=0){curIdx=next;setupForCurrent();}else{closeAll();}
});
bottomRow.appendChild(skip);
}else{
bottomRow.appendChild(document.createElement('span'));
}
if(cur){
const clr=document.createElement('button');
clr.type='button';
clr.className='btn ghost small';
clr.style.color='#a31b1b';
clr.textContent='Clear';
clr.addEventListener('click',function(){
writeScore(members[curIdx],0);
setupForCurrent();
});
bottomRow.appendChild(clr);
}
const done=document.createElement('button');
done.type='button';
done.className='btn ghost small';
done.textContent='Done';
done.addEventListener('click',closeAll);
bottomRow.appendChild(done);
}

// Global keyboard fallback (works even when the input isn't focused, e.g. user
// clicked a pad button which transferred focus). Only fires if a key target
// isn't already the input — input handles its own keys.
function onGlobalKey(e){
if(isClosed)return;
if(e.target===input)return;
if(e.key==='Escape'){e.preventDefault();closeAll();return;}
if(e.key>='0'&&e.key<='9'){
e.preventDefault();
input.value=(input.value||'')+e.key;
input.dispatchEvent(new Event('input'));
try{input.focus();}catch(err){}
}else if(e.key==='Enter'){
e.preventDefault();
const n=parseInt(input.value,10);
if(!isNaN(n)&&n>=1&&n<=maxStrokes){commitScore(n);}
}else if(e.key==='Backspace'){
input.value=(input.value||'').slice(0,-1);
input.dispatchEvent(new Event('input'));
}
}
document.addEventListener('keydown',onGlobalKey);

setupForCurrent();
}

// ============================================================================
// STAGE 3 — SELF SCORER VIEW

// Find this user's golfer record — prefer the explicit golferId link, fall back to name/email match
let myGolfer=null;
if(user&&user.golferId)myGolfer=golfers.find(g=>g.id===user.golferId);
if(!myGolfer&&user)myGolfer=golfers.find(g=>g.name===userDisplayName(user)||g.name===user.name||(g.email&&g.email===user.email));

if(!myGolfer){
wrap.appendChild(el('div',{class:'card'},
el('h3',{},'Self Scoring'),
el('div',{style:{color:'var(--muted)',marginBottom:'1rem'}},'Your user account is not linked to a golfer record.'),
el('small',{},'Ask the tournament director to link your profile under People.')));
return wrap;
}

// Check if registered and checked in
if(!(t.checkedIn||[]).includes(myGolfer.id)){
wrap.appendChild(el('div',{class:'card empty'},'You are not checked in to this tournament.'));
return wrap;
}

const holes=t.holes||18;

while(sc.holeScores.length<holes)sc.holeScores.push(0);

// Find playing partner for attestation
const myGroup=getPlayerGroupInfo(myGolfer.id,t);
let partner=null;
if(t.pairings){
for(const grp of t.pairings){
if(grp.members.some(m=>m.golferId===myGolfer.id)){
const others=grp.members.filter(m=>m.golferId!==myGolfer.id);
if(others.length)partner=golfers.find(g=>g.id===others[0].golferId);
break;
}
}
}

// Header
wrap.appendChild(el('div',{style:{marginBottom:'.6rem'}},
el('h2',{},myGolfer.name),
el('div',{style:{color:'var(--muted)',fontSize:'.9em'}},
myGroup||'No group assigned')));

if(sc.locked){
wrap.appendChild(el('div',{class:'card',style:{textAlign:'center',padding:'1.5rem'}},
el('div',{style:{fontSize:'2rem',marginBottom:'.5rem'}},'\uD83D\uDD12'),
el('div',{style:{fontWeight:700,fontSize:'1.1em'}},'Score Locked'),
el('div',{style:{color:'var(--muted)',marginTop:'.3rem'}},'Total: '+sc.total+
(myGolfer.handicap?' \u00b7 Net: '+(sc.total-myGolfer.handicap):'')),
el('button',{class:'btn ghost small',style:{marginTop:'1rem'},
onclick:()=>{
if(!confirm2('Request unlock from tournament director?'))return;
toast('Unlock request sent to director');
}},'Request Unlock')));
return wrap;
}

// Hole progress
const holeBar=el('div',{style:{display:'flex',gap:'3px',marginBottom:'.8rem',flexWrap:'wrap'}});
for(let h=0;h<holes;h++){
const val=sc.holeScores[h]||0;
const isCur=h===State.scoringHole;
const p=par[h]||4;
const bg=isCur?'var(--green)':val?(val<p?'var(--good)':val>p?'var(--bad)':'var(--green-dark)'):'var(--surface)';
const col=val||isCur?'#fff':'var(--muted)';
holeBar.appendChild(el('button',{style:{
width:'28px',height:'28px',borderRadius:'5px',
border:isCur?'2px solid var(--green-dark)':'1px solid var(--line)',
background:bg,color:col,fontWeight:isCur?700:400,fontSize:'.75rem',cursor:'pointer'
},onclick:()=>{State.scoringHole=h;render();}},String(h+1)));
}
wrap.appendChild(holeBar);

// Current hole
const h=State.scoringHole;
const val=sc.holeScores[h]||0;
const p=par[h]||4;

const holeCard=el('div',{class:'card'});
holeCard.appendChild(el('div',{style:{display:'flex',justifyContent:'space-between',
alignItems:'center',marginBottom:'.8rem'}},
el('h3',{},'Hole '+(h+1)),
el('div',{style:{fontWeight:600,color:'var(--muted)'}},'Par '+p)));

// Numeric input — autofocus fires the device's native numeric keyboard.
// Auto-saves and advances to next hole when the typed value passes the unambiguous threshold.
const maxStrokes=Math.max(9,+t.maxStrokes||15);
const labelOf=function(v,par){
const d=v-par;
if(d===-3)return 'Albatross';
if(d===-2)return 'Eagle';
if(d===-1)return 'Birdie';
if(d===0)return 'Par';
if(d===1)return 'Bogey';
if(d>0)return '+'+d;
return String(d);
};
const colorOf=function(v,par){
const d=v-par;
if(d<0)return 'var(--good,#1f6f43)';
if(d>0)return 'var(--bad,#b73a3a)';
return 'var(--green,#2d8659)';
};

const inp=el('input',{type:'number',inputmode:'numeric',pattern:'[0-9]*',
autocomplete:'off',
style:{width:'100%',fontSize:'2.6rem',fontWeight:800,
textAlign:'center',padding:'.5rem',borderRadius:'10px',
border:'2px solid var(--line)',background:'var(--surface)',color:'var(--ink)',
boxSizing:'border-box',marginBottom:'.4rem'}});
if(val>0)inp.value=String(val);
const lblBox=el('div',{style:{textAlign:'center',fontSize:'1rem',
fontWeight:700,minHeight:'1.4em',marginBottom:'.6rem',
color:val>0?colorOf(val,p):'var(--muted)'}},
val>0?labelOf(val,p):'Tap and enter your score');

const writeAndAdvance=function(sv){
updateTournament(t.id,function(x){
x.scores=x.scores||{};
x.scores[myGolfer.id]=x.scores[myGolfer.id]||
{holeScores:Array(holes).fill(0),total:0,locked:false,scorecardEntered:true};
if(!x.scores[myGolfer.id].holeScores)x.scores[myGolfer.id].holeScores=Array(holes).fill(0);
while(x.scores[myGolfer.id].holeScores.length<holes)x.scores[myGolfer.id].holeScores.push(0);
x.scores[myGolfer.id].holeScores[h]=sv;
x.scores[myGolfer.id].total=x.scores[myGolfer.id].holeScores.reduce(function(a,b){return a+(+b||0);},0);
return x;
});
if(h<holes-1)State.scoringHole=h+1;
render();
};

const updateLabel=function(n){
if(!n){lblBox.textContent='Tap and enter your score';lblBox.style.color='var(--muted)';return;}
lblBox.textContent=labelOf(n,p);
lblBox.style.color=colorOf(n,p);
};

inp.addEventListener('input',function(){
const cleaned=inp.value.replace(new RegExp('\\D','g'),'');
if(cleaned!==inp.value)inp.value=cleaned;
const n=+cleaned;
if(!n){updateLabel(0);return;}
if(n>maxStrokes){
inp.value=String(maxStrokes);
updateLabel(maxStrokes);
writeAndAdvance(maxStrokes);
return;
}
updateLabel(n);
// If a single digit unambiguously can't be extended (n*10 > maxStrokes), save now.
// e.g. maxStrokes=10: "2" → 20>10 → save; "1" → 10>10 false → wait for possible "10".
if(n*10>maxStrokes)writeAndAdvance(n);
});

inp.addEventListener('keydown',function(e){
if(e.key==='Enter'){
const n=+inp.value;
if(n>=1&&n<=maxStrokes){e.preventDefault();writeAndAdvance(n);}
}else if(e.key==='Escape'){
inp.value='';updateLabel(0);
}
});

holeCard.appendChild(inp);
holeCard.appendChild(lblBox);

// Backup digit pad — useful on desktop, or any time the soft keyboard isn't available.
const padRow1=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:'4px',marginBottom:'4px'}});
const padRow2=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:'4px',marginBottom:'.6rem'}});
const mkDigit=function(n){
const btn=el('button',{type:'button',style:{padding:'.5rem .2rem',borderRadius:'8px',
border:'1px solid var(--line)',background:'var(--surface)',
color:'var(--ink)',fontWeight:700,fontSize:'1rem',cursor:'pointer'}},String(n));
btn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();
inp.value=String(n);
updateLabel(n);
if(n>=1&&n<=maxStrokes)writeAndAdvance(n);
});
return btn;
};
for(let n=1;n<=5;n++)padRow1.appendChild(mkDigit(n));
for(let n=6;n<=Math.min(9,maxStrokes);n++)padRow2.appendChild(mkDigit(n));
if(maxStrokes>=10)padRow2.appendChild(mkDigit(10));
// Clear button at the end of row 2
const clrBtn=el('button',{type:'button',style:{padding:'.5rem .2rem',borderRadius:'8px',
border:'1px solid var(--line)',background:'var(--surface)',
color:'var(--muted)',fontWeight:600,fontSize:'.85rem',cursor:'pointer'}},'Clear');
clrBtn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();
inp.value='';updateLabel(0);try{inp.focus();}catch(err){}

padRow2.appendChild(clrBtn);
holeCard.appendChild(padRow1);

// Auto-focus the input shortly after render so the soft keyboard pops up

fontSize:'.85em',color:'var(--muted)',padding:'.3rem 0'}},
el('span',{},'Holes: '+scored+'/'+holes),
el('span',{style:{fontWeight:700,color:'var(--ink)'}},'Total: '+(total||'\u2014'))));

wrap.appendChild(holeCard);

'\u2713 All holes complete'));

'Net: '+(myGolfer.handicap?total-myGolfer.handicap:'\u2014')));

background:'var(--surface)',borderTop:'1px solid var(--line-soft)',textAlign:'center'}},
el('button',{class:'btn ghost small',
onclick:()=>{State.page='sidegames';State.tid=t.id;render();}},
'View on Side Games \u2192')));
wrap.appendChild(chCard);
}

return wrap;
}

function getPlayerGroupInfo(golferId,t){
if(!t||!t.pairings)return null;
for(let i=0;i<t.pairings.length;i++){
const grp=t.pairings[i];
if(grp.members.some(m=>m.golferId===golferId)){
return 'G'+(i+1)+(grp.startingHole?' \u00b7 H'+grp.startingHole:'')+(grp.teeTime?' \u00b7 '+grp.teeTime:'');
}
}
return null;
}

function ScoringPage(){
const root=el('div');
const tournaments=DB.tournaments();
const golfers=DB.golfers();

if(!State.tid){
root.appendChild(el('h1',{style:{marginBottom:'.6rem'}},'Scoring'));
const actOrg=activeOrgId();
let list=tournaments.filter(t=>(t.checkedIn||[]).length>0);
// Scope to active org (so a scorer at LGCC doesn't see LHSAA events, etc.)
if(actOrg)list=list.filter(t=>t.orgId===actOrg);
// Scorers further limit to tournaments where they have an assigned group, unless they're staff
const me=State.user;
const isStaff=userHasRole(me,'admin')||userHasRole(me,'director');
if(!isStaff&&me&&userHasRole(me,'scorer')&&!userHasRole(me,'golfer')){
list=list.filter(t=>(t.pairings||[]).some(p=>p.scorerId===me.id));
}
if(!list.length){
const orgs=DB.orgs();
const orgName=actOrg?(orgs.find(o=>o.id===actOrg)||{}).name:null;
root.appendChild(el('div',{class:'empty card'},
'No tournaments to score'+(orgName?' at '+orgName:'')+'.'));

}
for(const t of sortBy(list,x=>'-'+x.date)){
root.appendChild(el('div',{class:'card',style:{cursor:'pointer'},onclick:()=>{State.tid=t.id;State.scoringGroup=null;render()}},
el('h3',{},t.name),el('small',{},fmtDate(t.date)+' \u00b7 '+(t.checkedIn||[]).length+' checked in')));
}
return root;
}

const t=tournaments.find(x=>x.id===State.tid);
if(!t){State.tid=null;return ScoringPage()}
const course=DB.courses().find(c=>c.id===t.courseId);

// Determine which scoring modes this user is allowed to use, and pick a sensible default.
// Scoring modes:
//   'self'      — golfer enters their own scores (always allowed if they have a golfer record)
//   'group'     — scorer or staff enters scores for a whole foursome
//   'scorecard' — staff: full scorecard for one player at a time
//   'totals'    — staff: just final totals (legacy fast-entry)
const me=State.user;
const isStaff=userHasRole(me,'admin')||userHasRole(me,'director');
const isScorer=userHasRole(me,'scorer');
const isGolfer=userHasRole(me,'golfer');
const allowedModes=[];
if(isGolfer||isStaff||isScorer)allowedModes.push('self');
if(isScorer||isStaff)allowedModes.push('group');
if(isStaff)allowedModes.push('scorecard','totals');
// If user is golfer-only, default to self. Scorer-only -> group. Staff -> scorecard.
if(!State.scoringMode||allowedModes.indexOf(State.scoringMode)<0){
if(isGolfer&&!isScorer&&!isStaff)State.scoringMode='self';
else if(isScorer&&!isStaff)State.scoringMode='group';
else State.scoringMode='scorecard';
// Final fallback if their role gives no modes (shouldn't happen)
if(allowedModes.indexOf(State.scoringMode)<0)State.scoringMode=allowedModes[0]||'self';
}

root.appendChild(el('div',{class:'row',style:{marginBottom:'.4rem',gap:'.4rem'}},
el('button',{class:'btn ghost small',onclick:()=>{State.tid=null;State.scoringId=null;render()}},'← Tournaments')));
root.appendChild(el('h1',{},t.name));

// Mode toggle — only show modes this role can use; only show the bar if 2+ modes
if(allowedModes.length>=2){

const addModeBtn=(key,label)=>{

modeBar.appendChild(el('button',{class:State.scoringMode===key?'btn small':'btn secondary small',
onclick:()=>{State.scoringMode=key;render()}},label));
};
addModeBtn('self','\uD83E\uDD35 Self');
addModeBtn('group','\uD83D\uDC65 Group');

// Hole selector — jump to first unscored player on that starting hole

textTransform:'uppercase',letterSpacing:'.04em',marginBottom:'.3rem'}},'Jump to Starting Hole'));
const btnRow=el('div',{style:{display:'flex',flexWrap:'wrap',gap:'5px'}});
sortedHoles.forEach(h=>{
const grps=holeGroups[h];
const allMembers=grps.flatMap(g=>g.members.map(m=>m.golferId));
const scoredCt=allMembers.filter(id=>(t.scores||{})[id]&&((t.scores[id].total||0)>0)).length;
const total=allMembers.length;

}

}

tcard.appendChild(el('div',{style:{display:'grid',gridTemplateColumns:cols,gap:'.5rem',marginBottom:'.5rem'}},

if(!sc.locked) tcard.appendChild(el('button',{class:'btn full',onclick:()=>{

const bg2=el('div',{class:'modal-bg'});
const pop=el('div',{class:'modal',style:{textAlign:'center'}},

el('div',{style:{color:'var(--muted)',marginBottom:'1rem'}},'Net: '+net2+' \u00b7 Hcp: '+hcp),

}

// Calculate and persist handicap from tournament score
// handicap = score - course par (simple differential)
function calcAndSaveHandicap(golferId,t){
try{
const sc=(t.scores||{})[golferId];if(!sc||!sc.total)return;
const course=DB.courses().find(c=>c.id===t.courseId);
if(!course)return;
const par=course.par?course.par.reduce((a,b)=>a+b,0):72;
const diff=sc.total-par;
const all=DB.golfers();
const idx=all.findIndex(g=>g.id===golferId);
if(idx<0)return;
// Only update if this gives a better (lower) handicap or no handicap set
const cur=all[idx];
if(cur.handicap==null||cur.handicap===0||diff<cur.handicap){
all[idx]={...cur,handicap:diff};
DB.setGolfers(all);
}
}catch(e){console.warn('handicap calc failed',e);}
}

// ── SCORECARD MODE ───────────────────────────────────────
const sc=(t.scores&&t.scores[cur.id])||{holeScores:Array(t.holes).fill(0),total:0,locked:false};
if(!sc.holeScores)sc.holeScores=Array(t.holes).fill(0);
while(sc.holeScores.length<t.holes)sc.holeScores.push(0);

const card=el('div',{class:'card'});
card.appendChild(el('div',{class:'row between'},
el('h3',{},'Hole-by-hole'),
sc.locked?el('button',{class:'btn small secondary',onclick:()=>{updateTournament(t.id,x=>{x.scores[cur.id].locked=false;return x});render();}},'\uD83D\uDD13 Unlock'):null));

const thStyle=(extra)=>Object.assign({padding:'.28rem .3rem',textAlign:'center',fontSize:'.72rem',fontWeight:700,background:'var(--green)',color:'#fff',border:'1px solid rgba(255,255,255,.25)'},extra||{});

const tdTotalStyle=(bold)=>({padding:'.28rem .4rem',textAlign:'center',fontSize:'.88rem',fontWeight:bold?700:500,background:'var(--green-light)',border:'1px solid var(--line-soft)',whiteSpace:'nowrap'});

const getF=()=>sum(sc.holeScores.slice(0,Math.min(9,t.holes)));
const getB=()=>t.holes>9?sum(sc.holeScores.slice(9)):0;
const getG=()=>sum(sc.holeScores);

const outTotalHdrCell=el('th',{style:thStyle({background:'var(--green-dark)'})},'Out');

const totalHdrCell=el('th',{style:thStyle({background:'var(--green-dark)'})}, 'Total');
const hcpHdrCell=el('th',{style:thStyle({background:'var(--green-dark)'})}, 'Hcp');
const netHdrCell=el('th',{style:thStyle({background:'var(--green-dark)'})}, 'Net');
const inParCell=el('td',{style:tdParStyle},String(parBack||''));
const totalParCell=el('td',{style:tdParStyle},String(parTotal||''));
const hcpParCell=el('td',{style:tdParStyle},String(hcp));
const netParCell=el('td',{style:tdParStyle},'');
const inScoreCell=el('td',{style:tdTotalStyle(true)},'--');
const totalScoreCell=el('td',{style:tdTotalStyle(true)},'--');
const hcpScoreCell=el('td',{style:tdTotalStyle(false)},String(hcp));
const netScoreCell=el('td',{style:tdTotalStyle(true)},'--');

const updateSubtotals=()=>{
const f=getF(),b=getB(),g=getG(),net2=g?g-hcp:0;
outScoreCell.textContent=f||'--';
if(t.holes>9){inScoreCell.textContent=b||'--';totalScoreCell.textContent=g||'--';netScoreCell.textContent=g?net2:'--';}
if(typeof checkMatch==='function') checkMatch();
};

const allHoleInputs=new Array(t.holes).fill(null);
const commitScore=(inp,h)=>{
const cap=maxForHole(t,course,h);
const v=Math.min(cap,Math.max(0,+inp.value||0));
inp.value=v||'';
const p=course&&course.par[h]?course.par[h]:4;
inp.style.color=v&&p?(v<p?'var(--good)':(v>p?'var(--bad)':'var(--ink)')):'var(--ink)';
// Mutate local sc.holeScores BEFORE persist so updateSubtotals reads fresh
// values. (Without this, a brand-new score record allocated inside
// updateTournament is a different object than 'sc', so OUT/IN/TOTAL stayed
// '--' on first-time entry.)
sc.holeScores[h]=v;
sc.total=sum(sc.holeScores);
updateTournament(t.id,x=>{
x.scores=x.scores||{};x.scores[cur.id]=x.scores[cur.id]||{holeScores:Array(t.holes).fill(0),total:0,locked:false};
x.scores[cur.id].holeScores[h]=v;x.scores[cur.id].total=sum(x.scores[cur.id].holeScores);return x;});
updateSubtotals();
};

// Side-game challenges scoreboard — shows current state of each Best Ball + Nassau match.
// Format: card per match with team1/player1 vs team2/player2, big "+N" / "AS" status under each.
function ChallengesBoard(t,course,data){
const wrap=el('div');
const golfers=DB.golfers();
const par=course?course.par:Array(t.holes||18).fill(4);
const holes=t.holes||18;
const sgRoot=t.sideGames||{};
const bb=sgRoot.sideGames_bb||{matches:[],holePoints:50,birdiePoints:100,hole10Restart:true};
const ns=sgRoot.sideGames_nassau||{matches:[]};

// For Big Game tournaments, the format ITSELF is the primary challenge
// (Top + Bottom best-ball per pairing group). Show those standings up top
// before any user-created Best Ball / Nassau matches.
if(t.format==='biggame'&&data&&data.bgGroups&&data.bgGroups.length){
const bgHeader=el('div',{style:{fontSize:'.75em',fontWeight:700,color:'var(--muted)',
textTransform:'uppercase',letterSpacing:'.05em',margin:'.2rem 0 .5rem'}},'Big Game (Top \u00b7 Bottom)');
wrap.appendChild(bgHeader);
wrap.appendChild(BigGameTeamBoard(data.bgGroups));
}

const nameOf=(id)=>{const g=golfers.find(x=>x.id===id);return g?g.name:'?'};
const firstName=(id)=>nameOf(id).split(' ')[0];
const teamLabel=(ids)=>ids.map(firstName).join(' & ');

// Helper: get a player's gross hole-by-hole array
const holesOf=(id)=>{
const sc=(t.scores||{})[id];
const hs=(sc&&sc.holeScores)||[];
const out=[];for(let i=0;i<holes;i++)out[i]=+hs[i]||0;
return out;
};

// Best Ball: per hole, lower of teamA's two players, vs lower of teamB's two players.
// Status = (teamA holes won so far) - (teamB holes won so far).
// hole10Restart splits into front-9 / back-9 segments if true.
const renderBBStatus=(match)=>{
const pairA=match.pairA||match.teamA||[];
const pairB=match.pairB||match.teamB||[];
if(pairA.length<2||pairB.length<2)return [];
const a1=holesOf(pairA[0]),a2=holesOf(pairA[1]);
const b1=holesOf(pairB[0]),b2=holesOf(pairB[1]);
const segments=bb.hole10Restart!==false?[[0,9],[9,18]]:[[0,18]];
const segLabels=segments.length===2?['Front 9','Back 9']:['Match'];
const segCards=[];
for(let si=0;si<segments.length;si++){
const seg=segments[si];const s=seg[0],e=seg[1];
let aWins=0,bWins=0,played=0,aPlayed=0,bPlayed=0;
for(let h=s;h<e&&h<holes;h++){
const aHas=(a1[h]>0)||(a2[h]>0);
const bHas=(b1[h]>0)||(b2[h]>0);
if(aHas)aPlayed++;
if(bHas)bPlayed++;
if(aHas&&bHas){
played++;
const av=Math.min(a1[h]||99,a2[h]||99);
const bv=Math.min(b1[h]||99,b2[h]||99);
if(av<bv)aWins++;else if(bv<av)bWins++;
}
}
const lead=aWins-bWins;
const totalH=Math.min(e,holes)-s;
const remaining=totalH-played;
const closedOut=Math.abs(lead)>remaining&&played>0;
segCards.push({label:segLabels[si],played,total:totalH,closedOut,lead,aPlayed,bPlayed});
}
return segCards;
};

// Nassau: stroke play with handicap (h.cp from g.hcp or g.handicap), three sub-bets F9/B9/Total.
const renderNassauStatus=(match)=>{
const p1=match.playerA||(match.players&&match.players[0]);
const p2=match.playerB||(match.players&&match.players[1]);
if(!p1||!p2)return [];
const g1=golfers.find(x=>x.id===p1)||{};
const g2=golfers.find(x=>x.id===p2)||{};
const hcp1=g1.hcp!=null?g1.hcp:(g1.handicap||0);
const hcp2=g2.hcp!=null?g2.hcp:(g2.handicap||0);
const h1=holesOf(p1),h2=holesOf(p2);
const segs=[
{label:'F9',start:0,end:9,allow:Math.round(hcp2/2)-Math.round(hcp1/2)},
{label:'B9',start:9,end:18,allow:Math.round(hcp2/2)-Math.round(hcp1/2)},
{label:'Total',start:0,end:18,allow:hcp2-hcp1}
];
const cards=[];
for(let i=0;i<segs.length;i++){
const seg=segs[i];
let s1=0,s2=0,played=0,aPlayed=0,bPlayed=0;
for(let h=seg.start;h<seg.end&&h<holes;h++){
if(h1[h]>0){s1+=h1[h];aPlayed++;}
if(h2[h]>0){s2+=h2[h];bPlayed++;}
if(h1[h]>0&&h2[h]>0)played++;
}
const net1=s1-(seg.allow>0?0:Math.abs(seg.allow));
const net2=s2-(seg.allow>0?seg.allow:0);
const diff=net2-net1;
cards.push({label:seg.label,played,
total:seg.end-seg.start,
lead:played>0?diff:0,
aPlayed,bPlayed});
}
return cards;
};

const bbMatches=(bb.matches||[]);
const nsMatches=(ns.matches||[]);

const bgRendered=t.format==='biggame'&&data&&data.bgGroups&&data.bgGroups.length;
if(!bbMatches.length&&!nsMatches.length&&!bgRendered){
wrap.appendChild(el('div',{class:'empty card'},
'No active challenges. Set up Best Ball or Nassau matches in Side Games.'));
return wrap;
}
// If BG was rendered above and no user matches, return now (BG is the whole show)
if(!bbMatches.length&&!nsMatches.length){
return wrap;
}

// Helper: render a status cell with team1Lead | "vs" | team2Lead format
const statusCell=(label,lead,played,total,aPlayed,bPlayed)=>{
const aLead=lead>0?'+'+lead:lead===0?(played>0?'AS':'\u2014'):'\u2014';
const bLead=lead<0?'+'+Math.abs(lead):lead===0?(played>0?'AS':'\u2014'):'\u2014';
const aColor=lead>0?'var(--good,#1f6f43)':'var(--muted)';
const bColor=lead<0?'var(--good,#1f6f43)':'var(--muted)';
// Progress line: when both teams have the same play count, show "N/total".
// When unequal (one team is ahead in holes played), break it out so users
// understand why the lead might be "—" (waiting on the slower side).
const aP=aPlayed!=null?aPlayed:played;
const bP=bPlayed!=null?bPlayed:played;
const progressText=(aP===bP)?(aP+'/'+total):('A:'+aP+' \u00b7 B:'+bP);
return el('div',{style:{textAlign:'center',padding:'.4rem .2rem',
background:'var(--surface)',borderRadius:'8px'}},
el('div',{style:{fontSize:'.7em',color:'var(--muted)',marginBottom:'.2rem',
textTransform:'uppercase',letterSpacing:'.04em',fontWeight:600}},label),
el('div',{style:{display:'flex',justifyContent:'center',gap:'.4rem',alignItems:'center',fontWeight:700}},
el('div',{style:{color:aColor,fontSize:'1.05em',minWidth:'30px'}},aLead),
el('div',{style:{fontSize:'.65em',color:'var(--muted)',opacity:.7}},'\u2022'),
el('div',{style:{color:bColor,fontSize:'1.05em',minWidth:'30px'}},bLead)),
el('div',{style:{fontSize:'.65em',color:'var(--muted)',marginTop:'.2rem'}},
progressText));
};

// Best Ball matches
if(bbMatches.length){
wrap.appendChild(el('div',{style:{fontSize:'.75em',fontWeight:700,color:'var(--muted)',
textTransform:'uppercase',letterSpacing:'.05em',margin:'.2rem 0 .5rem'}},'Best Ball'));
for(const match of bbMatches){
const cards=renderBBStatus(match);
const pairA=match.pairA||match.teamA||[];
const pairB=match.pairB||match.teamB||[];
// Per-player hole counts so admins can immediately see who has scores entered
const holeCt=(id)=>{const hs=holesOf(id);let c=0;for(let i=0;i<hs.length;i++)if(hs[i]>0)c++;return c;};
const teamSubLabel=(ids)=>ids.map(id=>{
const nm=nameOf(id).split(' ')[0];
const c=holeCt(id);
return nm+' ('+c+')';
}).join(' \u00b7 ');
const card=el('div',{class:'card',style:{marginBottom:'.6rem'}});
card.appendChild(el('div',{style:{display:'grid',gridTemplateColumns:'1fr auto 1fr',
alignItems:'center',gap:'.6rem',marginBottom:'.4rem'}},
el('div',{style:{textAlign:'right'}},
el('div',{style:{fontWeight:600}},teamLabel(pairA)),
el('small',{style:{color:'var(--muted)',fontSize:'.7em'}},teamSubLabel(pairA))),
el('div',{style:{padding:'2px 8px',background:'var(--surface)',borderRadius:'10px',
fontSize:'.7em',color:'var(--muted)'}},'vs'),
el('div',{style:{textAlign:'left'}},
el('div',{style:{fontWeight:600}},teamLabel(pairB)),
el('small',{style:{color:'var(--muted)',fontSize:'.7em'}},teamSubLabel(pairB)))));
if(!cards.length){
card.appendChild(el('small',{style:{color:'var(--muted)'}},'(invalid match data)'));
}else{
const segGrid=el('div',{style:{display:'grid',
gridTemplateColumns:'repeat('+cards.length+',1fr)',gap:'.4rem'}});
cards.forEach(c=>segGrid.appendChild(statusCell(c.label,c.lead,c.played,c.total,c.aPlayed,c.bPlayed)));
card.appendChild(segGrid);
}
wrap.appendChild(card);
}
}

// Nassau matches
if(nsMatches.length){
wrap.appendChild(el('div',{style:{fontSize:'.75em',fontWeight:700,color:'var(--muted)',
textTransform:'uppercase',letterSpacing:'.05em',margin:'.6rem 0 .5rem'}},'Nassau'));
for(const match of nsMatches){
const cards=renderNassauStatus(match);
const p1=match.playerA||(match.players&&match.players[0]);
const p2=match.playerB||(match.players&&match.players[1]);
const holeCt=(id)=>{const hs=holesOf(id);let c=0;for(let i=0;i<hs.length;i++)if(hs[i]>0)c++;return c;};
const card=el('div',{class:'card',style:{marginBottom:'.6rem'}});
card.appendChild(el('div',{style:{display:'grid',gridTemplateColumns:'1fr auto 1fr',
alignItems:'center',gap:'.6rem',marginBottom:'.4rem'}},
el('div',{style:{textAlign:'right'}},
el('div',{style:{fontWeight:600}},nameOf(p1)),
el('small',{style:{color:'var(--muted)',fontSize:'.7em'}},holeCt(p1)+' holes')),
el('div',{style:{padding:'2px 8px',background:'var(--surface)',borderRadius:'10px',
fontSize:'.7em',color:'var(--muted)'}},'vs'),
el('div',{style:{textAlign:'left'}},
el('div',{style:{fontWeight:600}},nameOf(p2)),
el('small',{style:{color:'var(--muted)',fontSize:'.7em'}},holeCt(p2)+' holes'))));
if(!cards.length){
card.appendChild(el('small',{style:{color:'var(--muted)'}},'(invalid match data)'));
}else{
const segGrid=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'.4rem'}});
cards.forEach(c=>segGrid.appendChild(statusCell(c.label,c.lead,c.played,c.total,c.aPlayed,c.bPlayed)));
card.appendChild(segGrid);
}
wrap.appendChild(card);
}
}

return wrap;
}

function computeStandings(t,course){
const golfers=DB.golfers();
const teams=DB.teams();
const courseParArr=course?course.par.slice(0,t.holes):Array(t.holes||18).fill(4);
const parTotal=sum(courseParArr);
const reg=(t.checkedIn||t.registrants||[]);
const rows=[];
for(const id of reg){
const g=golfers.find(x=>x.id===id);if(!g)continue;
const sc=(t.scores||{})[id];
const holeScores=(sc&&sc.holeScores)||[];
const filled=holeScores.filter(h=>h>0).length;
const total=sc?(sc.total||sum(holeScores)):0;
// Par-for-played: only sum par values where the player has a real score.
// Once they've finished, this equals parTotal. Mid-round, it's "par for the
// holes you've actually played" so toPar reads +1 / -2 like a real leaderboard.
let parPlayed=0;
for(let i=0;i<courseParArr.length;i++){if((holeScores[i]||0)>0)parPlayed+=courseParArr[i];}
const team=teams.find(x=>x.id===g.teamId);
rows.push({
golferId:id,name:g.name,teamId:g.teamId,teamName:team?team.name:'(no team)',
teamColor:team?team.color:'#888',
handicap:g.handicap,total,filled,
toPar:filled>0?(total-parPlayed):0,
holesPlayed:filled,holes:t.holes,parTotal,parPlayed,locked:sc&&sc.locked
});
}
// Sort: those who have any score, by total asc; those with 0 last
const scored=rows.filter(r=>r.total>0);
const unscored=rows.filter(r=>r.total===0);
scored.sort((a,b)=>a.total-b.total||a.name.localeCompare(b.name));
unscored.sort((a,b)=>a.name.localeCompare(b.name));

// Team scoring — rules driven by FORMAT_RULES
const fr=getFR(t.format);
const byTeam={};
for(const r of scored){
if(!r.teamId)continue;
(byTeam[r.teamId]=byTeam[r.teamId]||[]).push(r);
}
const teamRows=[];
if(fr.teamScoring==='best4of5'){
for(const tid in byTeam){
const players=byTeam[tid].slice().sort((a,b)=>a.total-b.total);
const counted=players.slice(0,4);
const teamObj=teams.find(x=>x.id===tid);
if(counted.length<4){
teamRows.push({teamId:tid,teamName:teamObj?teamObj.name:'',color:teamObj?teamObj.color:'#888',
total:null,disqualified:true,counted,size:players.length});
}else{
teamRows.push({teamId:tid,teamName:teamObj?teamObj.name:'',color:teamObj?teamObj.color:'#888',
total:sum(counted.map(c=>c.total)),disqualified:false,counted,size:players.length});
}
}
}else if(fr.teamScoring==='pair'||fr.teamScoring==='group'){
// Scramble: each pairing/group is its own scoring unit — lowest score wins
for(const tid in byTeam){
const players=byTeam[tid].slice().sort((a,b)=>a.total-b.total);
const teamObj=teams.find(x=>x.id===tid);
teamRows.push({teamId:tid,teamName:teamObj?teamObj.name:'',color:teamObj?teamObj.color:'#888',
total:sum(players.map(c=>c.total)),disqualified:false,counted:players,size:players.length});
}
}
// 'none' = no team scoring, teamRows stays empty
teamRows.sort((a,b)=>{
if(a.disqualified&&!b.disqualified)return 1;
if(!a.disqualified&&b.disqualified)return -1;
return (a.total||0)-(b.total||0);
});

// Big Game: snake-draft pairing groups become the team unit.
// Per group, compute Top (best ball per hole) and Bottom (best + 2nd best per hole).
let bgGroups=null;
if(t.format==='biggame'&&(t.pairings||[]).length){
bgGroups=[];
const allScores=t.scores||{};
for(let gi=0;gi<t.pairings.length;gi++){
const g=t.pairings[gi];
const memberIds=(g.members||[]).map(m=>m.golferId);
const memberRows=memberIds.map(id=>{
const gf=golfers.find(x=>x.id===id);
const sc=allScores[id]||{};
return {id,name:gf?gf.name:'?',scores:sc.holeScores||[],total:sc.total||0};
});
let topTotal=0,bottomTotal=0,topPar=0,bottomPar=0,topHoles=0,bottomHoles=0;
const perHole=[];
for(let h=0;h<t.holes;h++){
const vals=memberRows.map(r=>r.scores[h]||0).filter(v=>v>0).sort((a,b)=>a-b);
const p=course?(course.par[h]||4):4;
const best=vals.length>=1?vals[0]:0;
const second=vals.length>=2?vals[1]:0;
if(best){topTotal+=best;topPar+=p;topHoles++;}
if(best&&second){bottomTotal+=(best+second);bottomPar+=2*p;bottomHoles++;}
perHole.push({h,best,second,par:p,vals});
}
bgGroups.push({
groupIndex:gi,name:'Group '+(gi+1),startingHole:g.startingHole||1,
members:memberRows,
topTotal,topPar,topToPar:topTotal-topPar,topHoles,
bottomTotal,bottomPar,bottomToPar:bottomTotal-bottomPar,bottomHoles,
totalHoles:t.holes,perHole
});
}
}

// Individual qualifiers — count driven by FORMAT_RULES
const qualifyingTeamIds=new Set(teamRows.filter(t=>!t.disqualified).slice(0,fr.qualifyTeams).map(t=>t.teamId));
const indivQualifiers=scored.filter(r=>!r.teamId||!qualifyingTeamIds.has(r.teamId)).slice(0,fr.qualifyIndiv);
const qualifierIds=new Set(indivQualifiers.map(r=>r.golferId));

return {
parTotal,scored,unscored,teamRows,qualifierIds,bgGroups,
rows:scored.concat(unscored),
};
}

function BigGameTeamBoard(groups){
const wrap=el('div');
const fmtToPar=(n)=>n===0?'E':(n>0?'+'+n:String(n));

// --- Top (best ball) ---
const topGroups=groups.slice().sort((a,b)=>{
if(a.topHoles===0&&b.topHoles===0)return 0;
if(a.topHoles===0)return 1;
if(b.topHoles===0)return -1;
return a.topToPar-b.topToPar;
});
const topCard=el('div',{class:'card',style:{padding:0,overflow:'hidden',marginBottom:'1rem'}});
topCard.appendChild(el('div',{style:{padding:'.7rem .8rem',background:'var(--green)',color:'#fff',
display:'flex',justifyContent:'space-between',alignItems:'center'}},
el('strong',{},'Top — Best Ball'),
el('span',{style:{fontSize:'.8em',opacity:.85}},'lowest 1 score per hole')));
const topBest=topGroups.length&&topGroups[0].topHoles>0?topGroups[0].topToPar:null;
let posT=0,prevT=null;
topGroups.forEach((g,i)=>{
if(g.topHoles===0){
topCard.appendChild(el('div',{class:'lb-row',style:{gridTemplateColumns:'32px 1fr auto'}},
el('div',{class:'pos'},'\u2014'),
el('div',{class:'nm'},
el('div',{},g.name),
el('small',{},'no scores yet')),
el('div',{class:'scr'},'\u2014')));
return;
}
if(g.topToPar!==prevT){posT=i+1;prevT=g.topToPar;}
const isLeader=topBest!=null&&g.topToPar===topBest;
const memberLine=g.members.map(m=>m.name.split(' ').pop()).join(', ');
const incomplete=g.topHoles<g.totalHoles;
topCard.appendChild(el('div',{class:'lb-row',
style:{gridTemplateColumns:'32px 1fr auto auto',
background:isLeader?'#fffbe6':'transparent'}},
el('div',{class:'pos'},posT),
el('div',{class:'nm'},
el('div',{style:{fontWeight:isLeader?700:400}},
g.name+(isLeader?' \uD83C\uDFC6':'')),
el('small',{},memberLine+(incomplete?' \u00b7 '+g.topHoles+'/'+g.totalHoles+' holes':''))),
el('div',{class:'rel',style:{marginRight:'.5rem'}},fmtToPar(g.topToPar)),
el('div',{class:'scr'},g.topTotal)));
});
wrap.appendChild(topCard);

// --- Bottom (best + 2nd) ---
const botGroups=groups.slice().sort((a,b)=>{
if(a.bottomHoles===0&&b.bottomHoles===0)return 0;
if(a.bottomHoles===0)return 1;
if(b.bottomHoles===0)return -1;
return a.bottomToPar-b.bottomToPar;
});
const botCard=el('div',{class:'card',style:{padding:0,overflow:'hidden',marginBottom:'1rem'}});
botCard.appendChild(el('div',{style:{padding:'.7rem .8rem',background:'var(--green-dark)',color:'#fff',
display:'flex',justifyContent:'space-between',alignItems:'center'}},
el('strong',{},'Bottom — Best + 2nd'),
el('span',{style:{fontSize:'.8em',opacity:.85}},'lowest 2 scores per hole')));
const botBest=botGroups.length&&botGroups[0].bottomHoles>0?botGroups[0].bottomToPar:null;
let posB=0,prevB=null;
botGroups.forEach((g,i)=>{
if(g.bottomHoles===0){
botCard.appendChild(el('div',{class:'lb-row',style:{gridTemplateColumns:'32px 1fr auto'}},
el('div',{class:'pos'},'\u2014'),
el('div',{class:'nm'},
el('div',{},g.name),
el('small',{},'need 2+ scores per hole')),
el('div',{class:'scr'},'\u2014')));
return;
}
if(g.bottomToPar!==prevB){posB=i+1;prevB=g.bottomToPar;}
const isLeader=botBest!=null&&g.bottomToPar===botBest;
const memberLine=g.members.map(m=>m.name.split(' ').pop()).join(', ');
const incomplete=g.bottomHoles<g.totalHoles;
botCard.appendChild(el('div',{class:'lb-row',
style:{gridTemplateColumns:'32px 1fr auto auto',
background:isLeader?'#fffbe6':'transparent'}},
el('div',{class:'pos'},posB),
el('div',{class:'nm'},
el('div',{style:{fontWeight:isLeader?700:400}},
g.name+(isLeader?' \uD83C\uDFC6':'')),
el('small',{},memberLine+(incomplete?' \u00b7 '+g.bottomHoles+'/'+g.totalHoles+' holes':''))),
el('div',{class:'rel',style:{marginRight:'.5rem'}},fmtToPar(g.bottomToPar)),
el('div',{class:'scr'},g.bottomTotal)));
});
wrap.appendChild(botCard);

return wrap;
}

function readImportFile(file,orgId,forcedTeamId,dryRun,statusEl,previewEl,bg){
const isXlsx=/.xlsx$/i.test(file.name);
const isXls=/.xls$/i.test(file.name);
const isPdf=/.pdf$/i.test(file.name);
const reader=new FileReader();
reader.onerror=()=>{statusEl.innerHTML='<span style="color:var(--bad)">Could not read file</span>'};
reader.onload=async(e)=>{
if(isPdf){
if(typeof pdfjsLib==='undefined'){
statusEl.innerHTML='<span style="color:var(--bad)">PDF parser unavailable in this preview. Download the app and reopen, or save the PDF as CSV.</span>';
return;
}
statusEl.innerHTML='<span>Parsing PDF\u2026</span>';
try{
const rows=await parsePdfToRows(e.target.result);
if(!rows.length){statusEl.innerHTML='<span style="color:var(--bad)">PDF contained no readable text rows.</span>';return}
statusEl.innerHTML='<span>Extracted '+rows.length+' rows from PDF. Review preview carefully.</span>';
parseRowsAndImport(rows,orgId,forcedTeamId,dryRun,statusEl,previewEl,bg);
}catch(err){statusEl.innerHTML='<span style="color:var(--bad)">PDF parse error: '+err.message+'</span>'}
return;
}
let rows;
try{
if(isXlsx){
statusEl.innerHTML='<span>Parsing Excel\u2026</span>';
try{
rows=await parseXlsxNative(e.target.result);
}catch(nativeErr){
// Fall back to SheetJS if loaded
if(typeof XLSX!=='undefined'){
const wb=XLSX.read(e.target.result,{type:'array'});
const sheet=wb.Sheets[wb.SheetNames[0]];
rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:false});
}else throw nativeErr;
}
}else if(isXls){
// Legacy binary .xls needs SheetJS
if(typeof XLSX==='undefined'){
statusEl.innerHTML='<span style="color:var(--bad)">Legacy .xls parser not available in this preview. Save as .xlsx or .csv and try again.</span>';
return;
}
const wb=XLSX.read(e.target.result,{type:'array'});
const sheet=wb.Sheets[wb.SheetNames[0]];
rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:false});
}else{
const text=new TextDecoder().decode(e.target.result);
rows=parseCSV(text);
}
}catch(err){
statusEl.innerHTML='<span style="color:var(--bad)">Parse error: '+err.message+'</span>';
return;
}
parseRowsAndImport(rows,orgId,forcedTeamId,dryRun,statusEl,previewEl,bg);
};
reader.readAsArrayBuffer(file);
}

// Native xlsx parser: unzips with DecompressionStream, parses XML with DOMParser.
// Handles modern .xlsx files only (not legacy .xls). Returns array-of-arrays.
async function parseXlsxNative(arrayBuffer){
if(typeof DecompressionStream==='undefined')
throw new Error('Browser too old for native xlsx parsing');
const u8=new Uint8Array(arrayBuffer);
const dv=new DataView(arrayBuffer);
// Find end-of-central-directory record (search backwards from end)
let eocd=-1;
const minStart=Math.max(0,u8.length-65557);
for(let i=u8.length-22;i>=minStart;i--){
if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}
}
if(eocd<0)throw new Error('Not a valid xlsx (zip) file');
const cdOffset=dv.getUint32(eocd+16,true);
const cdEntries=dv.getUint16(eocd+10,true);
// Parse central directory
const files={};
let p=cdOffset;
for(let i=0;i<cdEntries;i++){
if(dv.getUint32(p,true)!==0x02014b50)throw new Error('Bad central dir at '+p);
const method=dv.getUint16(p+10,true);
const cSize=dv.getUint32(p+20,true);
const uSize=dv.getUint32(p+24,true);
const fnLen=dv.getUint16(p+28,true);
const exLen=dv.getUint16(p+30,true);
const comLen=dv.getUint16(p+32,true);
const lhOff=dv.getUint32(p+42,true);
const fname=new TextDecoder().decode(u8.subarray(p+46,p+46+fnLen));
files[fname]={method,cSize,uSize,lhOff};
p+=46+fnLen+exLen+comLen;
}
async function readFile(name){
const e=files[name];if(!e)return null;
if(dv.getUint32(e.lhOff,true)!==0x04034b50)throw new Error('Bad local header');
const lFnLen=dv.getUint16(e.lhOff+26,true);
const lExLen=dv.getUint16(e.lhOff+28,true);
const dataStart=e.lhOff+30+lFnLen+lExLen;
const compressed=u8.subarray(dataStart,dataStart+e.cSize);
if(e.method===0){
return new TextDecoder().decode(compressed);
}else if(e.method===8){
const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
const buf=await new Response(stream).arrayBuffer();
return new TextDecoder().decode(buf);
}
throw new Error('Unsupported zip compression: '+e.method);
}
// Workbook -> find first sheet's relationship
const sharedStrings=[];
const ssXml=await readFile('xl/sharedStrings.xml');
if(ssXml){
const ssDoc=new DOMParser().parseFromString(ssXml,'text/xml');
const sis=ssDoc.getElementsByTagName('si');
for(let i=0;i<sis.length;i++)sharedStrings.push(sis[i].textContent||'');
}
// Find first sheet — try sheet1.xml first, then anything in xl/worksheets/
let sheetXml=await readFile('xl/worksheets/sheet1.xml');
if(!sheetXml){
for(const name in files){
if(/^xl\/worksheets\/sheet\d+\.xml$/.test(name)){
sheetXml=await readFile(name);if(sheetXml)break;
}
}
}
if(!sheetXml)throw new Error('No worksheet found in xlsx');
const sheetDoc=new DOMParser().parseFromString(sheetXml,'text/xml');
const rows=sheetDoc.getElementsByTagName('row');
const result=[];
for(let r=0;r<rows.length;r++){
const row=rows[r];
const cells=row.getElementsByTagName('c');
const rowArr=[];
for(let ci=0;ci<cells.length;ci++){
const cell=cells[ci];
const ref=cell.getAttribute('r')||'';
const letters=(ref.match(/^[A-Z]+/)||[''])[0];
let col=0;for(const ch of letters)col=col*26+(ch.charCodeAt(0)-64);
col-=1;
const t=cell.getAttribute('t');
const vEl=cell.getElementsByTagName('v')[0];
const isEl=cell.getElementsByTagName('is')[0];
const v=vEl?vEl.textContent:'';
let value;
if(t==='s')value=sharedStrings[parseInt(v)]||'';
else if(t==='inlineStr')value=isEl?isEl.textContent:'';
else if(t==='b')value=v==='1'?'TRUE':'FALSE';
else if(t==='str')value=v;
else value=v;
while(rowArr.length<col)rowArr.push('');
rowArr.push(value);
}
result.push(rowArr);
}
return result;
}

// Heuristic PDF -> rows: group text items by approximate y-position to form rows,
// then sort items left-to-right within each row.
async function parsePdfToRows(arrayBuffer){
const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
const allRows=[];
for(let p=1;p<=pdf.numPages;p++){
const page=await pdf.getPage(p);
const tc=await page.getTextContent();
// Group items by rounded y (within ~3pt tolerance)
const buckets={};
for(const item of tc.items){
const x=item.transform[4];
const y=Math.round(item.transform[5]);
// Find a nearby bucket within tolerance
let key=null;
for(const k of Object.keys(buckets)){
if(Math.abs(+k-y)<=3){key=k;break}
}
if(key==null){key=String(y);buckets[key]=[]}
buckets[key].push({x,str:item.str});
}
// Sort buckets top-to-bottom (PDF y goes up; higher y = higher on page)
const ys=Object.keys(buckets).map(Number).sort((a,b)=>b-a);
for(const y of ys){
const items=buckets[y].sort((a,b)=>a.x-b.x);
// Build row: split by gaps (>~10pt gap between items = column break)
const cells=[];let cur=items[0]?items[0].str:'';let prevEnd=items[0]?items[0].x:0;
for(let i=1;i<items.length;i++){
const gap=items[i].x-prevEnd;
if(gap>10){cells.push(cur.trim());cur=items[i].str}
else cur+=items[i].str;
prevEnd=items[i].x;
}
if(cur.trim())cells.push(cur.trim());
// Skip empty rows
if(cells.some(c=>c&&c.trim()))allRows.push(cells);
}
}
return allRows;
}

function parseCSV(text){
// Simple CSV/TSV parser handling quoted fields
const lines=text.split(/\r?\n/).filter(l=>l.trim());
const sep=lines[0]&&lines[0].indexOf('\t')>=0?'\t':',';
return lines.map(line=>{
const out=[];let cur='';let inQ=false;
for(let i=0;i<line.length;i++){
const c=line[i];
if(inQ){
if(c==='"'&&line[i+1]==='"'){cur+='"';i++}
else if(c==='"')inQ=false;
else cur+=c;
}else{
if(c==='"')inQ=true;
else if(c===sep){out.push(cur);cur=''}
else cur+=c;
}
}
out.push(cur);
return out;
});
}

function parseRowsAndImport(rows,orgId,forcedTeamId,dryRun,statusEl,previewEl,bg){
if(!rows||!rows.length){statusEl.innerHTML='<span style="color:var(--bad)">No data found</span>';return}
const header=rows[0].map(h=>String(h||'').toLowerCase().trim());
const findCol=(...names)=>header.findIndex(h=>names.some(n=>h===n||h.includes(n)));
const c={
name:findCol('player','name','golfer'),
school:findCol('school','team','league'),
hcp:findCol('hcp','handicap'),
score:findCol('score','total'),
gender:findCol('gender','sex'),
dob:findCol('dob','birth','born'),
phone:findCol('phone','cell','mobile'),
email:findCol('email'),
};
if(c.name<0){statusEl.innerHTML='<span style="color:var(--bad)">No "Name" or "Player" column found</span>';return}
const dataRows=rows.slice(1).filter(r=>r&&r[c.name]&&String(r[c.name]).trim());
if(!dataRows.length){statusEl.innerHTML='<span style="color:var(--bad)">No data rows</span>';return}

const teams=DB.teams();
const forcedTeam=forcedTeamId?teams.find(t=>t.id===forcedTeamId):null;
const existingNames=new Set(DB.golfers().filter(g=>g.orgId===orgId).map(g=>g.name.toLowerCase()));
const newTeamNames=new Set();
const planned=[];
for(const row of dataRows){
const name=String(row[c.name]||'').trim();
if(!name)continue;
let schoolName,team;
if(forcedTeam){
schoolName=forcedTeam.name;
team=forcedTeam;
}else{
schoolName=c.school>=0?String(row[c.school]||'').trim():'';
team=schoolName?teams.find(t=>t.orgId===orgId&&t.name.toLowerCase()===schoolName.toLowerCase()):null;
if(schoolName&&!team)newTeamNames.add(schoolName);
}
const hcpRaw=c.hcp>=0?row[c.hcp]:'';
const scoreRaw=c.score>=0?row[c.score]:'';
const hcpNum=parseInt(hcpRaw)||0;
const scoreNum=parseInt(scoreRaw)||0;
const finalHcp=(hcpRaw!==''&&hcpRaw!=null)?hcpNum:(scoreNum?Math.max(0,scoreNum-72):0);
let gender='male';
if(c.gender>=0){
const g=String(row[c.gender]||'').toLowerCase().trim();
if(g.startsWith('f'))gender='female';
else if(g.startsWith('o'))gender='other';
}
planned.push({
name,schoolName,team,
handicap:finalHcp,
score:scoreNum||null,
gender,
dob:c.dob>=0?String(row[c.dob]||''):'',
phone:c.phone>=0?String(row[c.phone]||''):'',
email:c.email>=0?String(row[c.email]||''):'',
duplicate:existingNames.has(name.toLowerCase()),
});
}

previewEl.style.display='block';
previewEl.innerHTML='';
const tbl=el('table');
tbl.appendChild(el('thead',{},el('tr',{},
el('th',{},'Name'),el('th',{},'School'),el('th',{},'HCP'),
el('th',{},'Score'),el('th',{},'Status'))));
const tbody=el('tbody');
for(const p of planned){
let st=p.duplicate?'Duplicate (skip)':(p.team?'OK':(p.schoolName?'Will create team':'No team'));
let stColor=p.duplicate?'var(--warn)':'var(--good)';
tbody.appendChild(el('tr',{},
el('td',{},p.name),
el('td',{},p.schoolName||'\u2014'),
el('td',{},String(p.handicap)),
el('td',{},p.score?String(p.score):'\u2014'),
el('td',{style:{color:stColor,fontSize:'.8rem'}},st)));
}
tbl.appendChild(tbody);
previewEl.appendChild(tbl);

const newCount=newTeamNames.size;
const dupCount=planned.filter(p=>p.duplicate).length;
const addCount=planned.length-dupCount;
const where=forcedTeam?(' all to '+forcedTeam.name):'';
statusEl.innerHTML='<span>Will add '+addCount+' people'+where+', skip '+dupCount+
' duplicates'+(forcedTeam?'':', create '+newCount+' new teams')+'.</span>';

if(dryRun)return;

const allTeams=DB.teams();
const allGolfers=DB.golfers();
const teamByName={};
for(const t of allTeams)teamByName[(t.orgId||'')+'|'+t.name.toLowerCase()]=t;
let teamsCreated=0,golfersAdded=0,skipped=0;
for(const p of planned){
if(p.duplicate){skipped++;continue}
let team=p.team||teamByName[orgId+'|'+(p.schoolName||'').toLowerCase()];
if(!team&&p.schoolName&&!forcedTeam){
team={id:'tm-'+uid(),name:p.schoolName,type:'school',color:'#1f6f43',
gender:'boys',orgId:orgId};
allTeams.push(team);
teamByName[orgId+'|'+p.schoolName.toLowerCase()]=team;
teamsCreated++;
}
allGolfers.push({
id:'gf-'+uid(),name:p.name,handicap:p.handicap,
teamId:team?team.id:null,orgId:orgId,
gender:p.gender,dob:p.dob,phone:p.phone,email:p.email,
roles:['golfer']
});
golfersAdded++;
}
if(teamsCreated>0)DB.setTeams(allTeams);
DB.setGolfers(allGolfers);
statusEl.innerHTML='<span style="color:var(--good)">\u2713 Imported '+golfersAdded+
' people, created '+teamsCreated+' teams, skipped '+skipped+' duplicates.</span>';
toast('Imported '+golfersAdded+' people');
setTimeout(()=>{bg.remove();render()},1100);
}

// Walk-the-course green-tagging tool. Admin opens this, walks to each green,
// taps "Tag this hole" to capture GPS. Coords persist on the course record
// and are read by the live-distance display in the scoring view.
function showTagGreens(courseId){
const bg=el('div',{class:'modal-bg',onclick:e=>{if(e.target===bg)bg.remove();}});
const m=el('div',{class:'modal',style:{maxWidth:'520px'}});
const courses=DB.courses();
const c=courses.find(x=>x.id===courseId);
if(!c){toast('Course not found');return;}
const total=c.greens||(c.par?c.par.length:18);
m.appendChild(el('h3',{style:{marginBottom:'.2rem'}},'Tag Greens \u2014 '+c.name));
m.appendChild(el('small',{style:{display:'block',color:'var(--muted)',marginBottom:'.7rem',lineHeight:'1.35'}},
'Walk to each green, stand on the center, then tap Tag. Hold still ~15 seconds while it collects 15 GPS samples. Rejects if final accuracy is worse than \u00b130m.'));

const listWrap=el('div',{style:{maxHeight:'60vh',overflowY:'auto',
border:'1px solid var(--line)',borderRadius:'8px'}});
const draw=()=>{
listWrap.innerHTML='';
const greens=Array.isArray(c.holeGreens)?c.holeGreens:Array(total).fill(null);
const holesPlayed=Array.isArray(c.par)?c.par.length:total;
const split=total<holesPlayed; // 9-green / 18-tee layout
for(let i=0;i<total;i++){
const g=greens[i];
const row=el('div',{style:{display:'flex',alignItems:'center',gap:'.5rem',
padding:'.5rem .7rem',borderBottom:'1px solid var(--line-soft)'}});
// Show "Green 1 (H1+H10)" on split layouts, "H1" on standard 18-green courses.
const label=split
?'Green '+(i+1)+' (H'+(i+1)+'+H'+(i+1+total)+')'
:'H'+(i+1);
row.appendChild(el('div',{style:{minWidth:'128px',fontWeight:700,fontSize:'.95em'}},
label));
const status=el('div',{style:{flex:1,fontSize:'.85em'}});
if(g&&typeof g.lat==='number'){
status.style.color='var(--good)';
status.textContent='\u2713 '+g.lat.toFixed(5)+', '+g.lng.toFixed(5);
}else{
status.style.color='var(--muted)';
status.style.fontStyle='italic';
status.textContent='not tagged';
}
row.appendChild(status);
const tagBtn=el('button',{class:'btn small'},g?'Re-tag':'Tag');
tagBtn.onclick=async function(){
tagBtn.disabled=true;
const origTxt=tagBtn.textContent;
tagBtn.textContent='Sample 0/15';
try{
// Live progress: show each incoming sample's accuracy so the user can
// see the GPS warming up. Stop early if we hit 15 samples or 25s.
const pos=await getGpsAveraged(15,25000,function(prog){
tagBtn.textContent='Sample '+prog.count+'/15 \u00b1'+Math.round(prog.accuracy)+'m';
});
// Reject if median accuracy still terrible (>30m). That's >33yd and unfit
// for distance display. User can re-tag once GPS lock improves.
if(pos.accuracy>30){
toast('Still \u00b1'+Math.round(pos.accuracy)+'m — wait 30s and retry');
tagBtn.disabled=false;tagBtn.textContent=g?'Re-tag':'Tag';
return;
}
const cs=DB.courses();
const cur=cs.find(x=>x.id===courseId);
if(!cur){toast('Course gone');return;}
if(!Array.isArray(cur.holeGreens)||cur.holeGreens.length!==total){
cur.holeGreens=Array(total).fill(null);
if(Array.isArray(c.holeGreens)){for(let j=0;j<Math.min(c.holeGreens.length,total);j++)cur.holeGreens[j]=c.holeGreens[j]||null;}
}
cur.holeGreens[i]={lat:pos.lat,lng:pos.lng,accuracy:Math.round(pos.accuracy||0)};
DB.setCourses(cs);
c.holeGreens=cur.holeGreens;
toast('H'+(i+1)+' \u2713 \u00b1'+Math.round(pos.accuracy)+'m ('+pos.samplesUsed+'/'+pos.samplesTotal+' samples)');
draw();
}catch(e){
tagBtn.disabled=false;
tagBtn.textContent=g?'Re-tag':'Tag';
toast('GPS error: '+(e.message||e));
}
};
row.appendChild(tagBtn);
if(g){
const clearBtn=el('button',{class:'btn small ghost',style:{padding:'.25rem .5rem'}},'\u2715');
clearBtn.onclick=function(){
if(!confirm('Clear hole '+(i+1)+' coords?'))return;
const cs=DB.courses();
const cur=cs.find(x=>x.id===courseId);
if(cur&&Array.isArray(cur.holeGreens)){
cur.holeGreens[i]=null;
DB.setCourses(cs);
c.holeGreens=cur.holeGreens;
draw();
}
};
row.appendChild(clearBtn);
}
listWrap.appendChild(row);
}
};
draw();
m.appendChild(listWrap);

// Footer: progress + done
const footer=el('div',{style:{marginTop:'.7rem',display:'flex',justifyContent:'space-between',
alignItems:'center',gap:'.5rem'}});
const progEl=el('small',{style:{color:'var(--muted)'}});
const updateProg=()=>{
const greens=Array.isArray(c.holeGreens)?c.holeGreens:[];
const tagged=greens.filter(g=>g&&typeof g.lat==='number').length;
progEl.textContent=tagged+' of '+total+' tagged';
};
updateProg();
const closeBtn=el('button',{class:'btn',onclick:()=>{bg.remove();render();}},'Done');
footer.appendChild(progEl);
footer.appendChild(closeBtn);
// Re-update progress on each tag — listWrap.draw is closed over but progress lives outside;
// the easiest path is a periodic poll while modal open.
const poller=setInterval(updateProg,500);
const origRemove=bg.remove.bind(bg);
bg.remove=function(){clearInterval(poller);origRemove();};
m.appendChild(footer);

bg.appendChild(m);document.body.appendChild(bg);
}

// Verify Greens — rangefinder accuracy check tool.
//
// Workflow: admin walks (or carts) to any spot they can sight to a green
// from. Taps Verify on that hole. App collects GPS samples to fix their
// current position, computes distance to the tagged green, then prompts
// them to enter what their rangefinder reads. Saves the {calculated, actual,
// position, ts} record to course.holeVerifications[greenIdx].
//
// Over a few rounds, this exposes which greens have bad GPS tags (large
// systematic deltas) so the admin can re-tag them. NOT used at runtime
// to "correct" distances — verification data informs which tags need
// re-doing, the fix is at the tag layer not a calibration layer.
function showVerifyGreens(courseId){
const bg=el('div',{class:'modal-bg',onclick:e=>{if(e.target===bg)bg.remove();}});
const m=el('div',{class:'modal',style:{maxWidth:'560px'}});
const courses=DB.courses();
const c=courses.find(function(x){return x.id===courseId;});
if(!c){toast('Course not found');return;}
const total=c.greens||(c.par?c.par.length:18);
const holesPlayed=Array.isArray(c.par)?c.par.length:total;
const split=total<holesPlayed;

m.appendChild(el('h3',{style:{marginBottom:'.2rem'}},'\uD83C\uDFAF Verify Greens \u2014 '+c.name));
m.appendChild(el('small',{style:{display:'block',color:'var(--muted)',marginBottom:'.7rem',lineHeight:'1.4'}},
'Stand on a yardage marker (red 100 / white 150 / blue 200). Tap Verify on the hole that marker serves. App reads your GPS and compares its calculated distance to the marker\'s known yardage. Use this between rounds to find greens that need re-tagging. (Custom button available for rangefinder reads or non-standard markers.)'));

const listWrap=el('div',{style:{maxHeight:'55vh',overflowY:'auto',
border:'1px solid var(--line)',borderRadius:'8px'}});
m.appendChild(listWrap);

const draw=function(){
listWrap.innerHTML='';
const greens=Array.isArray(c.holeGreens)?c.holeGreens:[];
const verifs=Array.isArray(c.holeVerifications)?c.holeVerifications:[];
for(let i=0;i<total;i++){
const g=greens[i];
const greenLabel=split
?'Green '+(i+1)+' (H'+(i+1)+'+H'+(i+1+total)+')'
:'Hole '+(i+1);
const records=Array.isArray(verifs[i])?verifs[i]:[];
const row=el('div',{style:{padding:'.6rem .8rem',
borderBottom:'1px solid var(--line-soft)'}});
const top=el('div',{style:{display:'flex',alignItems:'center',gap:'.5rem'}});
top.appendChild(el('div',{style:{flex:1,fontWeight:600}},greenLabel));

if(!g||typeof g.lat!=='number'){
top.appendChild(el('small',{style:{color:'var(--muted)',fontStyle:'italic'}},'not tagged'));
row.appendChild(top);
listWrap.appendChild(row);
continue;
}

// Stats row if we have records
if(records.length){
// Mean error in yards (negative = calculated short, positive = calculated long)
let sumErr=0;
for(const r of records)sumErr+=(r.calculated-r.actual);
const meanErr=Math.round(sumErr/records.length);
const sign=meanErr>0?'+':(meanErr<0?'':'\u00b10');
const errColor=Math.abs(meanErr)<=5?'var(--good)':(Math.abs(meanErr)<=15?'#b8651b':'var(--bad)');
top.appendChild(el('small',{style:{color:errColor,fontWeight:600}},
records.length+' read'+(records.length===1?'':'s')+' \u00b7 avg '+sign+meanErr+' yd'));
}

const btn=el('button',{class:'btn small'},records.length?'+ Verify':'Verify');
btn.onclick=function(){verifyOnce(c.id,i,greenLabel,btn,draw);};
top.appendChild(btn);
row.appendChild(top);

// Show last 3 records inline if any
if(records.length){
const last3=records.slice(-3).reverse();
for(const r of last3){
const err=r.calculated-r.actual;
const sign=err>0?'+':(err<0?'':'\u00b10');
const errColor=Math.abs(err)<=5?'var(--good)':(Math.abs(err)<=15?'#b8651b':'var(--bad)');
row.appendChild(el('div',{style:{fontSize:'.78em',color:'var(--muted)',
marginTop:'.2rem',paddingLeft:'.5rem'}},
'calc '+r.calculated+' \u00b7 actual '+r.actual+' \u00b7 '+
el('span',{style:{color:errColor,fontWeight:600}},sign+err+' yd').textContent+
(r.ts?' \u00b7 '+r.ts.slice(0,10):'')));
}
}

listWrap.appendChild(row);
}
};
draw();

const footer=el('div',{style:{marginTop:'.7rem',display:'flex',gap:'.5rem',
justifyContent:'space-between',alignItems:'center'}});
const summaryBtn=el('button',{class:'btn small ghost',
onclick:function(){showVerifySummary(c.id);}},'\uD83D\uDCCA Summary');
footer.appendChild(summaryBtn);
footer.appendChild(el('button',{class:'btn',onclick:function(){bg.remove();render();}},'Done'));
m.appendChild(footer);

bg.appendChild(m);document.body.appendChild(bg);
}

// Single verification flow: get user's GPS-averaged position, compute distance
// to the green's tagged center, ask user for the rangefinder reading, save.
function verifyOnce(courseId,greenIdx,greenLabel,btn,onDone){
btn.disabled=true;
const origTxt=btn.textContent;
btn.textContent='Sample 0/15';

getGpsAveraged(15,25000,function(prog){
btn.textContent='Sample '+prog.count+'/15 \u00b1'+Math.round(prog.accuracy)+'m';
}).then(function(pos){
if(pos.accuracy>30){
toast('GPS only \u00b1'+Math.round(pos.accuracy)+'m \u2014 try again with clearer sky');
btn.disabled=false;btn.textContent=origTxt;
return;
}
// Fetch fresh course state (in case it changed)
const courses=DB.courses();
const c=courses.find(function(x){return x.id===courseId;});
if(!c){toast('Course not found');btn.disabled=false;btn.textContent=origTxt;return;}
const greens=Array.isArray(c.holeGreens)?c.holeGreens:[];
const g=greens[greenIdx];
if(!g||typeof g.lat!=='number'){
toast('Green not tagged');btn.disabled=false;btn.textContent=origTxt;return;
}
const calculated=distanceYards(pos.lat,pos.lng,g.lat,g.lng);
btn.disabled=false;btn.textContent=origTxt;
// Now prompt for rangefinder reading
showVerifyEntry(c.id,greenIdx,greenLabel,calculated,pos,onDone);
}).catch(function(e){
btn.disabled=false;btn.textContent=origTxt;
toast('GPS error: '+(e.message||e));
});
}

verifierName:me?me.name:'unknown'
});
DB.setCourses(cs);
const delta=calculated-actual;
const sign=delta>0?'+':(delta<0?'':'\u00b10');
toast(greenLabel+' \u2713 calc '+calculated+' / '+(markerLabel||'custom')+' '+actual+' ('+sign+delta+' yd)');

};

// Per-course summary view: which greens have good/bad calibration based on
// accumulated verification data. Marketing claim driver — when this shows
// "all greens within \u00b15 yards," the course is laser-verified.
function showVerifySummary(courseId){
const bg=el('div',{class:'modal-bg',onclick:e=>{if(e.target===bg)bg.remove();}});
const m=el('div',{class:'modal',style:{maxWidth:'520px'}});
const c=DB.courses().find(function(x){return x.id===courseId;});
if(!c){toast('Course not found');return;}
const total=c.greens||(c.par?c.par.length:18);
const holesPlayed=Array.isArray(c.par)?c.par.length:total;
const split=total<holesPlayed;
const verifs=Array.isArray(c.holeVerifications)?c.holeVerifications:[];

m.appendChild(el('h3',{style:{marginBottom:'.3rem'}},'\uD83D\uDCCA Verification Summary'));
m.appendChild(el('small',{style:{display:'block',color:'var(--muted)',marginBottom:'.7rem'}},c.name));

// Aggregate: total reads, mean abs error, worst green
let totalReads=0;
let sumAbsErr=0;
let worstGreen=-1,worstAvg=0;
const perGreen=[];
for(let i=0;i<total;i++){
const records=Array.isArray(verifs[i])?verifs[i]:[];
if(!records.length){perGreen.push(null);continue;}
let sumErr=0;
for(const r of records)sumErr+=(r.calculated-r.actual);
const meanErr=sumErr/records.length;
totalReads+=records.length;
sumAbsErr+=Math.abs(meanErr)*records.length;
perGreen.push({count:records.length,meanErr:meanErr});
if(Math.abs(meanErr)>Math.abs(worstAvg)){worstAvg=meanErr;worstGreen=i;}
}

const overall=el('div',{style:{padding:'.7rem',background:'var(--cream)',
borderRadius:'8px',marginBottom:'.7rem',fontSize:'.95em'}});
if(totalReads){
overall.appendChild(el('div',{style:{marginBottom:'.3rem'}},
el('strong',{},'Total verifications: '),''+totalReads));
const avgAbsErr=Math.round(sumAbsErr/totalReads);
const errColor=avgAbsErr<=5?'var(--good)':(avgAbsErr<=15?'#b8651b':'var(--bad)');
overall.appendChild(el('div',{style:{marginBottom:'.3rem'}},
el('strong',{},'Average accuracy: '),
el('span',{style:{color:errColor,fontWeight:600}},'\u00b1'+avgAbsErr+' yd')));
if(worstGreen>=0){
const wLabel=split?'Green '+(worstGreen+1):'Hole '+(worstGreen+1);
const sign=worstAvg>0?'+':(worstAvg<0?'':'');
overall.appendChild(el('div',{},
el('strong',{},'Needs attention: '),wLabel+' avg '+sign+Math.round(worstAvg)+' yd'));
}
}else{
overall.appendChild(el('em',{style:{color:'var(--muted)'}},'No verifications recorded yet.'));
}
m.appendChild(overall);

// Per-green list
const list=el('div',{style:{maxHeight:'40vh',overflowY:'auto',
border:'1px solid var(--line)',borderRadius:'8px'}});
for(let i=0;i<total;i++){
const greenLabel=split?'Green '+(i+1):'Hole '+(i+1);
const data=perGreen[i];
const row=el('div',{style:{padding:'.5rem .7rem',
borderBottom:'1px solid var(--line-soft)',display:'flex',
justifyContent:'space-between',alignItems:'center'}});
row.appendChild(el('div',{style:{fontWeight:600}},greenLabel));
if(!data){
row.appendChild(el('small',{style:{color:'var(--muted)',fontStyle:'italic'}},'no reads'));
}else{
const meanRound=Math.round(data.meanErr);
const sign=meanRound>0?'+':(meanRound<0?'':'\u00b10');
const errColor=Math.abs(meanRound)<=5?'var(--good)':(Math.abs(meanRound)<=15?'#b8651b':'var(--bad)');
row.appendChild(el('div',{style:{fontSize:'.9em'}},
el('span',{style:{color:'var(--muted)'}},data.count+'\u00d7 '),
el('span',{style:{color:errColor,fontWeight:600}},'avg '+sign+meanRound+' yd')));
}
list.appendChild(row);
}
m.appendChild(list);

m.appendChild(el('div',{style:{marginTop:'.7rem'}},
el('button',{class:'btn ghost full',onclick:()=>bg.remove()},'Close')));

bg.appendChild(m);document.body.appendChild(bg);
}

const wrap=el('div');

// Bug #5: gate Side Games behind the event lock. Side games depend on
// finalized pairings (Best Ball pairs assume real groups, Nassau matches
// reference checked-in players, etc.) so they shouldn't be configurable
// until the director has locked the event.
if(!t.eventLocked){
const card=el('div',{class:'card',style:{textAlign:'center',padding:'2rem 1rem'}});
card.appendChild(el('div',{style:{fontSize:'2.4rem',marginBottom:'.5rem'}},'\uD83D\uDD13'));

const idx=STEPS.indexOf('Pairings');
State.tid=t.id;if(idx>=0)State.step=idx;render();
}},'Go to Pairings step'));

}

// Unified "+ New Challenge" — asks type first, then routes to type-specific player picker.

onclick:()=>{activeTab=tab;State.sgTab=tab;renderTabs();}},tabLabels[tab]));

// Type-first challenge picker: Best Ball / Nassau / Skins. After type selection,
// builds the type-specific context (saved, saveSG, etc.) and opens the existing
// add-modal so we reuse the player-selection UI without duplication.
function showNewChallengePicker(t){
const bg=el('div',{class:'modal-bg',onclick:e=>{if(e.target===bg)bg.remove()}});
const m=el('div',{class:'modal',style:{maxWidth:'440px'}});
m.appendChild(el('h3',{style:{marginBottom:'.4rem'}},'New Challenge'));
m.appendChild(el('small',{style:{display:'block',color:'var(--muted)',marginBottom:'.9rem'}},
'Pick the challenge type. Pairing follows automatically.'));

const types=[
{key:'bestball',title:'Best Ball',
sub:'2 vs 2 team match \u2014 lower of each pair per hole',
pairing:'Team (2 vs 2)'},
{key:'nassau',title:'Nassau',
sub:'1 vs 1 stroke match with F9 / B9 / Total bets (gross by default; net optional)',
pairing:'Individual (1 vs 1)'},
{key:'skins',title:'Skins',
sub:'Lowest unique score per hole wins the pot. Auto-computed from scores.',
pairing:'Field-wide \u2014 no setup'}
];

const launchType=(type)=>{
bg.remove();
State.sgTab=type;
if(type==='bestball'){
const golfers=DB.golfers();
const course=DB.courses().find(c=>c.id===t.courseId);
const par=course?course.par:Array(18).fill(4);
const holes=t.holes||18;
const pairings=t.pairings||[];
if(pairings.length<2){
toast('Need at least 2 groups in Pairings before creating a Best Ball challenge');
return;
}
const sgKey='sideGames_bb';
const saved=((t.sideGames||{})[sgKey])||{matches:[],holePoints:50,birdiePoints:100,hole10Restart:true};
const saveSG=(updated)=>{
updateTournament(t.id,x=>{
x.sideGames=x.sideGames||{};
x.sideGames[sgKey]=updated;
return x;
});
render();
};
showAddBBMatch(t,saved,golfers,pairings,par,holes,saveSG,null);
}else if(type==='nassau'){
const golfers=DB.golfers();

if(checked.length<2){
