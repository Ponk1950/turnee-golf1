// ── Best Ball Challenge (LGCC format) ────────────────────────────────────────
// 2 players from one group vs 2 players from another group
// 50pts per hole won, auto press at 2-up, birdies 100pts separate
function BestBallPanel(t){
const wrap=el('div');
const golfers=DB.golfers();
const course=DB.courses().find(c=>c.id===t.courseId);
const par=course?course.par:Array(18).fill(4);
const holes=t.holes||18;
const pairings=t.pairings||[];

if(pairings.length<2){
wrap.appendChild(el('div',{class:'card empty'},'Need at least 2 groups with scores.'));
return wrap;
}

// Load or init side game data on tournament
const sgKey='sideGames_bb';
const saved=((t.sideGames||{})[sgKey])||{matches:[],holePoints:50,birdiePoints:100,hole10Restart:true};
if(saved.hole10Restart===undefined)saved.hole10Restart=true;
// Persist helper
const saveSG=(data)=>{
updateTournament(t.id,x=>{
x.sideGames=x.sideGames||{};
x.sideGames[sgKey]=data;
return x;
});
};

// Settings bar
const settingsBar=el('div',{style:{display:'flex',gap:'.6rem',alignItems:'center',
flexWrap:'wrap',marginBottom:'1rem',padding:'.5rem .7rem',
background:'var(--surface)',borderRadius:'8px',border:'1px solid var(--line)'}});
const hpInp=el('input',{type:'number',value:saved.holePoints||50,
style:{width:'60px',fontWeight:700},
onchange:e=>{saved.holePoints=+e.target.value||50;saveSG(saved);render();}});
const bpInp=el('input',{type:'number',value:saved.birdiePoints||100,
style:{width:'60px',fontWeight:700},
onchange:e=>{saved.birdiePoints=+e.target.value||100;saveSG(saved);render();}});
const h10Inp=el('input',{type:'checkbox',checked:!!saved.hole10Restart,
onchange:e=>{saved.hole10Restart=!!e.target.checked;saveSG(saved);render();}});
settingsBar.appendChild(el('span',{style:{fontSize:'.85em',fontWeight:600}},'Hole win:'));
settingsBar.appendChild(hpInp);
settingsBar.appendChild(el('span',{style:{fontSize:'.85em',color:'var(--muted)'}},'pts'));
settingsBar.appendChild(el('span',{style:{fontSize:'.85em',fontWeight:600,marginLeft:'.5rem'}},'Birdie:'));
settingsBar.appendChild(bpInp);
settingsBar.appendChild(el('span',{style:{fontSize:'.85em',color:'var(--muted)'}},'pts (best ball)'));
settingsBar.appendChild(el('label',{style:{display:'flex',alignItems:'center',gap:'.3rem',marginLeft:'.6rem',fontSize:'.85em',fontWeight:600,cursor:'pointer'}},
h10Inp,
el('span',{},'Hole-10 restart')));
settingsBar.appendChild(el('span',{style:{fontSize:'.85em',color:'var(--muted)',marginLeft:'auto'}},'2-up auto press'));
wrap.appendChild(settingsBar);

// (No second "+ New Challenge" button here — top-right global one is the
// canonical entry point. Removed per bug #9.)
if(!saved.matches||!saved.matches.length){
wrap.appendChild(el('div',{class:'card empty'},'No challenges set up yet. Tap "+ New Challenge" to set one up.'));
return wrap;
}

// Render each match
saved.matches.forEach((match,mi)=>{
wrap.appendChild(renderBBMatch(match,mi,t,par,holes,saved,golfers,saveSG,wrap));
});
return wrap;
}

function showAddBBMatch(t,saved,golfers,pairings,par,holes,saveSG,wrap){
const bg=el('div',{class:'modal-bg',onclick:e=>{if(e.target===bg)bg.remove();}});
const m=el('div',{class:'modal'});
m.appendChild(el('h3',{style:{marginBottom:'1rem'}},'New Best Ball Challenge'));

// Flat list of all players with group label
const allPlayers=[];
pairings.forEach((grp,gi)=>{
grp.members.forEach(mem=>{
const g=golfers.find(x=>x.id===mem.golferId);
if(g)allPlayers.push({id:g.id,name:g.name,
groupLabel:'G'+(gi+1)+(grp.teeTime?' '+grp.teeTime:'')+(grp.startingHole?' H'+grp.startingHole:''),
gi});
});
});
allPlayers.sort((a,b)=>a.name.localeCompare(b.name));

// Selection state
const selA=new Set(),selB=new Set();
let activeTeam='A';
const statusEl=el('div',{style:{fontSize:'.85em',color:'var(--muted)',marginBottom:'.5rem',minHeight:'1.2em'}});
const createBtn=el('button',{class:'btn',disabled:true},'Create Challenge');

const updateStatus=()=>{
const aOk=selA.size===2,bOk=selB.size===2;
const aNames=Array.from(selA).map(id=>allPlayers.find(p=>p.id===id)?.name.split(' ').pop()).join(' & ');
const bNames=Array.from(selB).map(id=>allPlayers.find(p=>p.id===id)?.name.split(' ').pop()).join(' & ');
statusEl.textContent=aOk&&bOk?aNames+' vs '+bNames:
activeTeam==='A'?'Select 2 players for Team A ('+selA.size+'/2 selected)':
'Select 2 players for Team B ('+selB.size+'/2 selected)';
createBtn.disabled=!(aOk&&bOk);
renderList();
};

// Team toggle
const teamToggle=el('div',{class:'btn-row',style:{marginBottom:'.6rem'}});
const btnA=el('button',{class:'btn small',onclick:()=>{activeTeam='A';updateStatus();}},'Picking Team A');
const btnB=el('button',{class:'btn secondary small',onclick:()=>{activeTeam='B';updateStatus();}},'Picking Team B');
teamToggle.appendChild(btnA);teamToggle.appendChild(btnB);
m.appendChild(teamToggle);
m.appendChild(statusEl);

// Player list
const listDiv=el('div',{style:{maxHeight:'320px',overflowY:'auto',border:'1px solid var(--line)',borderRadius:'8px',marginBottom:'1rem'}});
m.appendChild(listDiv);

const renderList=()=>{
listDiv.innerHTML='';
// Group by pairing group
const byGroup={};
allPlayers.forEach(p=>{
if(!byGroup[p.gi])byGroup[p.gi]=[];
byGroup[p.gi].push(p);
});
Object.keys(byGroup).sort((a,b)=>+a-+b).forEach(gi=>{
const grpPlayers=byGroup[gi];
const grpHdr=el('div',{style:{padding:'.3rem .6rem',background:'var(--surface)',
fontWeight:700,fontSize:'.8em',color:'var(--muted)',borderBottom:'1px solid var(--line)'}},
grpPlayers[0].groupLabel);
listDiv.appendChild(grpHdr);
grpPlayers.forEach(p=>{
const inA=selA.has(p.id),inB=selB.has(p.id);
const bg=inA?'var(--green)':inB?'var(--green-dark)':'var(--paper)';
const col=inA||inB?'#fff':'var(--ink)';
const badge=inA?'Team A':inB?'Team B':'';
const row=el('div',{style:{
padding:'.45rem .8rem',borderBottom:'1px solid var(--line-soft)',
display:'flex',justifyContent:'space-between',alignItems:'center',
background:bg,color:col,cursor:'pointer'
},onclick:()=>{
if(inA){selA.delete(p.id);updateStatus();return;}
if(inB){selB.delete(p.id);updateStatus();return;}
if(activeTeam==='A'&&selA.size<2){selA.add(p.id);if(selA.size===2)activeTeam='B';}
else if(activeTeam==='B'&&selB.size<2){selB.add(p.id);}
updateStatus();
}});
row.appendChild(el('span',{},p.name));
if(badge)row.appendChild(el('span',{style:{fontSize:'.75em',fontWeight:700,
padding:'1px 6px',borderRadius:'10px',background:'rgba(255,255,255,.25)'}},badge));
listDiv.appendChild(row);
});
});
// Update team button styles
btnA.className='btn'+(activeTeam==='A'?' small':' secondary small');
btnB.className='btn'+(activeTeam==='B'?' small':' secondary small');
};
renderList();

createBtn.onclick=()=>{
if(selA.size!==2||selB.size!==2)return;
// Check no overlap
for(const id of selA){if(selB.has(id)){alert('Same player in both teams');return;}}
saved.matches=saved.matches||[];
saved.matches.push({id:'bb-'+Date.now(),
pairA:Array.from(selA),pairB:Array.from(selB)});
saveSG(saved);bg.remove();render();
};
m.appendChild(el('div',{class:'btn-row'},
el('button',{class:'btn ghost',onclick:()=>bg.remove()},'Cancel'),
createBtn));
bg.appendChild(m);document.body.appendChild(bg);
updateStatus();
}

function renderBBMatch(match,mi,t,par,holes,saved,golfers,saveSG,wrap){
const holePoints=saved.holePoints||50;
const birdiePoints=saved.birdiePoints||100;
const nameA=match.pairA.map(id=>{const g=golfers.find(x=>x.id===id);return g?g.name.split(' ').pop():'?';}).join(' & ');
const nameB=match.pairB.map(id=>{const g=golfers.find(x=>x.id===id);return g?g.name.split(' ').pop():'?';}).join(' & ');

const card=el('div',{class:'card',style:{marginBottom:'1rem',padding:0,overflow:'hidden'}});

// Header
const hdr=el('div',{style:{padding:'.6rem .8rem',background:'var(--green)',color:'#fff',
display:'flex',justifyContent:'space-between',alignItems:'center'}});
hdr.appendChild(el('div',{style:{fontWeight:700}},nameA+' vs '+nameB));
hdr.appendChild(el('button',{class:'btn ghost small',style:{color:'#fff',borderColor:'rgba(255,255,255,.4)'},
onclick:()=>{
if(!confirm2('Remove this match?'))return;
saved.matches.splice(mi,1);saveSG(saved);render();
}},'✕'));
card.appendChild(hdr);

// Compute best ball per hole per pair
const getBest=(ids,h)=>{
const vals=ids.map(id=>{const sc=(t.scores||{})[id];return sc&&sc.holeScores?sc.holeScores[h]||0:0;}).filter(v=>v>0);
return vals.length?Math.min(...vals):0;
};

// Match computation with auto press + optional hole-10 restart + weighted team-best-ball birdies.
// Birdie credits per HOLE (best-ball, not per individual): birdie=1, eagle=2, albatross=3.
const computeMatch=()=>{
const useH10=!!saved.hole10Restart && holes>=18;
// Define one or two segments. Each segment runs its own bet chain (Main + presses).
const segs=useH10?[{start:0,end:9,label:'F9'},{start:9,end:holes,label:'B9'}]:[{start:0,end:holes,label:'Match'}];

const results=[];
let aBirdieCredits=0,bBirdieCredits=0;

// Pre-fill results so they line up by hole index even if scores are missing
for(let h=0;h<holes;h++){
const as=getBest(match.pairA,h),bs=getBest(match.pairB,h);
const p=par[h]||4;
let winner=null;
if(as&&bs){if(as<bs)winner='a';else if(bs<as)winner='b';}
const aCredit=as&&as<p?(p-as):0;
const bCredit=bs&&bs<p?(p-bs):0;
aBirdieCredits+=aCredit;
bBirdieCredits+=bCredit;
const birdies=[];
if(aCredit>0)birdies.push({team:'a',label:aCredit===1?'Birdie':aCredit===2?'Eagle':aCredit>=3?'Albatross':''});
if(bCredit>0)birdies.push({team:'b',label:bCredit===1?'Birdie':bCredit===2?'Eagle':bCredit>=3?'Albatross':''});
results.push({h,as,bs,winner,par:p,birdies,aCredit,bCredit});
}

// Run bet chains per segment
const allBets=[];
segs.forEach((seg,segIdx)=>{
const segLabel=segs.length>1?seg.label+' ':'';
const bets=[{id:0,start:seg.start,segStart:seg.start,segEnd:seg.end,label:segLabel+'Main',aUp:0,pressed:false}];
for(let h=seg.start;h<seg.end;h++){
const r=results[h];
if(r.winner==='a'||r.winner==='b'){
bets.forEach(bet=>{if(h<bet.start)return;if(r.winner==='a')bet.aUp++;else bet.aUp--;});
}
// 2-up auto press (only if not at last hole of the segment)
if(h<seg.end-1){
bets.forEach(bet=>{
if(bet.pressed||h<bet.start)return;
if(Math.abs(bet.aUp)>=2){
bet.pressed=true;
const pressNum=bets.filter(b=>b.label.indexOf('Press')>=0).length+1;
bets.push({id:bets.length,start:h+1,segStart:seg.start,segEnd:seg.end,label:segLabel+'Press '+pressNum,aUp:0,pressed:false});
}
});
}
}
allBets.push(...bets);
});

// Compute points per bet
const betResults=allBets.map(bet=>{
let aHoles=0,bHoles=0;
for(let h=bet.start;h<bet.segEnd;h++){
const r=results[h];
if(r.winner==='a')aHoles++;else if(r.winner==='b')bHoles++;
}
const aPoints=aHoles*holePoints,bPoints=bHoles*holePoints;
return {...bet,aHoles,bHoles,aPoints,bPoints,
net:aPoints-bPoints,
label2:bet.label+(bet.start>bet.segStart?' (from H'+(bet.start+1)+')':'')};
});

const aBirdiePoints=aBirdieCredits*birdiePoints;
const bBirdiePoints=bBirdieCredits*birdiePoints;
const totalA=betResults.reduce((s,b)=>s+b.aPoints,0)+aBirdiePoints;
const totalB=betResults.reduce((s,b)=>s+b.bPoints,0)+bBirdiePoints;

return {results,betResults,aBirdies:aBirdieCredits,bBirdies:bBirdieCredits,aBirdiePoints,bBirdiePoints,totalA,totalB};
};

const {results,betResults,aBirdies,bBirdies,aBirdiePoints,bBirdiePoints,totalA,totalB}=computeMatch();

// Points summary
const summaryDiv=el('div',{style:{padding:'.6rem .8rem',borderBottom:'1px solid var(--line-soft)'}});

// Bet rows
betResults.forEach(bet=>{
const net=bet.aPoints-bet.bPoints;
const winner=net>0?nameA:net<0?nameB:'Tied';
const col=net>0?'var(--green-dark)':net<0?'var(--bad)':'var(--muted)';
summaryDiv.appendChild(el('div',{style:{display:'grid',gridTemplateColumns:'1fr auto auto auto',
gap:'.3rem .6rem',padding:'.2rem 0',borderBottom:'1px solid var(--line-soft)',
alignItems:'center',fontSize:'.85em'}},
el('span',{style:{fontWeight:600}},bet.label2),
el('span',{style:{color:'var(--green-dark)',fontWeight:700}},nameA+': '+bet.aPoints+'pts'),
el('span',{style:{color:'var(--bad)',fontWeight:700}},nameB+': '+bet.bPoints+'pts'),
el('span',{style:{color:col,fontWeight:700}},net===0?'AS':winner+' +'+(Math.abs(net)))));
});

// Birdies row
if(aBirdies||bBirdies){
summaryDiv.appendChild(el('div',{style:{display:'grid',gridTemplateColumns:'1fr auto auto auto',
gap:'.3rem .6rem',padding:'.25rem 0',alignItems:'center',fontSize:'.85em',
background:'var(--surface)',borderRadius:'4px',padding:'.3rem .4rem',marginTop:'.3rem'}},
el('span',{style:{fontWeight:600}},'🐦 Best-ball credits (B=1, E=2, Alb=3)'),
el('span',{style:{color:'var(--green-dark)',fontWeight:700}},nameA+': '+aBirdiePoints+'pts ('+aBirdies+')'),
el('span',{style:{color:'var(--bad)',fontWeight:700}},nameB+': '+bBirdiePoints+'pts ('+bBirdies+')'),
el('span',{style:{fontWeight:700}},(aBirdiePoints>bBirdiePoints?nameA:aBirdiePoints<bBirdiePoints?nameB:'Tied'))));
}

// Total
const netTotal=totalA-totalB;
summaryDiv.appendChild(el('div',{style:{display:'grid',gridTemplateColumns:'1fr auto auto auto',
gap:'.3rem .6rem',padding:'.3rem 0 0',alignItems:'center',
fontWeight:700,borderTop:'2px solid var(--line-soft)',marginTop:'.3rem'}},
el('span',{},'TOTAL'),
el('span',{style:{color:'var(--green-dark)'}},nameA+': '+totalA+'pts'),
el('span',{style:{color:'var(--bad)'}},nameB+': '+totalB+'pts'),
el('span',{style:{color:netTotal>0?'var(--green-dark)':netTotal<0?'var(--bad)':'var(--muted)',fontSize:'1.05em'}},
netTotal===0?'EVEN':(netTotal>0?nameA:nameB)+' +'+(Math.abs(netTotal)))));
card.appendChild(summaryDiv);

// Horizontal scorecard — mini-style layout:
// HOLE | PAR | Team A individuals | Team A BEST | Bet rows (Main / Press k) | Team B BEST | Team B individuals | Win
const initOf=(name)=>{const f=name.split('&')[0].trim();return f.charAt(0).toUpperCase()||'?'};
let initA=initOf(nameA),initB=initOf(nameB);
if(initA===initB){initA='A';initB='B'}

const cellCss='border:1px solid var(--line-soft);text-align:center;padding:3px 5px;min-width:28px;font-size:.78em';
const cellMutedCss=cellCss+';color:var(--muted);background:#fafafa';
const hdrCss='border:1px solid var(--line-soft);text-align:center;padding:3px 5px;background:var(--green);color:#fff;font-weight:700;font-size:.78em;min-width:28px';
const subTotCss='border:1px solid var(--line-soft);text-align:center;padding:3px 5px;background:#2d5a27;color:#fff;font-weight:700;font-size:.78em;min-width:38px';
const grandTotCss='border:1px solid var(--line-soft);text-align:center;padding:3px 5px;background:#1f4419;color:#fff;font-weight:700;font-size:.78em;min-width:42px';
const labelCss='border:1px solid var(--line-soft);text-align:right;padding:3px 7px;background:var(--surface);font-weight:700;font-size:.78em;white-space:nowrap;min-width:120px';
const labelHdrCss='border:1px solid var(--line-soft);text-align:right;padding:3px 7px;background:var(--green);color:#fff;font-weight:700;font-size:.78em;white-space:nowrap;min-width:120px';
const labelBestCss=labelCss+';background:#d6edda;color:#1f4419';
const labelBetCss=labelCss+';background:#fff8e1;color:#7a5b00';

const scWrap=el('div',{style:{padding:'.4rem',overflowX:'auto'}});
const sc=document.createElement('table');
sc.style.cssText='border-collapse:collapse;margin:0';

const addCell=(row,text,css)=>{
const c=document.createElement('td');
if(text!=null&&text!=='')c.textContent=text;
c.style.cssText=css||cellCss;
row.appendChild(c);
return c;
};

// HEADER ROW: Hole | 1..9 | OUT | 10..18 | IN | TOT
const headerRow=document.createElement('tr');
addCell(headerRow,'Hole',labelHdrCss);
for(let h=0;h<9;h++)addCell(headerRow,h+1,hdrCss);
if(holes>=18){
addCell(headerRow,'OUT',subTotCss);
for(let h=9;h<holes;h++)addCell(headerRow,h+1,hdrCss);
addCell(headerRow,'IN',subTotCss);
}else{
addCell(headerRow,'OUT',subTotCss);
}
addCell(headerRow,'TOT',grandTotCss);

// PAR ROW
const parRow=document.createElement('tr');
addCell(parRow,'Par',labelCss);
let f9Par=0,b9Par=0;
for(let h=0;h<9;h++){const p=par[h]||4;addCell(parRow,p);f9Par+=p;}
if(holes>=18){
addCell(parRow,f9Par,subTotCss);
for(let h=9;h<holes;h++){const p=par[h]||4;addCell(parRow,p);b9Par+=p;}
addCell(parRow,b9Par,subTotCss);
}else{
addCell(parRow,f9Par,subTotCss);
}
addCell(parRow,f9Par+b9Par,grandTotCss);

// Individual player row builder
const playerRow=(playerId,teamKey)=>{
const g=golfers.find(x=>x.id===playerId);
const name=g?g.name:'?';
const sc1=(t.scores||{})[playerId];
const scores=sc1&&sc1.holeScores?sc1.holeScores:[];
const r=document.createElement('tr');
addCell(r,name,labelCss);
let f9=0,b9=0;
const drawHole=(h)=>{
const v=scores[h]||0;
const p=par[h]||4;
const txt=v?String(v):'';
let css=cellCss;
if(v){
if(v<p-1)css+=';background:#f6c543;color:#1f4419;font-weight:700'; // eagle+: gold
else if(v===p-1)css+=';background:#fff4c4;color:#7a5b00;font-weight:700'; // birdie: light gold
else if(v===p+1)css+=';color:#7a5b00'; // bogey: muted
else if(v>=p+2)css+=';color:#a04040'; // double+: red
}
addCell(r,txt,css);
if(v){if(h<9)f9+=v;else b9+=v;}
};
for(let h=0;h<9;h++)drawHole(h);
if(holes>=18){
addCell(r,f9||'',subTotCss);
for(let h=9;h<holes;h++)drawHole(h);
addCell(r,b9||'',subTotCss);
}else{
addCell(r,f9||'',subTotCss);
}
addCell(r,(f9+b9)||'',grandTotCss);
return r;
};

// Team best-ball row builder
const bbRow=(rowName,teamKey)=>{
const r=document.createElement('tr');
addCell(r,rowName,labelBestCss);
let f9=0,b9=0;
const drawHole=(h)=>{
const res=results[h];
const v=teamKey==='a'?res.as:res.bs;
const credit=teamKey==='a'?res.aCredit:res.bCredit;
const ico=credit>=3?'\uD83D\uDC09':credit===2?'\uD83E\uDD85':credit===1?'\uD83D\uDC26':'';
const txt=v?(ico?ico+' '+v:String(v)):'';
let css=cellCss+';background:#eaf5ec';
if(res.winner===teamKey)css+=';background:#d6edda;color:#1f4419;font-weight:700';
else if(res.winner&&res.winner!==teamKey)css+=';color:var(--muted)';
addCell(r,txt,css);
if(v){if(h<9)f9+=v;else b9+=v;}
};
for(let h=0;h<9;h++)drawHole(h);
if(holes>=18){
addCell(r,f9||'',subTotCss);
for(let h=9;h<holes;h++)drawHole(h);
addCell(r,b9||'',subTotCss);
}else{
addCell(r,f9||'',subTotCss);
}
addCell(r,(f9+b9)||'',grandTotCss);
return r;
};

// Press-start lookup (segment-aware)
const pressStartHoles=new Set(betResults.filter(b=>b.label.indexOf('Press')>=0).map(b=>b.start));

// Bet row builder — parallel F9 / B9 layout for one press level
// betsAtLevel can contain 1 or 2 bets (one per segment in restart mode, or one spanning all in non-restart mode).
const fmtRunning=(aUp)=>aUp===0?'AS':(aUp>0?initA+'+'+aUp:initB+'+'+(-aUp));
const betRow=(rowLabel,betsAtLevel)=>{
const r=document.createElement('tr');
addCell(r,rowLabel,labelBetCss);
// Find which bet (if any) covers a given hole h.
const betCovering=(h)=>betsAtLevel.find(b=>h>=b.start&&h<b.segEnd)||null;
// Compute running aUp for a bet at a given hole (after that hole's result).
const runningAt=(bet,h)=>{
let aUp=0;
for(let i=bet.start;i<=h;i++){
const w=results[i].winner;
if(w==='a')aUp++;else if(w==='b')aUp--;
}
return aUp;
};
const drawHole=(h)=>{
const bet=betCovering(h);
if(!bet){addCell(r,'',cellMutedCss);return;}
const w=results[h].winner;
const hasScore=results[h].as||results[h].bs;
if(!hasScore){addCell(r,'',cellMutedCss);return;}
const aUp=runningAt(bet,h);
const txt=fmtRunning(aUp);
let css=cellCss+';font-weight:600;font-size:.7em';
if(w==='a')css+=';background:#eaf5ec';
else if(w==='b')css+=';background:#f8e9e6';
if(pressStartHoles.has(h))css+=';box-shadow:inset 0 0 0 2px #f1c40f';
addCell(r,txt,css);
};
// F9 cells
for(let h=0;h<9;h++)drawHole(h);
// F9 OUT cell — show final delta for the F9 bet at this level (or non-restart bet's status at H8)
const f9Bet=betsAtLevel.find(b=>b.segStart===0);
if(holes>=18){
if(f9Bet){
const lastF9=Math.min(8,f9Bet.segEnd-1);
const delta=runningAt(f9Bet,lastF9);
addCell(r,delta===0?'AS':fmtRunning(delta),subTotCss);
}else addCell(r,'',subTotCss);
// B9 cells
for(let h=9;h<holes;h++)drawHole(h);
// B9 IN cell
const b9Bet=betsAtLevel.find(b=>b.segStart===9)||(betsAtLevel.find(b=>b.segStart===0&&b.segEnd>=18));
if(b9Bet){
const lastB9=Math.min(holes-1,b9Bet.segEnd-1);
const delta=runningAt(b9Bet,lastB9);
addCell(r,delta===0?'AS':fmtRunning(delta),subTotCss);
}else addCell(r,'',subTotCss);
}else{
if(f9Bet){
const last=Math.min(holes-1,f9Bet.segEnd-1);
const delta=runningAt(f9Bet,last);
addCell(r,delta===0?'AS':fmtRunning(delta),subTotCss);
}else addCell(r,'',subTotCss);
}
// TOT cell — only meaningful for non-restart Main (single bet covers full match)
const fullBet=betsAtLevel.find(b=>b.segStart===0&&b.segEnd>=holes);
if(fullBet){
const delta=runningAt(fullBet,Math.min(holes-1,fullBet.segEnd-1));
addCell(r,delta===0?'AS':fmtRunning(delta),grandTotCss);
}else addCell(r,'',grandTotCss);
return r;
};

// Group bets by press level. Level 0 = Main. Level k = Press k.
const levelOf=(bet)=>{
if(bet.label.indexOf('Press')<0)return 0;
const m=bet.label.match(new RegExp('Press\\s+(\\d+)'));
return m?+m[1]:0;
};
const byLevel={};
betResults.forEach(b=>{
const k=levelOf(b);
(byLevel[k]=byLevel[k]||[]).push(b);
});
const levels=Object.keys(byLevel).map(Number).sort((a,b)=>a-b);

// WIN ROW
const winRow=document.createElement('tr');
addCell(winRow,'Win',labelCss);
let f9aH=0,f9bH=0,b9aH=0,b9bH=0;
const drawWin=(h,seg)=>{
const w=results[h].winner;
const hasScore=results[h].as||results[h].bs;
let txt='';
let css=cellCss;
if(w==='a'){txt=initA;css+=';background:var(--green);color:#fff;font-weight:700';if(seg==='f')f9aH++;else b9aH++;}
else if(w==='b'){txt=initB;css+=';background:#c0392b;color:#fff;font-weight:700';if(seg==='f')f9bH++;else b9bH++;}
else if(hasScore){txt='\u2014';css+=';color:var(--muted)';}
if(pressStartHoles.has(h))css+=';box-shadow:inset 0 0 0 2px #f1c40f';
addCell(winRow,txt,css);
};
for(let h=0;h<9;h++)drawWin(h,'f');
if(holes>=18){
const f9d=f9aH-f9bH;
addCell(winRow,f9d>0?initA+'+'+f9d:f9d<0?initB+'+'+(-f9d):'AS',subTotCss);
for(let h=9;h<holes;h++)drawWin(h,'b');
const b9d=b9aH-b9bH;
addCell(winRow,b9d>0?initA+'+'+b9d:b9d<0?initB+'+'+(-b9d):'AS',subTotCss);
}else{
const d=f9aH-f9bH;
addCell(winRow,d>0?initA+'+'+d:d<0?initB+'+'+(-d):'AS',subTotCss);
}
const totA=f9aH+b9aH,totB=f9bH+b9bH,totD=totA-totB;
addCell(winRow,totD>0?initA+'+'+totD:totD<0?initB+'+'+(-totD):'AS',grandTotCss);

// Assemble: Hole, Par, A players, A BEST, bet rows, B BEST, B players, Win
const tbody=document.createElement('tbody');
tbody.appendChild(headerRow);
tbody.appendChild(parRow);
match.pairA.forEach(pid=>tbody.appendChild(playerRow(pid,'a')));
tbody.appendChild(bbRow(nameA+' BEST','a'));
levels.forEach(k=>{
const rowLabel=k===0?'Main':'Press '+k;
tbody.appendChild(betRow(rowLabel,byLevel[k]));
});
tbody.appendChild(bbRow(nameB+' BEST','b'));
match.pairB.forEach(pid=>tbody.appendChild(playerRow(pid,'b')));
tbody.appendChild(winRow);
sc.appendChild(tbody);
scWrap.appendChild(sc);

// Press legend (yellow-bordered cells = press start hole)
const presses=betResults.filter(b=>b.label.indexOf('Press')>=0);
if(presses.length){
const lg=el('div',{style:{padding:'.2rem .6rem .5rem',fontSize:'.72em',color:'var(--muted)',display:'flex',gap:'.5rem',alignItems:'center',flexWrap:'wrap'}});
lg.appendChild(el('span',{style:{display:'inline-block',width:'14px',height:'14px',border:'2px solid #f1c40f',borderRadius:'2px'}}));
lg.appendChild(el('span',{},'press starts: '+presses.map(p=>p.label2).join(' \u00b7 ')));
scWrap.appendChild(lg);
}

card.appendChild(scWrap);
return card;
}

function renderNassau(match,mi,t,saved,golfers,saveSG){
const betPoints=saved.betPoints||50;
const ga=golfers.find(x=>x.id===match.playerA),gb=golfers.find(x=>x.id===match.playerB);
if(!ga||!gb)return el('div',{});
const na=ga.name.split(' ').pop(),nb=gb.name.split(' ').pop();
const scA=((t.scores||{})[match.playerA]||{}).holeScores||[];
const scB=((t.scores||{})[match.playerB]||{}).holeScores||[];
const holes=t.holes||18;

// Bug #3: Default Nassau is GROSS, not net. Net scoring only when the user
// explicitly opted in via the "Use handicap" checkbox at match creation.
// Existing matches without the flag (older seed/data) compare gross too.
const useHandicap=match.useHandicap===true;
const hcpA=Number.isFinite(ga.hcp)?ga.hcp:Number(ga.handicap)||0;
const hcpB=Number.isFinite(gb.hcp)?gb.hcp:Number(gb.handicap)||0;
const diff=useHandicap?Math.abs(hcpA-hcpB):0;
const recipient=useHandicap&&hcpA>hcpB?'a':useHandicap&&hcpB>hcpA?'b':null;
const frontStrokes=Math.ceil(diff/2),backStrokes=Math.floor(diff/2);
const aStrokesF=recipient==='a'?frontStrokes:0,aStrokesB=recipient==='a'?backStrokes:0;
const bStrokesF=recipient==='b'?frontStrokes:0,bStrokesB=recipient==='b'?backStrokes:0;

const grossSum=(arr,start,end)=>{
let s=0,ok=false;
for(let h=start;h<end&&h<holes;h++){
const v=arr[h]||0;
if(v>0){s+=v;ok=true;}else{return {sum:0,complete:false};}
}
return {sum:s,complete:ok};
};

const scoreSegment=(start,end,aSt,bSt)=>{
const ag=grossSum(scA,start,end),bg=grossSum(scB,start,end);
if(!ag.complete||!bg.complete)return {complete:false,aPoints:0,bPoints:0,net:0,aGross:ag.sum,bGross:bg.sum,aNet:null,bNet:null,aSt,bSt};
const aNet=ag.sum-aSt,bNet=bg.sum-bSt;
let winner=null;
if(aNet<bNet)winner='a';else if(bNet<aNet)winner='b';
const aPoints=winner==='a'?betPoints:0,bPoints=winner==='b'?betPoints:0;
return {complete:true,winner,aGross:ag.sum,bGross:bg.sum,aNet,bNet,aSt,bSt,aPoints,bPoints,net:aPoints-bPoints};
};

const front=scoreSegment(0,9,aStrokesF,bStrokesF);
const back=scoreSegment(9,18,aStrokesB,bStrokesB);
const total=scoreSegment(0,18,aStrokesF+aStrokesB,bStrokesF+bStrokesB);
const totalA=front.aPoints+back.aPoints+total.aPoints;
const totalB=front.bPoints+back.bPoints+total.bPoints;

const card=el('div',{class:'card',style:{marginBottom:'1rem',padding:0,overflow:'hidden'}});
const hdr=el('div',{style:{padding:'.5rem .8rem',background:'var(--green-dark)',color:'#fff',
display:'flex',justifyContent:'space-between',alignItems:'center'}});
hdr.appendChild(el('span',{style:{fontWeight:700}},na+' vs '+nb+' \u2014 Nassau ('+(useHandicap?'net':'gross')+')'));
hdr.appendChild(el('button',{class:'btn ghost small',style:{color:'#fff',borderColor:'rgba(255,255,255,.4)'},
onclick:()=>{if(!confirm2('Remove?'))return;saved.matches.splice(mi,1);saveSG(saved);render();}},'\u2715'));
card.appendChild(hdr);

// Handicap strip — only shown for net Nassau. Gross matches don't need it.
if(useHandicap){
const strip=el('div',{style:{padding:'.4rem .8rem',background:'var(--surface)',borderBottom:'1px solid var(--line-soft)',
fontSize:'.8em',display:'flex',flexWrap:'wrap',gap:'.6rem',alignItems:'center'}});
strip.appendChild(el('span',{style:{fontWeight:700,color:'var(--muted)'}},'Handicaps:'));
strip.appendChild(el('span',{},na+' HCP '+hcpA));
strip.appendChild(el('span',{},nb+' HCP '+hcpB));
if(diff>0){
const recipName=recipient==='a'?na:nb;
strip.appendChild(el('span',{style:{color:'var(--good)',fontWeight:700}},
recipName+' gets '+frontStrokes+' on F9 \u00b7 '+backStrokes+' on B9 \u00b7 '+diff+' total'));
}else{
strip.appendChild(el('span',{style:{fontStyle:'italic',color:'var(--muted)'}},'Equal handicaps \u2014 straight gross compare'));
}
card.appendChild(strip);
}

const body=el('div',{style:{padding:'.6rem .8rem'}});
const rows=[
['Front 9',front],
['Back 9',back],
['Total',total]
];
const lbl=useHandicap?'net':'gross';
rows.forEach(([rowLbl,seg])=>{
const aDisp=seg.complete?(useHandicap?seg.aNet:seg.aGross):'\u2014';
const bDisp=seg.complete?(useHandicap?seg.bNet:seg.bGross):'\u2014';
const margin=seg.complete?(seg.winner?'+'+(Math.abs((useHandicap?seg.aNet:seg.aGross)-(useHandicap?seg.bNet:seg.bGross)))+' stroke'+(Math.abs((useHandicap?seg.aNet:seg.aGross)-(useHandicap?seg.bNet:seg.bGross))===1?'':'s'):''):'';
const col=seg.complete?(seg.winner==='a'?'var(--green-dark)':seg.winner==='b'?'var(--bad)':'var(--muted)'):'var(--muted)';
const ptsStr=seg.complete?(seg.winner?(seg.winner==='a'?na:nb)+' wins '+betPoints+'pts':'AS \u2014 push'):'(incomplete)';
const aDetail=seg.complete&&useHandicap&&seg.aSt?' ('+seg.aGross+'-'+seg.aSt+')':'';
const bDetail=seg.complete&&useHandicap&&seg.bSt?' ('+seg.bGross+'-'+seg.bSt+')':'';
body.appendChild(el('div',{style:{display:'grid',gridTemplateColumns:'80px 1fr 1fr 1fr',
gap:'.3rem',padding:'.35rem 0',borderBottom:'1px solid var(--line-soft)',alignItems:'center',fontSize:'.85em'}},
el('span',{style:{fontWeight:600}},rowLbl),
el('span',{style:{color:'var(--green-dark)'}},na+' '+lbl+': '+aDisp+aDetail),
el('span',{style:{color:'var(--bad)'}},nb+' '+lbl+': '+bDisp+bDetail),
el('span',{style:{color:col,fontWeight:700}},ptsStr+(margin?' \u00b7 '+margin:''))));
});
body.appendChild(el('div',{style:{display:'grid',gridTemplateColumns:'80px 1fr 1fr 1fr',
gap:'.3rem',padding:'.4rem 0 0',fontWeight:700,borderTop:'2px solid var(--line)',marginTop:'.3rem',fontSize:'.9em'}},
el('span',{},'POINTS'),
el('span',{style:{color:'var(--green-dark)'}},na+': '+totalA+'pts'),
el('span',{style:{color:'var(--bad)'}},nb+': '+totalB+'pts'),
el('span',{style:{color:totalA>totalB?'var(--green-dark)':totalA<totalB?'var(--bad)':'var(--muted)'}},
totalA===totalB?'EVEN':(totalA>totalB?na:nb)+' +'+(Math.abs(totalA-totalB)))));
card.appendChild(body);
return card;
}

// ── Skins ────────────────────────────────────────────────────────────────────
function SkinsPanel(t){
const card=el('div',{class:'card'});
card.appendChild(el('h3',{},'Skins'));
card.appendChild(el('small',{},'Lowest score on each hole wins a skin. Ties carry over.'));
card.appendChild(el('div',{style:{height:'.6rem'}}));
const golfers=DB.golfers();
const holes=t.holes||18;
const checked=t.checkedIn||[];
const players=checked.map(id=>{
const g=golfers.find(x=>x.id===id);
const sc=(t.scores||{})[id];
const hs=(sc&&sc.holeScores)||[];
return {id,name:g?g.name:'?',scores:hs};
}).filter(p=>p.scores.some(s=>s>0));
if(players.length<2){
card.appendChild(el('div',{class:'empty'},'Need at least 2 players with scores.'));
return card;
}
let carryover=0;
const skinResults=[];
for(let h=0;h<holes;h++){
const vals=players.map(p=>({name:p.name,score:p.scores[h]||0})).filter(v=>v.score>0);
if(!vals.length){skinResults.push({h,winner:null,skins:0,carryover});continue;}
const min=Math.min(...vals.map(v=>v.score));
const winners=vals.filter(v=>v.score===min);
if(winners.length===1){
skinResults.push({h,winner:winners[0].name,skins:carryover+1,carryover:0});
carryover=0;
}else{
skinResults.push({h,winner:null,skins:0,carryover:carryover+1,tied:winners.map(v=>v.name)});
carryover++;
}
}
const tally={};
skinResults.forEach(r=>{if(r.winner){tally[r.winner]=(tally[r.winner]||0)+r.skins;}});
const sortedPlayers=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
if(sortedPlayers.length){
const sumCard=el('div',{style:{marginBottom:'1rem',padding:'.6rem',background:'var(--surface)',borderRadius:'8px',border:'1px solid var(--border)'}});
sumCard.appendChild(el('div',{style:{fontWeight:700,marginBottom:'.4rem'}},'Skin Totals'));
sortedPlayers.forEach(([name,skins])=>{
sumCard.appendChild(el('div',{style:{display:'flex',justifyContent:'space-between',padding:'.25rem 0',borderBottom:'1px solid var(--line-soft)'}},
el('span',{},name),el('span',{style:{fontWeight:700,color:'var(--green-dark)'}},skins+' skin'+(skins!==1?'s':''))));
});
if(carryover>0)sumCard.appendChild(el('div',{style:{color:'var(--muted)',fontSize:'.85em',marginTop:'.3rem'}},carryover+' skin'+(carryover!==1?'s':'')+' carrying over'));
card.appendChild(sumCard);
}
const tbl=document.createElement('table');
tbl.style.cssText='width:100%;border-collapse:collapse;font-size:.8em';
const thead=document.createElement('thead');
const hdrRow=document.createElement('tr');
['Hole','Winner','Skins'].forEach(h=>{const th=document.createElement('th');th.textContent=h;th.style.cssText='padding:4px 6px;text-align:center;background:var(--green);color:#fff';hdrRow.appendChild(th);});
thead.appendChild(hdrRow);tbl.appendChild(thead);
const tbody=document.createElement('tbody');
skinResults.forEach(r=>{
if(!r.winner&&!r.tied)return;
const tr=document.createElement('tr');
[r.h+1,r.winner?r.winner:'Tied ('+r.tied.join(', ')+')',r.winner?r.skins+' \uD83C\uDFAF':'carry \u2192 '+r.carryover].forEach((v,i)=>{
const td=document.createElement('td');td.textContent=v;
td.style.cssText='padding:4px 6px;text-align:center;border-bottom:1px solid var(--line-soft)';
if(i===1&&r.winner)td.style.fontWeight='700',td.style.color='var(--green-dark)';
if(i===1&&!r.winner)td.style.color='var(--muted)',td.style.fontStyle='italic';
tr.appendChild(td);});
tbody.appendChild(tr);});
tbl.appendChild(tbody);
card.appendChild(tbl);
return card;
}

// ============================================================================
// HELP QUEUE — admin triage of bugs and enhancement requests
// ============================================================================

// Export the help queue as a self-contained JSON document. On PC this offers
// a download; on iPad (where Safari downloads of in-memory blobs are flaky)
// the user falls back to clipboard copy and pastes into a chat or email.
// The output is structured so the dev can parse and triage in one paste.
function showExportHelpReports(){
const bugs=DB.bugs();
const enhs=DB.enhancements();
const me=State.user;
const payload={
app:'turnee-golf',
build:APP_BUILD,
seedVersion:SEED_VERSION,
exportedAt:new Date().toISOString(),
exporter:me?{userId:me.id,name:me.name}:{userId:null,name:'unknown'},
counts:{bugs:bugs.length,enhancements:enhs.length},
bugs:bugs,
enhancements:enhs
};
const json=JSON.stringify(payload,null,2);
const fname='turnee-help-'+(new Date().toISOString().slice(0,10))+'.json';

const bg=el('div',{class:'modal-bg',onclick:e=>{if(e.target===bg)bg.remove();}});
const m=el('div',{class:'modal',style:{maxWidth:'560px'}});
m.appendChild(el('h3',{style:{marginBottom:'.3rem'}},'\uD83D\uDCE4 Export Help Reports'));
m.appendChild(el('small',{style:{display:'block',color:'var(--muted)',marginBottom:'.7rem'}},
bugs.length+' bug'+(bugs.length===1?'':'s')+' and '+enhs.length+' enhancement'+
(enhs.length===1?'':'s')+'. Hand this file (or paste this JSON) to the dev to triage.'));

const ta=el('textarea',{readonly:true,
style:{width:'100%',minHeight:'9rem',padding:'.5rem',fontSize:'.78em',
fontFamily:'monospace',border:'1px solid var(--line)',borderRadius:'8px',
boxSizing:'border-box',resize:'vertical'}});
ta.value=json;
m.appendChild(ta);

const status=el('div',{style:{fontSize:'.82em',color:'var(--muted)',
minHeight:'1.2em',marginTop:'.4rem'}});
m.appendChild(status);

const btnRow=el('div',{class:'btn-row',style:{marginTop:'.7rem',flexWrap:'wrap'}});
// Download path — best on PC. iPad Safari may show "no app to open .json"
// but typically still saves to Files; fallback below covers when it doesn't.
const dlBtn=el('button',{class:'btn',onclick:function(){
try{
const blob=new Blob([json],{type:'application/json'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;a.download=fname;
document.body.appendChild(a);a.click();
setTimeout(function(){
try{document.body.removeChild(a);URL.revokeObjectURL(url);}catch(e){}
},100);
status.textContent='Download started: '+fname;
}catch(e){
status.textContent='Download failed \u2014 try Copy instead. ('+(e.message||e)+')';
}
}},'\uD83D\uDCBE Download');
btnRow.appendChild(dlBtn);

// Clipboard path — works reliably on iPad when download doesn't.
const cpBtn=el('button',{class:'btn',onclick:async function(){
try{
if(navigator.clipboard&&navigator.clipboard.writeText){
await navigator.clipboard.writeText(json);
status.textContent='Copied. Paste into email or chat.';
}else{
ta.focus();ta.select();
document.execCommand('copy');
status.textContent='Copied (legacy). Paste into email or chat.';
}
}catch(e){
status.textContent='Copy failed \u2014 long-press the JSON above and Select All. ('+(e.message||e)+')';
}
}},'\uD83D\uDCCB Copy JSON');
btnRow.appendChild(cpBtn);

// Email path — pre-fills mailto so on iPad the share/Mail app opens with
// the JSON inline. Has a length cap (~2KB on some platforms) so this only
// works for small queues.
const emailBtn=el('button',{class:'btn ghost',onclick:function(){
const subj='Turnee help reports — '+payload.exportedAt.slice(0,10);
const safe=json.length<1800?json:'(JSON too large for mailto, use Copy or Download instead)';
const href='mailto:?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(safe);
try{location.href=href;}catch(e){status.textContent='Email failed: '+(e.message||e);}
}},'\u2709 Email');
btnRow.appendChild(emailBtn);

const closeBtn=el('button',{class:'btn ghost',onclick:()=>bg.remove()},'Close');
btnRow.appendChild(closeBtn);
m.appendChild(btnRow);

bg.appendChild(m);document.body.appendChild(bg);
}

function HelpQueuePage(){
const root=el('div');
const titleRow=el('div',{class:'row between',style:{alignItems:'center',marginBottom:'.3rem'}});
titleRow.appendChild(el('h1',{style:{margin:0}},'\u2753 Help Queue'));
titleRow.appendChild(el('button',{class:'btn small',
title:'Export bugs and enhancements as a file to share with the dev',
onclick:()=>showExportHelpReports()},'\uD83D\uDCE4 Export'));
root.appendChild(titleRow);
root.appendChild(el('small',{style:{display:'block',color:'var(--muted)',marginBottom:'.7rem'}},
'User-submitted bug reports and feature requests. localStorage-only for now \u2014 DB phase will sync to Supabase. Use Export to hand the queue to the dev when running standalone.'));

const tabBar=el('div',{class:'tab-bar',style:{marginBottom:'1rem'}});
const panels={};
const tabs=[
{key:'bugs',label:'\uD83D\uDC1B Bugs ('+DB.bugs().length+')'},
{key:'enh',label:'\u2728 Enhancements ('+DB.enhancements().length+')'}
];
let active='bugs';
const tabBtns={};
const drawTabs=()=>{
tabBar.innerHTML='';
for(const t of tabs){
const b=el('button',{class:'tab'+(t.key===active?' active':''),
onclick:()=>{active=t.key;drawTabs();drawPanels();}},t.label);
tabBtns[t.key]=b;
tabBar.appendChild(b);
}
};
panels.bugs=el('div',{style:{display:active==='bugs'?'block':'none'}});
panels.enh=el('div',{style:{display:active==='enh'?'block':'none'}});
const drawPanels=()=>{
panels.bugs.style.display=active==='bugs'?'block':'none';
panels.enh.style.display=active==='enh'?'block':'none';
};
drawTabs();
root.appendChild(tabBar);

// Bugs list
const bugs=DB.bugs().slice().reverse();
if(!bugs.length){
panels.bugs.appendChild(el('div',{class:'empty card'},'No bug reports yet.'));
}else{
for(const b of bugs){
const card=el('div',{class:'card',style:{marginBottom:'.6rem'}});
card.appendChild(el('div',{class:'row between',style:{marginBottom:'.3rem'}},
el('div',{},
el('span',{class:'pill '+(b.status==='reported'?'warn':'good')},b.status||'reported'),
el('span',{style:{marginLeft:'.5rem',fontWeight:600}},b.reporterName||'unknown'),
el('span',{style:{marginLeft:'.4rem',fontSize:'.8em',color:'var(--muted)'}},b.phone||'')
),
el('span',{style:{fontSize:'.78em',color:'var(--muted)'}},(b.createdAt||'').slice(0,16).replace('T',' '))
));
card.appendChild(el('div',{style:{marginBottom:'.3rem'}},
el('strong',{},'Wrong: '),
el('span',{},b.behavior)));
if(b.expected){
card.appendChild(el('div',{style:{marginBottom:'.3rem'}},
el('strong',{},'Expected: '),
el('span',{},b.expected)));
}
if(b.context){
const ctxStr=[
b.context.tournamentName?'Event: '+b.context.tournamentName:null,
b.context.page?'Page: '+b.context.page:null,
b.context.step!=null?'Step: '+b.context.step:null,
'Build: '+(b.context.build||'?')
].filter(Boolean).join(' \u00b7 ');
card.appendChild(el('small',{style:{color:'var(--muted)',display:'block',marginBottom:'.4rem'}},
'\uD83D\uDCCD '+ctxStr));
}
const btns=el('div',{class:'btn-row'});
const statusOptions=['reported','researching','queued','resolved','wontfix'];
for(const s of statusOptions){
if(s===b.status)continue;
btns.appendChild(el('button',{class:'btn small ghost',onclick:()=>{
const all=DB.bugs();const rec=all.find(function(x){return x.id===b.id;});
if(rec){rec.status=s;DB.setBugs(all);render();}
}},'\u2192 '+s));
}
btns.appendChild(el('button',{class:'btn small ghost',style:{color:'var(--bad)'},
onclick:()=>{
if(!confirm('Delete this bug report?'))return;
const all=DB.bugs().filter(function(x){return x.id!==b.id;});
DB.setBugs(all);render();
}},'Delete'));
card.appendChild(btns);
panels.bugs.appendChild(card);
}
}
root.appendChild(panels.bugs);

// Enhancements list
const enhs=DB.enhancements().slice().reverse();
if(!enhs.length){
panels.enh.appendChild(el('div',{class:'empty card'},'No enhancement requests yet.'));
}else{
for(const e of enhs){
const card=el('div',{class:'card',style:{marginBottom:'.6rem'}});
const priColor=e.priority==='high'?'var(--bad)':(e.priority==='low'?'var(--muted)':'var(--ink)');
card.appendChild(el('div',{class:'row between',style:{marginBottom:'.3rem'}},
el('div',{},
el('span',{class:'pill '+(e.status==='reported'?'warn':'good')},e.status||'reported'),
el('span',{style:{marginLeft:'.5rem',fontWeight:600}},e.reporterName||'unknown'),
el('span',{style:{marginLeft:'.4rem',fontSize:'.8em',color:'var(--muted)'}},e.phone||''),
el('span',{style:{marginLeft:'.5rem',fontSize:'.85em',color:priColor,fontWeight:600}},
'priority: '+(e.priority||'medium'))
),
el('span',{style:{fontSize:'.78em',color:'var(--muted)'}},(e.createdAt||'').slice(0,16).replace('T',' '))
));
card.appendChild(el('div',{style:{marginBottom:'.3rem'}},
el('strong',{},'Idea: '),
el('span',{},e.idea)));
if(e.useCase){
card.appendChild(el('div',{style:{marginBottom:'.3rem',fontStyle:'italic',color:'var(--muted)'}},
'Use case: '+e.useCase));
}
const btns=el('div',{class:'btn-row'});
const statusOptions=['reported','researching','planned','released','declined'];
for(const s of statusOptions){
if(s===e.status)continue;
btns.appendChild(el('button',{class:'btn small ghost',onclick:()=>{
const all=DB.enhancements();const rec=all.find(function(x){return x.id===e.id;});
if(rec){rec.status=s;DB.setEnhancements(all);render();}
}},'\u2192 '+s));
}
btns.appendChild(el('button',{class:'btn small ghost',style:{color:'var(--bad)'},
onclick:()=>{
if(!confirm('Delete this enhancement request?'))return;
const all=DB.enhancements().filter(function(x){return x.id!==e.id;});
DB.setEnhancements(all);render();
}},'Delete'));
card.appendChild(btns);
panels.enh.appendChild(card);
}
}
root.appendChild(panels.enh);

return root;
}

// ============================================================================
// INIT
// ============================================================================
try{
seedIfNeeded();
applyMigrations();
// Restore session — supports legacy (string user id) and new ({userId, activeOrgId}) shapes
const sessRaw=_lsGet(KEYS.session);
if(sessRaw){
let sessId=null,sessOrg=null;
try{
const parsed=JSON.parse(sessRaw);
if(parsed&&typeof parsed==='object'){sessId=parsed.userId||null;sessOrg=parsed.activeOrgId||null;}
else if(typeof parsed==='string')sessId=parsed;
}catch(e){sessId=sessRaw;}
if(sessId){
const u=DB.users().find(x=>x.id===sessId);
if(u){
normalizeUser(u);
State.user=u;
const orgIds=userOrgIds(u);
// If session had a saved org and user still has it, restore it; else pick primary
if(sessOrg&&orgIds.indexOf(sessOrg)>=0)State.activeOrgId=sessOrg;
else State.activeOrgId=orgIds[0]||null;
const pages=userPages(u);
State.page=pages[0]||'leaderboard';
}
}
}
render();
// Show a small banner if running with in-memory storage (sandbox)
if(_useMem){
const banner=el('div',{style:{position:'fixed',top:0,left:0,right:0,
background:'#fcefdc',color:'#b8651b',padding:'.5rem 1rem',fontSize:'.8rem',
textAlign:'center',zIndex:300,borderBottom:'1px solid #b8651b'}},
'Storage is read-only in this preview. Data will not be saved. Download the file and open it in Safari to use normally.');
document.body.appendChild(banner);
}
}catch(err){
console.error('Turnee Golf init error:',err);
const root=document.getElementById('app')||document.body;
root.innerHTML='';
const box=document.createElement('div');
box.style.cssText='padding:1.5rem;font-family:-apple-system,sans-serif;max-width:600px;margin:1rem auto';
box.innerHTML='<h2 style="color:#a31b1b">Turnee Golf failed to start</h2>'+
'<p>An error occurred during initialization:</p>'+
'<pre style="background:#fae0e0;padding:.8rem;border-radius:6px;overflow:auto;font-size:.8rem">'+
String(err&&(err.stack||err.message)||err).replace(/[<>&]/g,c=>({'<':'<','>':'>','&':'&'}[c]))+
'</pre>'+
'<p>Try opening this file directly in Safari (not in a sandbox/preview).</p>';
root.appendChild(box);
}

// Helpful for iPad: prevent double-tap zoom on buttons
document.addEventListener('dblclick',e=>{
if(e.target.closest('button,input,select,textarea'))e.preventDefault();
},{passive:false});

// Log version for debugging
console.log('Turnee Golf '+SEED_VERSION+' (build '+APP_BUILD+') loaded. Storage keys:',Object.values(KEYS));
console.log('To reset all data: localStorage.clear(); location.reload()');
</script>
